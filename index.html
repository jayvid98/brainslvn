 is a prominent early symptom of a brain tumor and is usually WORSE IN THE MORNING; dizziness and loss of balance are common too. In some patients a new onset seizure is the very first sign, and temporal lobe tumors can cause unusual odors. Diagnosis uses CT, MRI, PET, and possibly EEG, but not a lumbar puncture, which could cause herniation. Stabbing clusters around one eye describe a cluster headache.", "hook": "Tumor headache = morning headache. New seizure in an adult = think tumor.", "source": "Ch 14 pp 710 to 712; prof deck TBI slide 45; Ch 14 review question 2", "flag": null}, {"id": "W6_029", "topic": "Brain Tumor", "difficulty": "Basic", "type": "mc", "case": null, "adpie": "Planning", "answer": [0], "r1": {"stem": "Bernard, a ventriloquist, has had new morning headaches, and lately his puppet seems to be doing all the talking. The provider orders a brain tumor workup. Which test should the nurse question?", "options": ["Lumbar puncture", "CT scan with contrast", "MRI of the brain", "PET scan"]}, "r2": {"stem": "A ventriloquist with new morning headaches is being worked up for a possible brain tumor. Which ordered test needs to be clarified with the provider?", "options": ["A spinal tap", "A contrast CT of the head", "Magnetic resonance imaging of the brain", "Positron emission tomography"]}, "r3": {"stem": "As the LVN reviewing Bernard's diagnostic orders for a suspected brain tumor, which test do you question and report to the RN?", "options": ["Lumbar puncture", "CT with contrast, after checking for iodine and shellfish allergy", "MRI, after screening for metal and a pacemaker", "PET scan to look at brain metabolism"]}, "rationale": "A lumbar puncture is contraindicated when a brain tumor or increased ICP is possible, because suddenly lowering pressure in the spinal canal can cause brain herniation. CT is the basis of diagnosis; before a contrast CT, ask about iodine, shellfish, or dye allergy, keep the patient NPO 4 to 6 hours, and push fluids afterward. MRI shows more soft tissue detail and requires removing all metal and asking about a pacemaker. PET shows brain function and metabolism, and EEG may also be used.", "hook": "CT and MRI show anatomy, PET shows function. No LP with a possible tumor.", "source": "Ch 14 p 711 and review question 2; prof deck TBI slides 33 to 35, 45", "flag": "Asking about iodine and shellfish allergy before contrast is the exam answer, but current evidence says shellfish allergy is not a specific contrast risk (a prior contrast reaction is). On the exam, pick iodine and shellfish."}, {"id": "W6_030", "topic": "Adrenergic Agents", "difficulty": "Basic", "type": "mc", "case": null, "adpie": "Assessment", "answer": [1], "r1": {"stem": "Doris, 72, who live streams her bingo nights, was stung by a bee mid broadcast and receives epinephrine for anaphylaxis. Which effect of beta 1 stimulation does the nurse expect?", "options": ["Slower heart rate", "Faster heart rate and stronger contractions", "Pupil constriction and increased sweating", "More stomach acid and diarrhea"]}, "r2": {"stem": "A bingo streaming grandmother gets epinephrine for a severe allergic reaction to a bee sting. What beta 1 effect should the nurse anticipate?", "options": ["A decreased pulse", "An increased pulse with more forceful heartbeats", "Small pupils and heavy sweating", "Extra gastric acid and loose stools"]}, "r3": {"stem": "As the LVN monitoring a patient after epinephrine for anaphylaxis, which beta 1 effect do you expect to see on the monitor and report to the RN?", "options": ["A falling heart rate", "A rising heart rate with stronger contractions", "Constricted pupils with diaphoresis", "Abdominal cramping and diarrhea"]}, "rationale": "Epinephrine is the adrenergic (sympathomimetic) drug of choice for anaphylaxis. Adrenergic drugs mimic norepinephrine and epinephrine, the fight or flight messengers. Beta 1 receptors are in the heart, so stimulating them increases heart rate and the force of contraction. A slow pulse, constricted pupils, and sweating are cholinergic (parasympathetic) effects, the opposite system.", "hook": "Beta 1 = 1 heart. Beta 2 = 2 lungs.", "source": "Clayton Ch 12 pp 181 to 184; ideas from CLAY12_04, CLAY12_27", "flag": null}, {"id": "W6_031", "topic": "Adrenergic Agents", "difficulty": "Intermediate", "type": "sata", "case": null, "adpie": "Planning", "answer": [0, 2, 4], "r1": {"stem": "The pharmacy trivia team, the Receptor Wreckers, needs one more answer. Which drugs STIMULATE alpha 1 adrenergic receptors? Select all that apply.", "options": ["Norepinephrine", "Clonidine", "Phenylephrine", "Terazosin", "Dopamine"]}, "r2": {"stem": "Which medications act as alpha 1 adrenergic stimulators? Select all that apply.", "options": ["Norepinephrine infusion", "Clonidine tablets", "Phenylephrine", "Terazosin capsules", "Dopamine infusion"]}, "r3": {"stem": "As the LVN reviewing a patient's medication list, which drugs do you recognize as alpha 1 stimulators that can raise BP, so you check BP closely? Select all that apply.", "options": ["Norepinephrine, a vasopressor", "Clonidine, a blood pressure tablet", "Phenylephrine, a decongestant and vasopressor", "Terazosin, used for BPH and hypertension", "Dopamine, used for shock"]}, "rationale": "Norepinephrine, phenylephrine, and dopamine stimulate alpha 1 receptors, which constrict blood vessels and raise BP; that is why dopamine is used for shock and hypotension. Clonidine stimulates ALPHA 2 receptors (like guanfacine and methyldopa), which lowers BP. Terazosin BLOCKS alpha 1 receptors, the opposite action.", "hook": "Alpha 1 stimulators squeeze vessels: Nora, Phil, and Dopey raise the pressure.", "source": "Clayton Ch 12 pp 183 to 184; ideas from CLAY12_18, CLAY12_20, CLAY12_53", "flag": null}, {"id": "W6_032", "topic": "Adrenergic Agents", "difficulty": "Intermediate", "type": "mc", "case": null, "adpie": "Evaluation", "answer": [3], "r1": {"stem": "Ferdinand, a competitive leaf blower racer, is receiving an adrenergic medication. Which finding requires the nurse to contact the provider immediately?", "options": ["Mild facial flushing that fades", "Brief dizziness after the first dose that resolves", "Mild jitteriness that settles within the hour", "Chest pain"]}, "r2": {"stem": "A man getting an adrenergic drug reports several symptoms. Which one does the nurse report to the provider at once?", "options": ["Light flushing of the face that goes away", "Short lived lightheadedness after the first dose", "Feeling a little jittery for a short time", "Pain in the chest"]}, "r3": {"stem": "As the LVN evaluating a patient's response to an adrenergic drug, which finding do you report to the RN and provider right away?", "options": ["Flushing of the cheeks that is fading", "Dizziness with the first dose that has passed", "Brief jitteriness that has calmed down", "New anginal chest pain"]}, "rationale": "Adrenergic drugs speed the heart and squeeze vessels, so chest pain (angina), a rising BP, and nausea and vomiting must be reported right away. Flushing and dizziness usually resolve on their own. Take vital signs (HR and BP) before giving these drugs, and use extra caution with heart disease, hypertension, thyroid disease, or impaired liver function. Watch interactions: MAOIs (phenelzine) and tricyclics (amitriptyline) can cause toxicity, OTC cold remedies and diet pills add to the effect, and beta blockers such as propranolol cancel it.", "hook": "Adrenergic red flags: chest pain, climbing BP, vomiting.", "source": "Clayton Ch 12 pp 182 to 183; ideas from CLAY12_34, CLAY12_35, CLAY12_46, CLAY12_48", "flag": null}, {"id": "W6_033", "topic": "Beta Blockers", "difficulty": "Basic", "type": "mc", "case": null, "adpie": "Planning", "answer": [2], "r1": {"stem": "Wanda, a karaoke queen with asthma, needs a beta blocker for hypertension. Which drug is the SAFER choice?", "options": ["Propranolol", "Nadolol", "Metoprolol", "Timolol"]}, "r2": {"stem": "A karaoke star who has asthma needs a beta blocker for high BP. Which one carries the least risk to her airways?", "options": ["Propranolol tablets", "Nadolol tablets", "Metoprolol tablets", "Timolol tablets"]}, "r3": {"stem": "As the LVN reviewing new orders for a patient with asthma and hypertension, which beta blocker would you NOT need to question?", "options": ["Propranolol, a nonselective agent", "Nadolol, a long acting agent", "Metoprolol, a beta 1 selective agent", "Timolol, an oral and eye drop agent"]}, "rationale": "Metoprolol is a beta 1 selective blocker, so it mainly targets the heart and is less likely to cause bronchospasm. Propranolol, nadolol, and timolol (and carteolol) are NONselective: they also block beta 2 receptors in the lungs and can trigger bronchospasm. Question a nonselective beta blocker for any patient with asthma, bronchitis, emphysema, or allergic rhinitis.", "hook": "Selective Spares the lungs. Propranolol is a Problem for Pulmonary patients.", "source": "Clayton Ch 12 p 185; ideas from CLAY12_06, CLAY12_26, CLAY12_42", "flag": null}, {"id": "W6_034", "topic": "Beta Blockers", "difficulty": "Difficult", "type": "sata", "case": null, "adpie": "Assessment", "answer": [0, 1, 3, 4], "r1": {"stem": "Melvin, a professional pickle taster with diabetes, takes propranolol. Which findings could signal hypoglycemia even though the beta blocker hides some warning signs? Select all that apply.", "options": ["Headache", "Weakness", "Rapid, pounding heartbeat", "Blurred vision", "Poor coordination"]}, "r2": {"stem": "A man with diabetes who takes propranolol may not notice the usual low sugar signs. Which findings should still alert the nurse to hypoglycemia? Select all that apply.", "options": ["Head pain", "Feeling weak", "A racing, pounding pulse", "Vision that is blurry", "Clumsiness and unsteady movements"]}, "r3": {"stem": "As the LVN caring for a patient with diabetes on propranolol, which findings do you recognize as possible hypoglycemia, prompting a glucose check and a report to the RN? Select all that apply.", "options": ["New headache", "Generalized weakness", "Tachycardia with palpitations", "Blurred vision", "Decreased coordination"]}, "rationale": "Beta blockers MASK the usual warning signs of hypoglycemia, especially the fast pounding heartbeat, because they block the sympathetic response. So a patient with diabetes on a beta blocker may show only headache, weakness, blurred vision, or poor coordination. Teach these patients to check blood glucose when they notice these signs and to monitor BP. A racing heart is the very sign the drug hides, so do not count on seeing it.", "hook": "Beta blockers put a mask on low sugar: no racing heart, just headache, weakness, blurry, clumsy.", "source": "Clayton Ch 12 p 187; ideas from CLAY12_05, CLAY12_36, CLAY12_38", "flag": null}, {"id": "W6_035", "topic": "Beta Blockers", "difficulty": "Basic", "type": "mc", "case": null, "adpie": "Evaluation", "answer": [0], "r1": {"stem": "Which statement by Gary, a competitive lawn gnome collector taking metoprolol, shows he needs MORE teaching?", "options": ["I can stop taking this pill if it upsets my stomach", "I will check my pulse before each dose", "I will tell my provider if my feet start to swell", "I will get up slowly from my chair"]}, "r2": {"stem": "A lawn gnome collector on metoprolol makes several statements. Which one means he needs further teaching?", "options": ["If it bothers my stomach, I can just quit it", "I'll take my pulse before every dose", "I'll report any swelling in my feet", "I'll rise slowly when I stand up"]}, "r3": {"stem": "As the LVN evaluating Gary's understanding of his beta blocker, which statement do you report to the RN as needing more teaching?", "options": ["I'll stop the medicine on my own if I feel sick", "I check my heart rate before I take it", "Swollen feet are something I would call about", "I stand up slowly to avoid getting dizzy"]}, "rationale": "Beta blockers must NEVER be stopped abruptly: rebound can cause angina or even an MI, so the provider tapers the dose. Checking the pulse and BP before each dose is correct. Foot swelling and orthopnea can mean heart failure is worsening and should be reported. Rising slowly is sensible because beta blockers lower BP, especially when combined with other BP drugs.", "hook": "Beta blockers: taper, never quit cold turkey.", "source": "Clayton Ch 12 pp 185, 187; ideas from CLAY12_17, CLAY12_19, CLAY12_44", "flag": null}, {"id": "W6_036", "topic": "Beta Blockers", "difficulty": "Difficult", "type": "mc", "case": null, "adpie": "Implementation", "answer": [1], "r1": {"stem": "During morning care, you notice that Pearl, a retired circus juggler taking propranolol for hypertension, has mottled skin on her legs. What is the PRIORITY action?", "options": ["Apply warm blankets and recheck in 4 hours", "Hold the beta blocker until the provider sees her", "Give the dose and document the finding", "Elevate her legs and massage the mottled areas"]}, "r2": {"stem": "A retired juggler on propranolol has blotchy, mottled skin on her legs. Which action comes first?", "options": ["Cover her with warm blankets and look again in 4 hours", "Withhold the beta blocker until she has been examined by the provider", "Administer the dose and chart what you saw", "Raise her legs and rub the blotchy areas"]}, "r3": {"stem": "As the LVN, you find new mottling on the legs of a patient due for propranolol. Which action is your priority?", "options": ["Warm her up and reassess at the end of the shift", "Hold the dose and report to the RN so the provider can see her before the next dose", "Give the dose as scheduled and note the mottling", "Elevate and massage her legs"]}, "rationale": "Mottling of the skin signals serious peripheral vasoconstriction, a dangerous adverse effect of beta blockers. Hold the drug until the provider has seen the patient. Giving the dose, or just warming her and waiting, delays care for poor perfusion. Massaging mottled skin does not fix the cause.", "hook": "Mottled on a beta blocker = hold it and get eyes on her.", "source": "Clayton Ch 12 p 187; idea from CLAY12_31", "flag": null}, {"id": "W6_037", "topic": "Cholinergic and Anticholinergic Agents", "difficulty": "Intermediate", "type": "mc", "case": null, "adpie": "Implementation", "answer": [2], "r1": {"stem": "Buster, a retired hot air balloon pilot, has urinary retention and is due for bethanechol. His heart rate is 52. What does the nurse do?", "options": ["Give the dose and recheck his pulse in an hour", "Give atropine first, then the bethanechol", "Hold the bethanechol and report the heart rate", "Have him change positions slowly, then give the dose"]}, "r2": {"stem": "A former balloon pilot with urinary retention is scheduled for bethanechol, and his pulse is 52. Which action is correct?", "options": ["Administer it and check the pulse again in 60 minutes", "Premedicate with atropine, then give bethanechol", "Withhold the bethanechol and report the pulse", "Teach slow position changes and then give it"]}, "r3": {"stem": "As the LVN preparing to give bethanechol, you find an apical pulse of 52. What is your action?", "options": ["Give it and recheck the pulse later", "Ask for an atropine order so you can still give the dose", "Hold the dose and report the bradycardia to the RN and provider", "Teach him to rise slowly and give the dose"]}, "rationale": "Bethanechol is a CHOLINERGIC drug: it mimics acetylcholine to contract the bladder and treat urinary RETENTION. Cholinergic effects include a slower heart rate, so a pulse of 52 means hold the dose and report it. Atropine is an anticholinergic that opposes cholinergic effects, but it is not a routine premedication to push a dose through. Slow position changes do not address bradycardia.", "hook": "Bethanechol = bladder go. Cholinergic = slows the heart, so check the pulse.", "source": "Clayton Ch 12 pp 187 to 188; idea from CLAY12_51 (corrected, see flag)", "flag": "Answer key error in the EAQ rationale (CLAY12_51): it called bethanechol an anticholinergic for overactive bladder. Bethanechol is a CHOLINERGIC for urinary RETENTION, and atropine antagonizes CHOLINERGIC effects; holding the dose for HR 52 is still correct."}, {"id": "W6_038", "topic": "Cholinergic and Anticholinergic Agents", "difficulty": "Difficult", "type": "mc", "case": null, "adpie": "Assessment", "answer": [3], "r1": {"stem": "Agnes, a competitive birdwatcher with glaucoma, starts pilocarpine eye drops. Which effect does the nurse expect from this cholinergic drug?", "options": ["Dilated pupils and dry mouth", "Rapid heart rate and constipation", "Decreased sweating and urinary retention", "Constricted pupils and lower intraocular pressure"]}, "r2": {"stem": "A birdwatcher with glaucoma begins pilocarpine drops. What expected effect will the nurse see?", "options": ["Wide pupils and a dry mouth", "Tachycardia and constipation", "Less sweating and trouble voiding", "Small pupils and reduced eye pressure"]}, "r3": {"stem": "As the LVN collecting data after a patient starts pilocarpine, which finding tells you the cholinergic drug is working as expected?", "options": ["Mydriasis with xerostomia", "A pulse over 100 with hard stools", "Dry skin and urinary retention", "Miosis and a drop in intraocular pressure"]}, "rationale": "Pilocarpine is a CHOLINERGIC miotic: it mimics acetylcholine, constricts the pupil, and lowers intraocular pressure in glaucoma. Cholinergic drugs can also cause sweating and bradycardia. Dilated pupils, dry mouth, a fast heart rate, constipation, decreased sweating, and urinary retention are ANTIcholinergic effects, the opposite.", "hook": "Pilocarpine = Pinpoint pupils.", "source": "Clayton Ch 12 pp 187 to 189; idea from CLAY12_22; corrects CLAY12_10", "flag": "Answer key error in the EAQ bank (CLAY12_10): it called pilocarpine an anticholinergic. Pilocarpine is a CHOLINERGIC miotic for glaucoma that constricts the pupil and causes sweating; learn it that way."}, {"id": "W6_039", "topic": "Cholinergic and Anticholinergic Agents", "difficulty": "Intermediate", "type": "sata", "case": null, "adpie": "Assessment", "answer": [0, 1, 2], "r1": {"stem": "Before giving an anticholinergic to Clarence, a professional pinball wizard, which data must the nurse collect? Select all that apply.", "options": ["Vital signs, including heart rate and blood pressure", "History of an enlarged prostate", "History of closed angle glaucoma", "Bowel sounds in all four quadrants", "Current pain rating"]}, "r2": {"stem": "A pinball pro is about to receive an anticholinergic. What must the nurse check first? Select all that apply.", "options": ["HR and BP", "Any history of prostate enlargement", "Any history of narrow, closed angle glaucoma", "Bowel sounds in each quadrant", "His pain score"]}, "r3": {"stem": "As the LVN preparing to give an anticholinergic, which data do you collect, holding the drug and reporting to the RN if a problem is found? Select all that apply.", "options": ["Pulse and BP", "Whether he has BPH", "Whether he has closed angle glaucoma", "Bowel sounds", "Pain level"]}, "rationale": "Before an anticholinergic, take vital signs (HR and BP) and screen for an ENLARGED PROSTATE and CLOSED ANGLE GLAUCOMA. Anticholinergics cause urinary retention, which is risky with an enlarged prostate. They also dilate the pupil, which can worsen closed angle glaucoma, so hold the drug and call the provider if either is present. Bowel sounds and pain are not the required pre dose checks.", "hook": "Before an anticholinergic: Vitals, Prostate, Glaucoma.", "source": "Clayton Ch 12 pp 188 to 189; ideas from CLAY12_24, CLAY12_30, CLAY12_39", "flag": null}, {"id": "W6_040", "topic": "Cholinergic and Anticholinergic Agents", "difficulty": "Difficult", "type": "mc", "case": null, "adpie": "Evaluation", "answer": [1], "r1": {"stem": "Thelma, 79, the reigning shuffleboard champion of her senior park, started an anticholinergic for her bladder. She has dry mouth and mild constipation, and today she is confused and says there are cats on the ceiling. Which finding shows EXCESSIVE anticholinergic effects?", "options": ["Dry mouth", "Confusion and hallucinations", "Mild constipation", "Slightly blurred vision when reading"]}, "r2": {"stem": "An older shuffleboard star on an anticholinergic has several new findings. Which one signals too much drug effect?", "options": ["A dry mouth", "New confusion and seeing things that are not there", "Some constipation", "Mild blurring of close vision"]}, "r3": {"stem": "As the LVN evaluating Thelma's response to her anticholinergic, which finding do you report to the RN right away as an excessive effect?", "options": ["Xerostomia", "Acute confusion with visual hallucinations", "Slower bowel movements", "Blurry vision with reading"]}, "rationale": "Dry mouth, constipation, blurred vision, urinary retention, decreased sweating, and a faster pulse are EXPECTED anticholinergic effects; manage them with hard candy or ice chips for dry mouth and bulk and fluids for constipation. CONFUSION and HALLUCINATIONS mean excessive effects, especially in older adults, and must be reported right away. If she feels faint from orthostatic hypotension, have her sit down and teach her to rise slowly.", "hook": "Anticholinergic: can't see, can't pee, can't spit, can't poop. Too much = can't think.", "source": "Clayton Ch 12 p 189; ideas from CLAY12_16, CLAY12_32, CLAY12_33, CLAY12_54", "flag": null}]}, {"week": 7, "title": "Community Nursing", "tagline": "This week the patient is the whole town, and the town forgot to wash its hands.", "cases": {"W7_CASE1": {"title": "Case: Mrs. Opal Featherstone, Home Health", "text": "Opal Featherstone, 84, is a retired roller derby referee who still blows her whistle at the TV during games. She just went home after a hemiarthroplasty for a fractured hip, and the hospital sent a home health referral. She uses home oxygen by nasal cannula and lives with her husband, her daughter, her son in law, and two grandkids. She loves burning sandalwood incense for what she calls good vibes."}, "W7_CASE2": {"title": "Case: The Bingo Bonanza Outbreak", "text": "Sunny Acres Senior Center hosts Bingo Bonanza every Thursday, complete with one shared karaoke microphone. Over 2 weeks, 23 regulars develop sudden fever, cough, and body aches, far more than the few cases the county usually sees this time of year. Lab tests confirm influenza A. The county public health nurse is working with the center's clinic, where you work as the LVN."}}, "questions": [{"id": "W7_001", "topic": "Complementary and Alternative Therapies", "difficulty": "Intermediate", "type": "mc", "case": null, "adpie": "Assessment", "answer": [1], "r1": {"stem": "Bartholomew, a retired rodeo clown, uses guided imagery and soothing banjo music alongside the chemotherapy his oncologist ordered. How would the nurse classify the imagery and music?", "options": ["Alternative therapy, because it is not taught in medical school", "Complementary therapy, because he uses it together with conventional treatment", "Conventional therapy, because his oncologist knows about it", "Alternative therapy, because any therapy without a prescription is alternative"]}, "r2": {"stem": "A former rodeo clown listens to calming banjo tunes and practices guided imagery while still receiving his prescribed chemotherapy. Which label fits these practices?", "options": ["Alternative, since medical schools do not cover it", "Complementary, since it is used along with mainstream treatment", "Conventional, since the cancer doctor is aware of it", "Alternative, since anything bought without a prescription counts as alternative"]}, "r3": {"stem": "While collecting data, the LVN learns a patient uses imagery and music in addition to his scheduled chemotherapy. Which classification should the LVN document and report to the RN?", "options": ["Alternative, because it falls outside medical school training", "Complementary, because it is added to his conventional cancer care", "Conventional, because his provider has been told about it", "Alternative, because it requires no prescription"]}, "rationale": "Complementary therapy is used WITH conventional medical care; alternative therapy is used INSTEAD of it. Because he keeps his chemotherapy and adds imagery and music, these are complementary. The same therapy becomes alternative only if he drops chemo and uses it in place of mainstream treatment. A provider knowing about it does not make it conventional, and needing no prescription does not make a therapy alternative.", "hook": "Complementary compliments the meds (with). Alternative alters the plan (instead).", "source": "EAQ FON_25, FON_33 (FON Ch 20 p 579 to 580)", "flag": null}, {"id": "W7_002", "topic": "Complementary and Alternative Therapies", "difficulty": "Basic", "type": "mc", "case": null, "adpie": "Planning", "answer": [1], "r1": {"stem": "Doreen, a competitive cup stacker with migraines, asks about a therapy that places thin needles along energy pathways. Which therapy is she describing?", "options": ["Reiki", "Acupuncture", "Acupressure", "Reflexology"]}, "r2": {"stem": "A patient who stacks cups competitively wants to try a treatment where fine needles are inserted along meridians to balance Qi. Which therapy matches?", "options": ["Reiki healing touch", "Acupuncture therapy", "Acupressure therapy", "Reflexology of the feet and hands"]}, "r3": {"stem": "A patient with recurring migraines asks the LVN which therapy, often used for migraine, low back pain, and sciatica, involves needles placed along meridians. Which therapy should the LVN name when reinforcing the RN's teaching?", "options": ["Reiki, which channels energy through the practitioner's touch", "Acupuncture, which places thin needles along energy channels", "Acupressure, which presses on points along energy channels", "Reflexology, which presses on areas of the feet, hands, and ears"]}, "rationale": "Acupuncture places thin needles at specific points along meridians, the channels that traditional Chinese medicine says carry vital energy called Qi. It is used for low back pain, migraine and simple headaches, shoulder pain, and sciatica. Acupressure works on the same points but uses pressure, not needles. Reiki uses touch and energy fields, and reflexology applies pressure to areas of the feet, hands, and ears.", "hook": "AcuPUNCTURE punctures; acuPRESSURE presses.", "source": "EAQ FON_17, FON_20, FON_40 (FON Ch 20 p 587 to 588)", "flag": null}, {"id": "W7_003", "topic": "Complementary and Alternative Therapies", "difficulty": "Difficult", "type": "sata", "case": null, "adpie": "Assessment", "answer": [0, 1], "r1": {"stem": "The nurse screens requests at the Happy Trails Wellness Fair. Which therapy and condition pairings are contraindicated? Select all that apply.", "options": ["Chiropractic spinal manipulation for a patient with rheumatoid arthritis", "Massage for a patient with an infectious skin disease", "Acupuncture for a patient with chronic low back pain", "Guided imagery for a patient who is stressed about surgery", "Aromatherapy to help a patient relax and ease nausea"]}, "r2": {"stem": "Which therapy and condition combinations should be avoided? Select all that apply.", "options": ["Joint manipulation by a chiropractor when the patient has rheumatoid arthritis", "Soft tissue massage when the patient has a contagious skin infection", "Acupuncture needles to treat long standing lower back pain", "Visualization exercises for a patient anxious before an operation", "Scented oils to promote relaxation and reduce queasiness"]}, "r3": {"stem": "While collecting data, the LVN learns about several patients' CAM plans. Which plans should the LVN report to the RN as unsafe? Select all that apply.", "options": ["A patient with rheumatoid arthritis has booked a chiropractor for joint adjustments", "A patient with impetigo, an infectious skin condition, has a massage scheduled", "A patient with sciatica and low back pain plans to start acupuncture", "A patient waiting for a knee replacement practices guided imagery each evening", "A patient uses lavender aromatherapy to unwind at bedtime"]}, "rationale": "Chiropractic care manipulates joints, so it is contraindicated in rheumatoid arthritis and other joint diseases. Massage is contraindicated with an infectious skin disease because rubbing can spread the infection and damage the skin. Acupuncture is actually used for low back pain and sciatica. Imagery and aromatherapy are low risk relaxation tools that fit these patients.", "hook": "RA? No chiro. Rash that spreads? No rub.", "source": "EAQ FON_21, FON_27, FON_20 (FON Ch 20 p 587 to 590)", "flag": null}, {"id": "W7_004", "topic": "Complementary and Alternative Therapies", "difficulty": "Intermediate", "type": "mc", "case": null, "adpie": "Evaluation", "answer": [0], "r1": {"stem": "Mavis, who knits sweaters for her six chihuahuas, starts St. John's wort for mild depression. Which teaching point is correct?", "options": ["Use sunscreen and limit sun exposure because this herb can cause photosensitivity", "It is safe to take with an MAOI antidepressant since both treat mood", "A glass of wine with each dose helps the herb absorb", "Herbs are natural, so there is no need to tell the provider"]}, "r2": {"stem": "A patient who knits outfits for her dogs begins taking St. John's wort for mild low mood. Which instruction should the nurse give?", "options": ["Protect your skin from the sun, because the herb can make it burn more easily", "Combining it with an MAOI is fine because they work on the same problem", "Pair each dose with wine to improve absorption", "Natural products never need to be shared with the provider"]}, "r3": {"stem": "The RN taught a patient about St. John's wort for mild depression. Which patient statement should the LVN reinforce as accurate?", "options": ["\"I will wear sunscreen and a hat because this herb can make me sun sensitive.\"", "\"I can keep taking my MAOI with it because they both help my mood.\"", "\"I will take each capsule with a glass of merlot.\"", "\"Since it is natural, my doctor does not need to know.\""]}, "rationale": "St. John's wort is used for mild to moderate depression, and photosensitivity is a known adverse effect, so sun protection is key. It must not be combined with MAOIs or prescription antidepressants, and alcohol should be avoided. Every herb and supplement should be reported to the provider because herbs can interact with prescribed drugs. Natural does not mean harmless.", "hook": "Three S's for St. John's wort: Sunscreen, no Spirits, Skip the MAOI.", "source": "EAQ FON_38 (FON Ch 20 p 582 to 584)", "flag": null}, {"id": "W7_005", "topic": "Complementary and Alternative Therapies", "difficulty": "Basic", "type": "mc", "case": null, "adpie": "Implementation", "answer": [1], "r1": {"stem": "Gus Puddleford sheepishly admits he drinks a homemade herbal tea his neighbor swears by. Which nurse response best supports an accurate herb history?", "options": ["\"That stuff is nonsense. Please stop it.\"", "\"Thanks for telling me. What is in the tea, and how often do you drink it?\"", "\"Herbal teas are always safe, so no worries.\"", "\"Let's skip that; only prescriptions matter here.\""]}, "r2": {"stem": "A patient nervously confesses he sips a homemade herbal brew recommended by his neighbor. Which reply by the nurse will most likely get honest, useful information?", "options": ["\"That is junk science, so quit drinking it.\"", "\"I appreciate you sharing. What herbs are in it, and how much do you drink?\"", "\"Herbal drinks never cause problems, so you are fine.\"", "\"We only need to talk about your prescribed medicines.\""]}, "r3": {"stem": "As the LVN collecting a medication history, which response helps you build a complete herb and supplement list to report to the RN?", "options": ["\"Herbal remedies are a waste of money, so you should stop.\"", "\"Thank you for being open. Tell me what is in the tea and how often you have it.\"", "\"Anything herbal is harmless, so I will leave it off the list.\"", "\"I only document prescription drugs.\""]}, "rationale": "A nonjudgmental, well informed nurse earns trust, and trust gets a more honest and complete list of herbs. Asking what is in the product and how often it is used gives data to check for interactions. A judgmental reply makes patients hide what they take. Saying herbs are always safe is false, and ignoring them misses possible drug interactions. For reliable CAM information, use professional associations such as the American Holistic Nurses Association rather than random websites.", "hook": "Judge not, and they will tell you a lot.", "source": "EAQ FON_05, FON_22 (FON Ch 20 p 580)", "flag": null}, {"id": "W7_006", "topic": "Complementary and Alternative Therapies", "difficulty": "Intermediate", "type": "sata", "case": null, "adpie": "Planning", "answer": [0, 1, 2], "r1": {"stem": "Which goals describe the National Center for Complementary and Integrative Health (NCCIH), created in 1992? Select all that apply.", "options": ["Evaluate complementary and alternative treatments", "Support, coordinate, and conduct research and research training", "Share information with the public and health professionals", "Set official treatment methods that all CAM practitioners must use", "Tell patients exactly when they may use CAM"]}, "r2": {"stem": "The NCCIH was established in 1992 to accomplish which aims? Select all that apply.", "options": ["Assess how well CAM therapies work", "Fund, organize, and carry out studies and train researchers", "Act as an information resource for the public and clinicians", "Create required treatment forms for every CAM provider", "Decide for each patient when CAM is allowed"]}, "r3": {"stem": "A patient's grandson, a podcast host who calls himself Dr. Smoothie, claims a federal agency officially approved his kale cleanse. Which accurate NCCIH functions can the LVN share when reinforcing teaching? Select all that apply.", "options": ["It evaluates CAM therapies", "It supports and conducts research and research training", "It distributes information to the public and professionals", "It sets the treatment methods CAM practitioners are required to follow", "It decides exactly when each person may use a CAM product"]}, "rationale": "NCCIH has three main jobs: evaluate CAM therapies, support and conduct research and research training, and distribute information to the public and professionals. It does not create official treatment methods for practitioners. It also does not dictate exactly when a patient may use CAM. Evaluate, research, inform is the short version.", "hook": "NCCIH = E R I: Evaluate, Research, Inform.", "source": "EAQ FON_45 (FON Ch 20 p 580 to 581)", "flag": null}, {"id": "W7_007", "topic": "Older Adult Health Promotion", "difficulty": "Basic", "type": "mc", "case": null, "adpie": "Implementation", "answer": [2], "r1": {"stem": "Grandma Lucille live streams bingo every night and keeps scratching her dry, itchy shins on camera. Which suggestion should the nurse make?", "options": ["Take a hot shower every day", "Switch to antibacterial soap", "Apply a water based lotion", "Scrub the trunk daily with soap and water"]}, "r2": {"stem": "An older woman who hosts a nightly online bingo show complains her skin itches constantly. Which advice will help her pruritus?", "options": ["Shower daily in hot water", "Use an antibacterial soap", "Moisturize with a water based lotion", "Wash the torso with soap and water every day"]}, "r3": {"stem": "An older adult with pruritus asks the LVN for skin care tips. Which instruction should the LVN reinforce as most likely to relieve the itching?", "options": ["\"A hot shower every day will soothe your skin.\"", "\"Antibacterial soap will keep your skin healthy.\"", "\"Smooth on a water based lotion to keep your skin moist.\"", "\"Wash your trunk with soap and water every day.\""]}, "rationale": "Older skin is thinner and drier, and dryness causes much of the itching (pruritus). Water based lotion restores moisture and soothes the itch. Daily showers strip natural oils, and antibacterial soap is very drying. Daily soap scrubbing also dries the skin, especially if residue is left behind.", "hook": "Itchy elder? Lotion, not lather.", "source": "EAQ FON_01 (FON Ch 33 p 1087)", "flag": null}, {"id": "W7_008", "topic": "Older Adult Health Promotion", "difficulty": "Basic", "type": "mc", "case": null, "adpie": "Diagnosis", "answer": [0], "r1": {"stem": "Which factor is the most important contributor to declining mobility and function in older adults?", "options": ["Inactivity", "Osteoporosis", "Slower peristalsis", "Reduced cardiovascular reserve"]}, "r2": {"stem": "Felix, 88, a former competitive yodeler, now spends most of his day in a recliner. Which factor best explains his loss of mobility and function?", "options": ["Lack of physical activity", "Thinning bones from osteoporosis", "Sluggish bowel movement", "Lower heart and vessel reserve"]}, "r3": {"stem": "When helping the RN plan care to prevent further functional decline in an older resident, which factor should the LVN identify as the biggest modifiable contributor?", "options": ["Not moving enough during the day", "Loss of bone density", "Slowed movement of the gut", "Decreased cardiac reserve"]}, "rationale": "Inactivity is the most important contributor to declining mobility and function with age, and it is something we can change. Osteoporosis matters but can be slowed with exercise. Slower peristalsis affects appetite and bowel habits, not mobility. Low cardiovascular reserve means more rest breaks during activity, not loss of function by itself.", "hook": "Use it or lose it.", "source": "EAQ FON_32 (FON Ch 33 p 1087)", "flag": null}, {"id": "W7_009", "topic": "Older Adult Health Promotion", "difficulty": "Difficult", "type": "mc", "case": null, "adpie": "Assessment", "answer": [3], "r1": {"stem": "Which finding in an older adult's admission history best explains her new pressure ulcer?", "options": ["Lives alone on a fixed income and needs help bathing", "Dry, loose skin and a 3 lb weight loss over the past year", "Type 2 diabetes for 20 years, controlled with metformin", "Fell 2 weeks ago, has stayed in bed because moving hurts, and cannot reach the bathroom in time"]}, "r2": {"stem": "Agnes, a retired synchronized swimmer, is admitted with a sacral pressure ulcer. Which piece of her history most strongly supports this problem?", "options": ["She lives by herself on a limited income and needs bathing help", "Her skin is dry with loose folds, and she lost 3 lb this year", "She has had well controlled type 2 diabetes for 20 years", "She fell 2 weeks ago, has stayed in bed due to pain, and has been having accidents before reaching the toilet"]}, "r3": {"stem": "Reviewing admission data, the LVN wants to report the history most strongly linked to a patient's pressure injury. Which data should the LVN highlight for the RN?", "options": ["Fixed income, lives alone, needs bathing help", "Dry skin, loose skinfolds, 3 lb weight loss in a year", "Long history of diabetes managed with oral metformin", "Bed rest for 2 weeks after a painful fall, plus new incontinence"]}, "rationale": "Immobility puts constant pressure on bony prominences, and incontinence keeps skin moist so it breaks down faster. Together they are the strongest risk for a pressure ulcer. A fixed income, dry loose skin, and well controlled diabetes are less directly linked than this combination. Turning, early mobility, and prompt toileting address both risks.", "hook": "Can't move plus can't make it to the bathroom = skin breaks down.", "source": "EAQ FON_12 (FON Ch 33 p 1089)", "flag": null}, {"id": "W7_010", "topic": "Older Adult Health Promotion", "difficulty": "Intermediate", "type": "mc", "case": null, "adpie": "Implementation", "answer": [1], "r1": {"stem": "Walter, 79, a retired mall Santa with Alzheimer disease, keeps pacing up and down the hospital hallway. Which nursing action is best?", "options": ["Walk him back to his room and turn on the TV", "Offer to help him to the toilet and point to the restroom sign", "Apply a safety reminder device so he can rest", "Ask the provider for a sedative so he stays in bed"]}, "r2": {"stem": "A former mall Santa with Alzheimer disease is wandering the corridor again. Which intervention is most likely to help him?", "options": ["Return him to his room with the lights and television on", "Assist him to the bathroom, pointing to the toilet sign on the door", "Use a safety reminder device so he will stop and rest", "Request a sedating medication to keep him in bed"]}, "r3": {"stem": "The LVN notices a patient with Alzheimer disease wandering the hall. Which action is within LVN scope and the best first response?", "options": ["Guide him to his room and put a TV show on", "Offer toileting help and use the restroom sign as a visual cue", "Place a safety reminder device without trying anything else first", "Call for a sedative order before trying other measures"]}, "rationale": "In Alzheimer disease, wandering often means the person needs to use the bathroom but cannot say so. Offering toileting and pointing to the sign uses cues he can still understand, and he often calms down afterward. TV and lights do not meet the unmet need. A safety reminder device is a last resort, used only when there is risk of harm. Medication is for agitation, not a first step for wandering.", "hook": "Wandering? Think: where's the bathroom?", "source": "EAQ FON_08 (FON Ch 33 p 1110)", "flag": null}, {"id": "W7_011", "topic": "Older Adult Health Promotion", "difficulty": "Difficult", "type": "sata", "case": null, "adpie": "Implementation", "answer": [0, 1, 2], "r1": {"stem": "Which teaching points apply to an older adult taking an over the counter antacid? Select all that apply.", "options": ["Take it about 1 hour after meals", "Do not take it at the same time as other medications", "Check the label for sodium content", "Take it with every pill to protect the stomach", "OTC products are safe, so the provider does not need to know"]}, "r2": {"stem": "An older patient buys an antacid at the drugstore. Which instructions should the nurse include? Select all that apply.", "options": ["Use it roughly 1 hour after eating", "Space it apart from other medicines", "Read the label to see how much sodium it has", "Swallow it along with all other pills to coat the stomach", "No need to tell the provider since no prescription was needed"]}, "r3": {"stem": "Ike, a retired ice cream truck driver with hypertension, takes an antacid plus several prescriptions. Which points should the LVN reinforce? Select all that apply.", "options": ["Take the antacid about 1 hour after meals", "Do not take the antacid together with your other medications", "Look for sodium content on the label because of your blood pressure", "Take the antacid with each prescription to prevent stomach upset", "Over the counter means safe, so leave it off your med list"]}, "rationale": "Antacids relieve symptoms rather than prevent them, and they are most effective about 1 hour after meals. They change how other drugs are absorbed, so they are not taken at the same time as other medications. Many older adults have hypertension, and some antacids contain sodium, so check the label. OTC products can still interact with prescriptions, so the provider should know about every one.", "hook": "Antacid ABC: After meals (1 hour), By itself, Check the sodium.", "source": "EAQ FON_10, FON_24 (FON Ch 33 p 1113)", "flag": null}, {"id": "W7_012", "topic": "Older Adult Health Promotion", "difficulty": "Basic", "type": "mc", "case": null, "adpie": "Implementation", "answer": [0], "r1": {"stem": "Rosalind, 70, a choir soprano, leaks a little urine every time she hits a high note, coughs, or sneezes. Kegel exercises are taught for which type of incontinence?", "options": ["Stress incontinence", "Overflow incontinence", "Dementia incontinence", "Functional incontinence"]}, "r2": {"stem": "A 70 year old church soprano loses small amounts of urine when she sings loudly, laughs, or sneezes. Pelvic floor (Kegel) exercises target which type of incontinence?", "options": ["Leakage with increased abdominal pressure", "Leakage from an overfull bladder", "Incontinence caused by dementia", "Incontinence from being unable to reach the toilet in time"]}, "r3": {"stem": "The RN taught Kegel exercises to an older patient. When reinforcing, the LVN explains they are meant for which type of incontinence?", "options": ["Stress incontinence from coughing, sneezing, or laughing", "Overflow incontinence from a bladder that does not empty", "Dementia incontinence", "Functional incontinence from mobility or access barriers"]}, "rationale": "Stress incontinence is loss of a small amount of urine when abdominal pressure rises, such as with coughing, sneezing, laughing, or belting out a high note. Kegel exercises strengthen the pelvic floor muscles and work best when done daily. Overflow and functional incontinence need different interventions. Dementia incontinence is not a recognized type.", "hook": "Kegels for the Cough and Sneeze crew (stress).", "source": "EAQ FON_50 (FON Ch 33 p 1094)", "flag": null}, {"id": "W7_013", "topic": "Older Adult Health Promotion", "difficulty": "Difficult", "type": "mc", "case": null, "adpie": "Planning", "answer": [1], "r1": {"stem": "Bernadette, 56, a roller coaster enthusiast, asks which preventive screening she should have every 3 to 5 years. Which test does the nurse identify?", "options": ["Glaucoma test", "Papanicolaou (Pap) test", "Dental examination", "Breast self examination"]}, "r2": {"stem": "A 56 year old woman who rides every roller coaster she can find wants to know which screening is due every 3 to 5 years. Which one fits?", "options": ["Eye pressure check for glaucoma", "Cervical Pap smear", "Dental checkup", "Self check of the breasts"]}, "r3": {"stem": "While reinforcing a health maintenance plan for a 56 year old woman, the LVN reviews screening intervals. Which test fits a 3 to 5 year schedule?", "options": ["Glaucoma screening", "Pap test for cervical cancer", "Dental exam", "Breast self exam"]}, "rationale": "For this 56 year old woman, the Pap test is done every 3 to 5 years to screen for cervical cancer. A glaucoma test is done yearly. Breast self examination is monthly. Dental exams are more frequent than every 3 to 5 years: every 6 months for natural teeth, and every 2 years for denture wearers.", "hook": "Pap every 3 to 5, eyes every 1, breast self check every month.", "source": "EAQ FON_35, FON_04 (FON Ch 33 p 1082, 1090)", "flag": "Dental interval conflict: one EAQ item keys dental screening every 2 years for denture wearers, while another rationale says a dental exam every 6 months. Different patients (dentures vs natural teeth); know both and ask professor if it is tested."}, {"id": "W7_014", "topic": "Vulnerable Groups", "difficulty": "Intermediate", "type": "mc", "case": null, "adpie": "Assessment", "answer": [3], "r1": {"stem": "Which finding most strongly suggests elder abuse in an older adult?", "options": ["Mismatched clothing", "Messy, disheveled appearance", "A bruise on the upper arm", "Unexplained fear of a particular person"]}, "r2": {"stem": "Ethel, 90, still wins every crossword contest at her senior center. Which observation should make the nurse most suspicious of elder abuse?", "options": ["Her outfit does not match", "Her hair and clothes look unkempt", "She has a bruise on her upper arm", "She becomes fearful whenever one specific relative arrives, with no clear reason"]}, "r3": {"stem": "During a home visit, the LVN notices several things about an older patient. Which observation must be reported to the RN as a key indicator of possible abuse?", "options": ["Clothes that do not match", "An untidy appearance", "One bruise on the arm", "Fear of a certain person that the patient cannot explain"]}, "rationale": "Unexplained fear of a particular person is a recognized indicator of elder abuse and must be reported. Mismatched clothes or a messy look can reflect personal style, vision changes, or memory problems, not abuse. A bruise should be asked about, but older skin is fragile and can bruise from a bump or fall. Older adults who depend on others are a vulnerable group, so the nurse stays alert to patterns.", "hook": "Fear of one person = red flag.", "source": "EAQ FON_26 (FON Ch 33 p 1112 to 1113)", "flag": null}, {"id": "W7_015", "topic": "Home Health", "difficulty": "Basic", "type": "mc", "case": null, "adpie": "Planning", "answer": [2], "r1": {"stem": "Chester, a retired lumberjack, broke his leg in a log rolling contest. He is ready to go home but needs help cooking and bathing. Which in home resource should the nurse refer him to?", "options": ["Licensed vocational nurse", "Registered nurse", "Personal care attendant", "Physical therapist"]}, "r2": {"stem": "A former lumberjack with a fractured leg is being discharged and needs help with meals and baths at home. Which home team member is the best match?", "options": ["An LVN", "An RN", "A personal care attendant", "A physical therapist"]}, "r3": {"stem": "The LVN helps the RN plan home services for a patient with a broken leg who needs help preparing meals and bathing. Which team member should the LVN suggest?", "options": ["Another LVN for skilled care", "The RN case manager", "A personal care attendant for ADL help", "A physical therapist for gait training"]}, "rationale": "A personal care attendant helps with activities of daily living such as cooking, bathing, and dressing. Nurses provide skilled care, and the RN assesses the patient and coordinates the home health team. A physical therapist works on mobility and gait, not meal prep or bathing. Match the helper to the need.", "hook": "Cooking and cleaning up? Call the personal care attendant.", "source": "EAQ FON_06 (FON p 1116 to 1117)", "flag": null}, {"id": "W7_016", "topic": "Home Health", "difficulty": "Intermediate", "type": "mc", "case": null, "adpie": "Implementation", "answer": [3], "r1": {"stem": "The home health nurse coordinator asks the LVN to act as patient counselor for a family adjusting to Grandpa Herb's new weakness after a stroke. Which duty is expected?", "options": ["Teach basic hygiene measures", "Supervise the home health aide", "Provide skilled psychiatric interventions", "Provide emotional support to the patient and family"]}, "r2": {"stem": "In the patient counselor role, what does the coordinator expect the LVN to do for a family coping with Grandpa Herb's stroke?", "options": ["Instruct on basic hygiene", "Oversee the home health aide's work", "Deliver advanced psychiatric treatment", "Offer emotional support to Herb and his family"]}, "r3": {"stem": "Which action fits the LVN's scope when assigned the patient counselor role in home health?", "options": ["Teaching hygiene, which is the educator role", "Supervising the aide, which is the RN case manager role", "Performing skilled psychiatric interventions", "Giving emotional support to the patient and family"]}, "rationale": "As patient counselor, the LVN gives emotional support to the patient and family. Teaching hygiene belongs to the patient educator role. Supervising the home health aide is the RN case manager's job. Skilled psychiatric interventions are beyond LVN preparation.", "hook": "Counselor = comfort.", "source": "EAQ FON_43 (FON Ch 37 p 1187)", "flag": null}, {"id": "W7_017", "topic": "Home Health", "difficulty": "Intermediate", "type": "mc", "case": "W7_CASE1", "adpie": "Assessment", "answer": [3], "r1": {"stem": "Opal's home health referral has been received. Which step comes first?", "options": ["Develop the plan of care", "Select nursing diagnoses", "Obtain payment approval", "Perform the initial admission assessment in the home"]}, "r2": {"stem": "Now that the agency has Opal's referral, what should happen before anything else?", "options": ["Write her care plan", "Pick her nursing diagnoses", "Get payment approved", "Visit the home for an admission assessment of Opal and her environment"]}, "r3": {"stem": "The LVN is assigned to Opal's home health team. Which first step after referral is correct, and who does it?", "options": ["The LVN writes the plan of care", "The LVN chooses the nursing diagnoses", "The office secures payment before anyone visits", "The RN performs the initial admission assessment of Opal and her home"]}, "rationale": "After referral, a nurse visits the home and completes an initial assessment of the patient and the environment, and on the home health team the RN makes this admission visit. The plan of care comes after the assessment, and nursing diagnoses are chosen from the assessment data. Payment is received after care is provided and submitted, not before the first visit. Referrals most often come from the hospital, as in Opal's case. The LVN then gives care under RN supervision.", "hook": "Assess first, plan second. RN rings the doorbell first.", "source": "EAQ FON_37, FON_30, FON_14 (FON Ch 37 p 1182, 1190)", "flag": null}, {"id": "W7_018", "topic": "Home Health", "difficulty": "Basic", "type": "mc", "case": "W7_CASE1", "adpie": "Implementation", "answer": [1], "r1": {"stem": "Opal insists her daughter light sandalwood incense during the nurse's visit. What is the nurse's best response?", "options": ["Allow it, since respecting cultural preferences comes first", "Explain that no incense or open flame is allowed near her oxygen, and look for a safe alternative together", "Allow it as long as a window is cracked open", "Turn up the oxygen so the smoke does not bother her"]}, "r2": {"stem": "Opal wants incense burning while the nurse is there. How should the nurse respond?", "options": ["Let her burn it because her preferences come first", "Tell her incense and flames cannot be used around oxygen, and problem solve a safe option with her", "Permit it if there is some ventilation", "Increase her oxygen flow to offset the smoke"]}, "r3": {"stem": "Opal's daughter reaches for a lighter to burn incense while Opal is on oxygen. What is the LVN's priority action?", "options": ["Let her light it to honor Opal's wishes", "Stop the incense, explain the fire danger with oxygen, and help find a safe substitute", "Allow it after opening a window", "Raise the oxygen liter flow so Opal is not bothered by the smoke"]}, "rationale": "Oxygen supports combustion, so incense, candles, and any open flame are absolutely contraindicated during oxygen therapy. The nurse respects her preferences, but safety comes first, so look for a safe alternative together. A cracked window does not remove the fire risk. Turning up the oxygen raises the fire risk and changes a prescribed dose without an order.", "hook": "Oxygen plus flame = no game.", "source": "EAQ FON_34 (FON Ch 37 p 1188)", "flag": null}, {"id": "W7_019", "topic": "Older Adult Health Promotion", "difficulty": "Intermediate", "type": "mc", "case": "W7_CASE1", "adpie": "Implementation", "answer": [2], "r1": {"stem": "Which instruction is most important after Opal's hemiarthroplasty?", "options": ["Avoid hot and cold temperature extremes", "Drink extra fluids at every meal", "Do not cross the legs or feet", "Practice her old referee splits to keep the hip limber"]}, "r2": {"stem": "Which teaching best protects Opal's new hip prosthesis?", "options": ["Stay away from very hot or very cold temperatures", "Increase fluid intake with meals", "Keep the legs and feet uncrossed", "Do splits like in her refereeing days to stay flexible"]}, "r3": {"stem": "The LVN is reinforcing discharge teaching for Opal. Which instruction is the priority for her hemiarthroplasty?", "options": ["Avoid temperature extremes", "Push fluids with each meal", "Never cross your legs or ankles", "Stretch into the splits daily"]}, "rationale": "Hemiarthroplasty replaces the femoral head after a hip fracture, and the new joint can dislocate. Crossing the legs or feet moves the hip into a position that can dislocate it, so avoiding it is the priority teaching. Avoiding temperature extremes relates to poor tissue perfusion, and fluids help overall health but do not protect the joint. Splits or extreme stretching risk dislocation.", "hook": "New hip? Don't cross the line (or your legs).", "source": "EAQ FON_42 (FON Ch 33 p 1100)", "flag": null}, {"id": "W7_020", "topic": "Home Health", "difficulty": "Intermediate", "type": "mc", "case": "W7_CASE1", "adpie": "Planning", "answer": [3], "r1": {"stem": "When setting goals for Opal's care, how should the nurse involve her household?", "options": ["Set goals with the family", "Set goals with Opal alone", "Let Opal and her family set goals without the nurse", "Set goals together with Opal and her family"]}, "r2": {"stem": "How will the nurse decide on attainable goals for Opal's home care?", "options": ["Work only with her relatives", "Work only with Opal", "Leave goal setting entirely to Opal and her family", "Work jointly with Opal and her family members"]}, "r3": {"stem": "The RN asks the LVN to help with goal planning at Opal's home. Which approach should the LVN support?", "options": ["Plan goals with the daughter and son in law", "Plan goals with Opal only", "Step back and let the household set goals alone", "Plan goals with Opal and her family together, with nursing guidance"]}, "rationale": "The nurse works with BOTH the patient and family to set attainable goals. Opal is the focus of care, but family members do much of the daily help, so including them improves follow through. Goals set with only one side leave out key people. Patients and families still need the nurse's direction to keep goals realistic.", "hook": "Goals are a group project: patient plus family plus nurse.", "source": "EAQ FON_48 (FON Ch 37 p 1194)", "flag": null}, {"id": "W7_021", "topic": "Long Term Care and Hospice", "difficulty": "Intermediate", "type": "sata", "case": null, "adpie": "Evaluation", "answer": [0, 1], "r1": {"stem": "Which statements about hospice care are accurate? Select all that apply.", "options": ["Hospice serves patients and families as the end of life approaches", "Hospice is available to people of any age", "Hospice is only for patients 65 and older", "Hospice is the same as respite care", "The main goal of hospice is to cure the disease"]}, "r2": {"stem": "A family asks what hospice is. Which explanations are correct? Select all that apply.", "options": ["It cares for patients and their families near the end of life", "It is open to any age group", "It is limited to people 65 or older", "It is another name for respite care", "Its focus is curing the illness"]}, "r3": {"stem": "The LVN is reinforcing the RN's teaching about hospice. Which statements should the LVN confirm as accurate? Select all that apply.", "options": ["\"Hospice supports both the patient and the family at the end of life.\"", "\"Hospice can help a patient of any age.\"", "\"You have to be at least 65 to get hospice.\"", "\"Hospice is a short stay so the family caregiver can rest.\"", "\"Hospice will work to cure the cancer.\""]}, "rationale": "Hospice provides care to patients and families as the end of life approaches, and it is available to any age group. Respite care is different: a scheduled, temporary stay in a facility so family caregivers get a break. Hospice focuses on improving the quality of remaining life, not cure. Age is not a requirement.", "hook": "Hospice = end of life, any age. Respite = rest for the caregiver.", "source": "EAQ FON_13, FON_19 (FON Ch 38 p 1201)", "flag": null}, {"id": "W7_022", "topic": "Long Term Care and Hospice", "difficulty": "Basic", "type": "mc", "case": null, "adpie": "Planning", "answer": [1], "r1": {"stem": "Rocco, 52, a part time balloon animal artist with a low income, needs help paying for medical care. Which program is designed for him?", "options": ["Medicare", "Medicaid", "Private insurance", "Long term care insurance"]}, "r2": {"stem": "A 52 year old balloon artist earns very little and cannot afford his medical bills. Which program pays medical costs for people with low incomes?", "options": ["The federal program for people 65 and older", "The federally funded, state run program for low income people", "A private health plan", "A long term care insurance policy"]}, "r3": {"stem": "While helping the RN with discharge planning, the LVN learns a 52 year old patient has a low income and no coverage. Which program should the LVN mention for the social worker referral?", "options": ["Medicare", "Medicaid", "Private insurance", "Long term care insurance"]}, "rationale": "Medicaid is federally funded and state operated, and it pays for medical care for people with low incomes. Medicare is the national health insurance program mainly for people 65 and older, and Rocco is 52. Private and long term care insurance require payments that low income patients usually cannot afford.", "hook": "MediCAID = AID for low income. MediCARE = CARE at 65.", "source": "EAQ FON_18 (FON Ch 38 p 1206)", "flag": null}, {"id": "W7_023", "topic": "Long Term Care and Hospice", "difficulty": "Basic", "type": "mc", "case": null, "adpie": "Implementation", "answer": [3], "r1": {"stem": "At Golden Oaks long term care, how often should residents be checked, repositioned, assessed for incontinence, and offered fluids?", "options": ["Once a shift", "Twice a shift", "Every 4 hours", "At least every 2 hours"]}, "r2": {"stem": "How frequently should safety rounds happen for residents in a long term care facility?", "options": ["One time per shift", "Two times per shift", "Every 4 hours", "Every 2 hours or more often"]}, "r3": {"stem": "The LVN is planning rounds for a hall of long term care residents. What is the minimum frequency the LVN should check, turn, toilet, and offer fluids?", "options": ["Once per shift", "Twice per shift", "Every 4 hours", "Every 2 hours"]}, "rationale": "Long term care residents should be seen, repositioned, checked for incontinence, given skin care, or offered fluids at least every 2 hours. This rhythm helps prevent pressure injuries, dehydration, and falls. Once or twice a shift, or every 4 hours, leaves too long a gap for safety.", "hook": "Every 2 hours: turn, toilet, tank up.", "source": "EAQ FON_41 (FON Ch 38 p 1209)", "flag": null}, {"id": "W7_024", "topic": "Long Term Care and Hospice", "difficulty": "Intermediate", "type": "mc", "case": null, "adpie": "Implementation", "answer": [3], "r1": {"stem": "Fitzgerald Bumble, a retired puppeteer living in long term care, tells staff he does not want CPR. Who writes the do not resuscitate (DNR) order?", "options": ["A family member", "The registered nurse", "The licensed vocational nurse", "The health care provider"]}, "r2": {"stem": "A former puppeteer requests no resuscitation. Which person is legally responsible for writing the DNR order?", "options": ["His adult son", "The RN on duty", "The LVN caring for him", "His health care provider"]}, "r3": {"stem": "Mr. Bumble tells the LVN he wants no CPR. Which statement reflects the correct process?", "options": ["His daughter can write the order for him", "The RN can write the order after talking with him", "The LVN can write it, since the LVN heard the request", "The health care provider must write the order, so the LVN reports his request to the RN"]}, "rationale": "Writing a DNR order is the legal responsibility of the health care provider, based on the patient's wishes. Family members, RNs, and LVNs do not write DNR orders. The LVN reports the patient's stated wishes to the RN so the provider can be notified. Until a DNR order is written, the patient remains a full code.", "hook": "Provider pens the DNR.", "source": "EAQ FON_49 (FON Ch 38 p 1206 to 1207)", "flag": null}, {"id": "W7_025", "topic": "Rehabilitation", "difficulty": "Basic", "type": "mc", "case": null, "adpie": "Planning", "answer": [0], "r1": {"stem": "A rehabilitation nurse plans care for Delphine, a former trapeze artist recovering from a spinal cord injury. Which philosophy guides the plan?", "options": ["Maximize the patient's abilities", "Minimize the impact of the patient's disabilities", "Improve the quality of remaining life", "Cure the acute illness"]}, "r2": {"stem": "Which idea is the foundation of rehabilitation care planning for a former trapeze artist?", "options": ["Building on what she can still do", "Reducing the effect of what she cannot do", "Making her remaining life more comfortable", "Curing her acute condition"]}, "r3": {"stem": "The LVN helps the RN write rehab goals for Delphine. Which focus should the LVN use?", "options": ["Her abilities", "Her disabilities", "Comfort for the remaining life", "Cure of the acute illness"]}, "rationale": "Rehabilitation focuses on abilities, not disabilities, and keeps making the most of what still works. Improving quality of remaining life is the focus of hospice and palliative care. Curing or reducing an acute illness is the focus of acute care. Minimizing disability sounds close, but it centers on the loss instead of the strengths.", "hook": "Rehab = ABILITIES, not disABILITIES.", "source": "EAQ FON_19, FON_44 (FON Ch 39 p 1212)", "flag": null}, {"id": "W7_026", "topic": "Rehabilitation", "difficulty": "Intermediate", "type": "sata", "case": null, "adpie": "Diagnosis", "answer": [0, 1], "r1": {"stem": "Which rehabilitation terms are correctly defined? Select all that apply.", "options": ["Chronic illness: a condition that lasts 3 months or longer", "Functional limitation: any loss of ability to perform tasks or activities of daily living", "Acute illness: a mild condition that lasts for years", "Paraplegia: paralysis of all four limbs", "Handicap: a condition that always resolves within 3 months"]}, "r2": {"stem": "Which term and definition pairs are accurate? Select all that apply.", "options": ["Chronic illness means a condition present for at least 3 months", "Functional limitation means losing the ability to do ADLs or other tasks", "Acute illness means a mild problem lasting many years", "Paraplegia means all four extremities are paralyzed", "Handicap means a problem that always clears up in under 3 months"]}, "r3": {"stem": "The LVN is documenting for Hank, a retired bagpiper who has had emphysema for 6 years and can no longer dress himself. Which terms can the LVN correctly apply? Select all that apply.", "options": ["Chronic illness, since his condition has lasted 3 months or longer", "Functional limitation, since he has lost the ability to do an ADL", "Acute illness, since emphysema is mild and lasts for years", "Paraplegia, since he cannot dress himself", "Handicap, since it will clear up within 3 months"]}, "rationale": "Chronic illness is a condition that lasts 3 months or longer. Functional limitation is any loss of ability to perform tasks or activities of daily living, like dressing or bathing. Acute illness is severe and short term, not mild and lasting years. Paraplegia affects the trunk and legs, not all four limbs. A handicap is a disadvantage that keeps a person from filling a normal role; it is not defined by a time limit.", "hook": "Chronic = 3 months plus. Functional limitation = can't do the ADL.", "source": "EAQ FON_09, FON_29 (FON Ch 39 p 1213)", "flag": null}, {"id": "W7_027", "topic": "Rehabilitation", "difficulty": "Intermediate", "type": "mc", "case": null, "adpie": "Assessment", "answer": [0], "r1": {"stem": "Jasper, a former pogo stick champion, has a spinal cord injury below the cervical level and now has paraplegia. Which function does the nurse expect him to keep?", "options": ["Control of both arms", "Control of only the head and neck", "Control of the left arm and left leg", "Control of the right arm and right leg"]}, "r2": {"stem": "A retired pogo stick champion has paraplegia from a thoracic spinal cord injury. Which body parts should he still be able to move?", "options": ["Both upper extremities", "Just the head and neck", "The left arm and left leg only", "The right arm and right leg only"]}, "r3": {"stem": "The LVN is checking motor function on a patient with paraplegia from an injury below the neck. Which finding should the LVN expect as consistent with this diagnosis?", "options": ["Strong, purposeful movement in both arms", "Movement of the head and neck only", "Movement on the left side only", "Movement on the right side only"]}, "rationale": "Paraplegia comes from damage below the cervical spine and causes weakness or paralysis of the trunk and legs, while the arms keep working. Quadriplegia comes from a cervical injury and affects all four limbs. Control of only one side (left or right arm and leg) describes hemiplegia, which is not the pattern of a spinal cord injury below the neck.", "hook": "PARA = a PAIR of legs. QUAD = all four.", "source": "EAQ FON_02, FON_03, FON_07 (FON Ch 39 p 1220)", "flag": null}, {"id": "W7_028", "topic": "Rehabilitation", "difficulty": "Difficult", "type": "mc", "case": null, "adpie": "Assessment", "answer": [1], "r1": {"stem": "Rex, a movie stunt double, was unconscious for 18 hours after a fall on set. Using the rehabilitation classification based on time unconscious, how is his brain injury classified?", "options": ["Mild", "Moderate", "Severe", "Catastrophic"]}, "r2": {"stem": "A stunt double lost consciousness for 18 hours after a filming accident. Based on how long he was unconscious, which level of brain injury does he have?", "options": ["Brief loss of consciousness, normal neuro exam", "Unconscious for 1 to 24 hours", "Unconscious for longer than 8 days", "Coma lasting months or longer"]}, "r3": {"stem": "Reviewing a rehab admission, the LVN reads that a patient was unconscious from 10 PM Monday until 6 PM Tuesday after a head injury. Which category should the LVN expect in the care plan?", "options": ["Mild", "Moderate", "Severe", "Catastrophic"]}, "rationale": "In the rehabilitation classification, moderate brain injury means unconsciousness lasting 1 to 24 hours, so 18 hours (or the 20 hours from Monday night to Tuesday evening) is moderate. Mild means only brief unconsciousness with a normal neuro exam, though postconcussive symptoms like headache, vertigo, and memory problems can last months. Severe means unconsciousness or post trauma amnesia longer than 8 days. Catastrophic means a coma lasting months or longer.", "hook": "Brief = Mild, up to a Day = Moderate, over a week = Severe, months = Catastrophic.", "source": "EAQ FON_28, FON_11, FON_31 (FON Ch 39 p 1223 to 1224)", "flag": "Rehab brain injury categories here use time unconscious (moderate 1 to 24 hours, severe more than 8 days). This is not the GCS based scale (mild 13 to 15, moderate 9 to 12, severe 3 to 8), and the Ch 14 neuro sources do not grade TBI severity. Use the FON version for this EAQ content; ask professor which scale the exam uses."}, {"id": "W7_029", "topic": "Population Health and Epidemiology", "difficulty": "Intermediate", "type": "mc", "case": "W7_CASE2", "adpie": "Diagnosis", "answer": [1], "r1": {"stem": "Which term best describes the influenza situation at Sunny Acres?", "options": ["Endemic", "Epidemic", "Pandemic", "Sporadic"]}, "r2": {"stem": "Flu cases among the bingo regulars are clearly higher than expected for this community. What is this called?", "options": ["A disease that is always present at a steady, expected level", "A rise in cases above what is normally expected in an area", "A disease spreading across several countries or continents", "Occasional, scattered cases with no clear pattern"]}, "r3": {"stem": "The public health nurse asks the LVN to help explain to staff why this is more than a normal flu season. Which term should the LVN use?", "options": ["Endemic, because influenza is always around in the community", "Epidemic, because cases are well above the expected level for this community", "Pandemic, because influenza can spread worldwide", "Sporadic, because the cases are random and unrelated"]}, "rationale": "An epidemic is an increase in cases above what is normally expected in a population or area, and a localized epidemic is often called an outbreak. Endemic means a disease is constantly present at its usual, expected level. Pandemic means an epidemic that has spread over several countries or continents. Sporadic means occasional, scattered cases. Twenty three linked cases where only a few are expected is an epidemic.", "hook": "ENdemic = ENdless baseline. EPIdemic = EPIc spike. PANdemic = PANoramic, worldwide.", "source": "General NCLEX PN content (no FON or Patton pages uploaded)", "flag": null}, {"id": "W7_030", "topic": "Communicable Disease", "difficulty": "Intermediate", "type": "mc", "case": "W7_CASE2", "adpie": "Implementation", "answer": [1], "r1": {"stem": "A center member with confirmed influenza is waiting in the clinic for a ride home. Which precautions does the nurse use in addition to standard precautions?", "options": ["Airborne precautions with an N95 respirator and a negative pressure room", "Droplet precautions with a surgical mask for close contact", "Contact precautions with gown and gloves only", "No extra precautions, because standard precautions are enough"]}, "r2": {"stem": "Which transmission based precautions fit a Sunny Acres member who has lab confirmed flu?", "options": ["Airborne isolation with an N95 and negative pressure", "Droplet precautions, wearing a surgical mask when near the patient", "Contact isolation using only a gown and gloves", "Standard precautions alone"]}, "r3": {"stem": "The LVN is rooming the bingo player with influenza in the clinic. Which precautions should the LVN implement?", "options": ["Airborne: fit tested N95 and a negative pressure room", "Droplet: surgical mask for close contact, plus standard precautions", "Contact: gown and gloves, without a mask", "Standard only: hand hygiene and gloves for body fluids"]}, "rationale": "Influenza spreads by large respiratory droplets from coughing, sneezing, and talking, so droplet precautions are used along with standard precautions. Staff wear a surgical mask for close contact, and the patient wears a mask when moving through common areas. Airborne precautions with an N95 and a negative pressure room are for tiny particles that stay suspended, such as TB, measles, and chickenpox. Contact precautions alone miss the droplet route, and standard precautions alone are not enough for influenza.", "hook": "Droplets drop: flu, pertussis, and mumps get a surgical mask.", "source": "General NCLEX PN content (no FON or Patton pages uploaded)", "flag": null}, {"id": "W7_031", "topic": "Population Health and Epidemiology", "difficulty": "Basic", "type": "mc", "case": "W7_CASE2", "adpie": "Planning", "answer": [0], "r1": {"stem": "Which action is primary prevention for the members of Sunny Acres?", "options": ["Annual influenza vaccination for members and staff", "Rapid flu testing for members with symptoms", "Pulmonary rehabilitation for a member recovering from flu pneumonia", "Handing out lucky bingo daubers to ward off germs"]}, "r2": {"stem": "Which activity prevents influenza before it ever starts among the bingo crowd?", "options": ["A yearly flu shot clinic for members and staff", "Quick flu swabs for anyone with fever and cough", "Lung rehab for a member recovering from pneumonia", "Passing out good luck daubers to scare off viruses"]}, "r3": {"stem": "The RN asks the LVN to help plan a clinic event for Sunny Acres. Which activity is primary prevention that the LVN can help carry out?", "options": ["Giving seasonal flu vaccines to members and staff", "Swabbing members who already have symptoms", "Running breathing exercises for a member after flu pneumonia", "Blessing each bingo dauber for germ protection"]}, "rationale": "Primary prevention stops disease before it starts, and immunization is a classic example. Rapid testing of people with symptoms is secondary prevention, which finds disease early. Pulmonary rehabilitation after pneumonia is tertiary prevention, which limits disability and restores function. Bingo daubers are great for bingo but do nothing for germs.", "hook": "Primary = Prevent it. Secondary = Spot it early. Tertiary = Treat the damage and rehab.", "source": "General NCLEX PN content (no FON or Patton pages uploaded)", "flag": null}, {"id": "W7_032", "topic": "Communicable Disease", "difficulty": "Difficult", "type": "sata", "case": "W7_CASE2", "adpie": "Implementation", "answer": [0, 1, 2, 3], "r1": {"stem": "Which actions break the chain of infection at Sunny Acres? Select all that apply.", "options": ["Perform hand hygiene often, especially before and after bingo", "Cover coughs and sneezes with a tissue or the elbow", "Ask members with fever and cough to stay home while sick", "Clean the shared karaoke microphone between singers", "Start everyone on antibiotics to stop the flu", "Keep sharing the microphone because singing boosts immunity"]}, "r2": {"stem": "Which measures interrupt flu transmission among the bingo regulars? Select all that apply.", "options": ["Wash or sanitize hands frequently, especially around game time", "Use a tissue or the elbow when coughing or sneezing", "Have members with fever and cough stay home until well", "Disinfect the karaoke mic after each singer", "Give antibiotics to all members to kill the influenza", "Pass the microphone freely since singing strengthens the immune system"]}, "r3": {"stem": "The public health nurse asks the LVN to reinforce infection control teaching at Sunny Acres. Which instructions should the LVN include? Select all that apply.", "options": ["\"Clean your hands before and after you play.\"", "\"Cough or sneeze into a tissue or your elbow.\"", "\"If you have a fever and cough, please stay home while you are sick.\"", "\"We will wipe down the microphone between singers.\"", "\"Ask your doctor for antibiotics to cure the flu.\"", "\"Sharing the mic is fine because singing protects you.\""]}, "rationale": "The chain of infection links are infectious agent, reservoir, portal of exit, mode of transmission, portal of entry, and susceptible host, and breaking any link stops spread. Hand hygiene and cleaning shared objects like the microphone break the mode of transmission. Covering coughs blocks the portal of exit, and keeping sick people home removes a source of spread. Antibiotics do not treat viruses like influenza. Sharing an uncleaned microphone keeps the chain intact.", "hook": "Break one link, break the chain.", "source": "General NCLEX PN content (no FON or Patton pages uploaded)", "flag": null}, {"id": "W7_033", "topic": "Population Health and Epidemiology", "difficulty": "Intermediate", "type": "sata", "case": null, "adpie": "Planning", "answer": [0, 1, 2], "r1": {"stem": "Which activities are secondary prevention? Select all that apply.", "options": ["Mammogram to screen for breast cancer", "Blood pressure screening at a health fair", "Pap test to screen for cervical cancer", "Tetanus immunization", "Cardiac rehabilitation after a heart attack"]}, "r2": {"stem": "At the annual Rubber Duck Regatta health fair, which services count as secondary prevention? Select all that apply.", "options": ["Breast cancer screening with mammography", "Free blood pressure checks", "Cervical cancer screening with a Pap test", "A tetanus shot", "A cardiac rehab program after a myocardial infarction"]}, "r3": {"stem": "The LVN is staffing a community health fair booth. Which services the LVN helps with are secondary prevention? Select all that apply.", "options": ["Helping schedule screening mammograms", "Taking blood pressures to find undiagnosed hypertension", "Reminding women when their Pap test is due", "Giving a tetanus booster", "Leading exercise for people recovering from a heart attack"]}, "rationale": "Seco
