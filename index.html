<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Neuro Sensory Gauntlet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one column study app. Passcode gate, week picker, then each week is its own page with 3 rounds. */
:root{
  --bg:#f7f0e3; --card:#fffaf1; --ink:#2b2622; --muted:#6d6259; --line:#d9c7ab;
  --coral:#e2634d; --coral-ink:#ffffff; --tan:#eadbc2; --teal:#1f7a78; --teal-soft:#e2f1ef;
  --ok:#2f7d4a; --ok-soft:#e5f3e8; --bad:#b8392b; --bad-soft:#fbe7e3;
  --amber:#a86b00; --amber-soft:#fff2d6; --purple:#6b46a8; --purple-soft:#efe8fa;
  --basic:#2f7d4a; --inter:#2563a8; --diff:#b8392b;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1d1a17; --card:#27231f; --ink:#f1e9dd; --muted:#b5a898; --line:#4a4036;
  --coral:#ef7a63; --coral-ink:#1d1a17; --tan:#3a322a; --teal:#5cc3bf; --teal-soft:#1c3533;
  --ok:#6fcf8f; --ok-soft:#1e3326; --bad:#f08a7c; --bad-soft:#3d2320;
  --amber:#f2b648; --amber-soft:#3a2e15; --purple:#b394ea; --purple-soft:#2e2540;
  --basic:#6fcf8f; --inter:#7fb2f0; --diff:#f08a7c; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1d1a17; --card:#27231f; --ink:#f1e9dd; --muted:#b5a898; --line:#4a4036;
  --coral:#ef7a63; --coral-ink:#1d1a17; --tan:#3a322a; --teal:#5cc3bf; --teal-soft:#1c3533;
  --ok:#6fcf8f; --ok-soft:#1e3326; --bad:#f08a7c; --bad-soft:#3d2320;
  --amber:#f2b648; --amber-soft:#3a2e15; --purple:#b394ea; --purple-soft:#2e2540;
  --basic:#6fcf8f; --inter:#7fb2f0; --diff:#f08a7c; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.5}
.wrap{max-width:760px; margin:0 auto; padding-inline:16px; padding-block:12px 96px}
h1,h2,h3{font-family:var(--display); text-wrap:balance; margin:0}
h1{font-size:clamp(1.9rem,6vw,2.7rem); font-weight:800; letter-spacing:-.01em; line-height:1.05}
h2{font-size:1.5rem; font-weight:800}
h3{font-size:1.1rem; font-weight:600}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--teal); outline-offset:2px}
.btn{border:0; border-radius:999px; padding:12px 20px; font-weight:700; background:var(--coral); color:var(--coral-ink)}
.btn.ghost{background:transparent; color:var(--ink); border:2px solid var(--line)}
.btn.teal{background:var(--teal); color:var(--card)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.row{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.stack{display:grid; gap:14px}
.muted{color:var(--muted)}
.eyebrow{font-size:.78rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:700}
/* gate */
.gate{min-height:70vh; display:grid; place-items:center; text-align:center}
.gate .box{display:grid; gap:14px; max-width:340px}
.gate input{font:inherit; font-size:1.4rem; text-align:center; letter-spacing:.4em; padding:12px; border-radius:14px; border:2px solid var(--line); background:var(--card); color:var(--ink); width:100%}
/* home */
.hero{padding-block:24px 18px; display:grid; gap:10px}
.weeks{display:grid; gap:14px}
.week{background:var(--card); border:2px solid var(--line); border-radius:18px; padding:18px; display:grid; gap:10px}
.week .num{font-family:var(--display); font-weight:800; font-size:2.4rem; color:var(--coral); line-height:1}
.week .head{display:flex; gap:14px; align-items:center}
.week .head>div{min-width:0}
.week .meta{font-size:.9rem}
.badge{display:inline-block; padding:3px 10px; border-radius:999px; font-size:.78rem; font-weight:700; background:var(--tan); color:var(--ink)}
.badge.done{background:var(--ok-soft); color:var(--ok)}
/* header */
.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); padding-block:10px 8px; border-bottom:1px solid var(--line)}
.bar .row{justify-content:space-between; flex-wrap:nowrap}
.pill{border-radius:999px; padding:7px 14px; font-weight:700; font-size:.9rem; background:var(--card); border:2px solid var(--line); white-space:nowrap}
.pill.score{background:var(--coral); color:var(--coral-ink); border-color:var(--coral)}
.count{font-weight:700; font-size:.92rem; text-align:center; font-variant-numeric:tabular-nums}
.prog{height:10px; background:var(--tan); border-radius:999px; overflow:hidden; margin-top:8px}
.prog i{display:block; height:100%; width:0; background:var(--coral); transition:width .3s}
.tools{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px}
.tool{border:2px solid var(--line); background:var(--card); border-radius:999px; padding:5px 12px; font-size:.85rem; font-weight:700}
.tool[aria-pressed="true"]{background:var(--teal); color:var(--card); border-color:var(--teal)}
/* start screen */
.panel{background:var(--card); border:2px solid var(--line); border-radius:18px; padding:18px; display:grid; gap:14px}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{border:2px solid var(--line); background:var(--bg); border-radius:999px; padding:6px 12px; font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--coral); color:var(--coral-ink); border-color:var(--coral)}
/* question card */
.cards{display:grid; gap:18px; margin-top:16px}
.case{background:var(--teal-soft); border:2px solid var(--teal); border-radius:16px; padding:14px 16px; display:grid; gap:6px}
.case .eyebrow{color:var(--teal)}
.q{background:var(--card); border:2px solid var(--line); border-radius:18px; padding:16px; display:grid; gap:12px; scroll-margin-top:120px}
.q.in-case{border-color:var(--teal)}
.q .top{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.topic{background:var(--coral); color:var(--coral-ink); border-radius:999px; padding:3px 10px; font-size:.78rem; font-weight:700}
.diff{border-radius:999px; padding:3px 10px; font-size:.78rem; font-weight:700; border:2px solid currentColor}
.diff.Basic{color:var(--basic)} .diff.Intermediate{color:var(--inter)} .diff.Difficult{color:var(--diff)}
.adpie{background:var(--purple); color:var(--card); border-radius:999px; padding:3px 10px; font-size:.78rem; font-weight:700}
.sata{font-size:.78rem; font-weight:700; color:var(--teal)}
.qnum{font-size:.82rem; color:var(--muted); font-variant-numeric:tabular-nums}
.bm{margin-left:auto; background:none; border:0; font-size:1.25rem; line-height:1; padding:4px; color:var(--muted)}
.bm[aria-pressed="true"]{color:var(--coral)}
.stem{font-size:1.05rem; font-weight:700}
.opts{display:grid; gap:8px}
.opt{display:flex; gap:10px; text-align:left; width:100%; background:var(--bg); border:2px solid var(--line); border-radius:14px; padding:11px 13px; align-items:flex-start}
.opt .k{flex:none; width:26px; height:26px; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center; font-size:.8rem; font-weight:700}
.opt.multi .k{border-radius:7px}
.opt>span:last-child{min-width:0}
.opt[aria-pressed="true"]{border-color:var(--coral); background:var(--card)}
.opt[aria-pressed="true"] .k{background:var(--coral); border-color:var(--coral); color:var(--coral-ink)}
.opt.right{border-color:var(--ok); background:var(--ok-soft)}
.opt.right .k{background:var(--ok); border-color:var(--ok); color:var(--card)}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad); border-color:var(--bad); color:var(--card)}
.opt:disabled{cursor:default}
.submit{justify-self:start}
.fb{border-radius:14px; padding:12px 14px; display:grid; gap:8px}
.fb.ok{background:var(--ok-soft)} .fb.no{background:var(--bad-soft)}
.fb .verdict{font-weight:700}
.fb.ok .verdict{color:var(--ok)} .fb.no .verdict{color:var(--bad)}
.hook{background:var(--purple-soft); border-radius:10px; padding:8px 10px; font-size:.93rem}
.hook b{color:var(--purple)}
.flag{background:var(--amber-soft); border:2px solid var(--amber); border-radius:12px; padding:10px 12px; font-size:.93rem}
.flag b{color:var(--amber)}
.src{font-size:.8rem; color:var(--muted)}
/* results */
.big{font-family:var(--display); font-size:3.4rem; font-weight:800; color:var(--coral); line-height:1; font-variant-numeric:tabular-nums}
.missed{display:grid; gap:6px; padding-left:0; list-style:none; margin:0}
.missed li{display:flex; justify-content:space-between; gap:10px; border-bottom:1px solid var(--line); padding-block:6px}
.inter{text-align:center; padding-block:40px; display:grid; gap:14px; justify-items:center}
.inter .big{font-size:2.6rem}
.foot{margin-top:22px; display:flex; gap:10px; flex-wrap:wrap; justify-content:space-between}
.themebtn{position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:20; width:52px; height:52px; border-radius:50%;
  border:2px solid var(--line); background:var(--card); color:var(--ink); font-size:1.5rem; line-height:1; display:grid; place-items:center;
  box-shadow:0 4px 14px rgba(0,0,0,.18)}
.themebtn:hover{border-color:var(--coral)}
@media (prefers-reduced-motion: reduce){ *{transition:none!important; scroll-behavior:auto!important} }
</style>

<script>
const DATA = [{"week": 4, "title": "Neurological Disorders", "tagline": "Week 4: neurons fire, patients posture, and absolutely nobody gets a straw.", "cases": {"W4_CASE1": {"title": "Case: Mr. Gus Pumpernickel, Pie Judge", "text": "Mr. Gus Pumpernickel, 61, judges pie contests for a living and is admitted with a brain tumor while he waits for surgery. His wife says his headaches are worse in the morning and he has been 'extra crabby about crust' lately. He is on the neuro unit with hourly neuro checks. You are the LVN working with his RN."}, "W4_CASE2": {"title": "Case: Mrs. Dolores Featherstone, Bingo Streamer", "text": "Mrs. Dolores Featherstone, 74, live streams bingo to 3,000 followers every morning. At 7:10 am she suddenly could not call out B 12, her right arm dropped, and the right side of her face drooped. She is right handed and has atrial fibrillation. EMS brings her to the ED, where you are the LVN helping the stroke team."}}, "questions": [{"id": "W4_001", "topic": "Neuro Assessment", "difficulty": "Basic", "type": "mc", "case": null, "adpie": "Assessment", "answer": [1], "r1": {"stem": "Mr. Lyle Bramble, a retired rodeo clown, is found in his recliner. He opens his eyes when you say his name, chats with you but insists it is 1987, and pulls his hand away when you apply nail bed pressure. What is his Glasgow Coma Scale score?", "options": ["9", "11", "13", "15"]}, "r2": {"stem": "A retired rodeo clown opens his eyes to his name, talks but is confused about the year, and withdraws his hand from nail bed pressure. Which GCS total fits these findings?", "options": ["A total of 9", "A total of 11", "A total of 13", "A total of 15"]}, "r3": {"stem": "As the LVN doing hourly neuro checks, you find the same patient opens his eyes to voice, gives confused answers, and withdraws from pressure. Which total do you document so the RN can compare it with his baseline?", "options": ["9 points", "11 points", "13 points", "15 points"]}, "rationale": "Eye opening to voice scores 3, confused conversation scores 4, and withdrawing from pain scores 4, so 3 + 4 + 4 = 11. The GCS adds three areas: eyes (max 4), verbal (max 5), and motor (max 6). Normal is 15, the lowest is 3, and 8 or less means coma. A total of 9 undercounts his responses, while 13 and 15 give credit for responses he did not show. Any drop from baseline gets reported.", "hook": "Eyes 4, Verbal 5 (jive), Motor 6. Max 15, min 3, 8 or less = intubate.", "source": "MOD3_AP s50 to 51 (GCS table); AHN Ch 14 p 664 to 665", "flag": null}, {"id": "W4_002", "topic": "Neuro Assessment", "difficulty": "Intermediate", "type": "mc", "case": null, "adpie": "Assessment", "answer": [1], "r1": {"stem": "During neuro checks, Mrs. Petunia Gale rigidly straightens all four of her limbs when you apply a painful stimulus. How should the nurse interpret this finding?", "options": ["Decorticate posturing, which points to a nonfunctioning cortex and is a mild finding", "Decerebrate posturing, which points to a brainstem problem and signals deterioration", "Purposeful movement to pain, which scores 5 on the GCS motor scale", "A normal startle reflex that does not need to be reported"]}, "r2": {"stem": "When you press on her nail bed, a patient stiffly extends both arms and both legs. Which statement best describes what you are seeing?", "options": ["Flexor (decorticate) posturing from cortical damage, not a real concern", "Extensor (decerebrate) posturing from a brainstem lesion, a sign of worsening", "Localizing to pain, worth 5 points for motor response", "An expected reflex that can be charted without follow up"]}, "r3": {"stem": "As the LVN, you see a patient with a brain tumor rigidly extend her arms and legs to a painful stimulus. An hour ago she flexed her arms onto her chest. What is your priority?", "options": ["Document improved decorticate posturing at the next routine check", "Report the new decerebrate posturing to the RN right away because it means brainstem deterioration", "Praise her purposeful movement and recheck in 4 hours", "Reposition her limbs and reassess at the end of the shift"]}, "rationale": "Rigid extension of the arms and legs is extensor (decerebrate) posturing, which points to a brainstem lesion. Flexion of the arms onto the chest is decorticate posturing and points to a nonfunctioning cortex. Any posturing means deterioration, decerebrate is worse than decorticate, and flaccid (no response) is worse still. Purposeful or localizing movement would score higher on the GCS, and posturing is never a normal reflex. Moving from flexion to extension is a decline, so report it at once.", "hook": "DeCORticate = arms to the CORe. DEcErebrate = Extended Everything, and it is worse.", "source": "MOD3_AP s53 to 54; CD_ICP_HA s5 to 7 (posturing figure); GCS motor scores 3 and 2", "flag": null}, {"id": "W4_003", "topic": "Neuro Assessment", "difficulty": "Intermediate", "type": "mc", "case": null, "adpie": "Assessment", "answer": [1], "r1": {"stem": "Mr. Thaddeus Pickle is intubated after surgery, so he cannot give a verbal response. The unit uses the FOUR score. Which statement about this scale is correct?", "options": ["The four category scores are added together for a total out of 16", "Each category is scored 0 to 4 and the scores are recorded separately, not totaled", "It replaces pupil checks because it only looks at eye opening", "It cannot be used for intubated patients because it requires speech"]}, "r2": {"stem": "An intubated patient is assessed with the Full Outline of UnResponsiveness (FOUR) score. How are the results reported?", "options": ["As one summed score with a maximum of 16", "As separate 0 to 4 scores for eye, motor, brainstem, and respiration", "As eye opening only, since pupils go on a different form", "Not at all, because the tool needs a verbal answer"]}, "r3": {"stem": "As the LVN documenting a FOUR score on an intubated patient, which entry follows the tool correctly?", "options": ["FOUR total 11 out of 16", "E3 M2 B4 R1, each recorded as its own score", "Eye score only; brainstem reflexes skipped", "Unable to score because the patient cannot talk"]}, "rationale": "The FOUR score rates four categories: Eye response, Motor response, Brainstem reflexes, and Respiration. Each is scored from 0 (worst) to 4 (best), and the scores are NOT added together. It works better than the GCS for intubated patients because it has no verbal section. The brainstem category includes pupil and corneal reflexes, so it does not replace pupil checks. Facility policy and the patient's condition decide whether GCS, FOUR, or both are used.", "hook": "FOUR = Eyes, Motor, Brainstem, Respiration. Four boxes, never one total.", "source": "AHN Ch 14 p 664 to 665, Table 14.4; Cooper TB idea AHN14_MC06", "flag": null}, {"id": "W4_004", "topic": "Neuro Assessment", "difficulty": "Intermediate", "type": "sata", "case": null, "adpie": "Assessment", "answer": [0, 2, 3, 4], "r1": {"stem": "Mr. Wendell Plum, a professional whistler, is getting a cranial nerve check. Which nerve and test pairings are correct? Select all that apply.", "options": ["CN I: identify a familiar smell like coffee with eyes closed", "CN II: smile and puff out the cheeks", "CN X: gag reflex and watching the uvula rise", "CN XI: shrug the shoulders against resistance", "CN XII: stick out the tongue and check that it stays midline", "CN VIII: follow a penlight with the eyes"]}, "r2": {"stem": "Which cranial nerve assessments are matched to the right nerve? Select all that apply.", "options": ["Olfactory (I): name a common odor with eyes shut", "Optic (II): show facial symmetry by smiling", "Vagus (X): uvula and soft palate movement, gag", "Spinal accessory (XI): shoulder shrug with resistance", "Hypoglossal (XII): protrude the tongue and look for deviation", "Vestibulocochlear (VIII): track a moving finger"]}, "r3": {"stem": "As the LVN collecting neuro data on a stroke patient, you test several cranial nerves. Which findings are correctly linked to the listed nerve for your report to the RN? Select all that apply.", "options": ["Cannot identify a peppermint scent: CN I", "Drooping smile on one side: CN II", "Absent gag and the uvula does not rise: CN X", "Weak shoulder shrug on the left: CN XI", "Tongue deviates to one side: CN XII", "Cannot hear a whisper: CN III"]}, "rationale": "CN I tests smell, CN X is checked with the gag reflex and uvula movement, CN XI with a shoulder shrug, and CN XII by watching the tongue stay midline. Smiling and facial symmetry test CN VII (facial), not CN II, which is vision. Following a light or finger tests CN III, IV, and VI, while CN VIII covers hearing and balance. An absent gag or deviated tongue after a stroke raises aspiration risk, so report it.", "hook": "On Old Olympus's Towering Tops A Finn And German Viewed Some Hops.", "source": "MOD3_AP s39 to 43; AHN Ch 14 cranial nerve testing table (study notes p 2 to 3)", "flag": null}, {"id": "W4_005", "topic": "Neuro Assessment", "difficulty": "Basic", "type": "mc", "case": null, "adpie": "Diagnosis", "answer": [1], "r1": {"stem": "After a stroke, Mr. Ignatius Fudge speaks in long, smooth sentences that make no sense, such as 'the pancake drove my umbrella,' and he cannot follow simple commands. Which type of aphasia is this?", "options": ["Expressive aphasia from damage to Broca's area in the frontal lobe", "Receptive aphasia from damage to Wernicke's area in the temporal lobe", "Dysarthria from weak speech muscles", "Anomic aphasia, which only affects naming objects"]}, "r2": {"stem": "A patient talks fluently, but his words carry no meaning and he does not understand what you say. What is the best label?", "options": ["Motor (expressive) aphasia, Broca's area", "Sensory (receptive) aphasia, Wernicke's area", "Poor articulation from muscle weakness (dysarthria)", "Trouble naming objects only (anomic aphasia)"]}, "r3": {"stem": "As the LVN, you notice a new stroke patient answers 'blue Tuesday' when asked his name and cannot follow 'squeeze my hand.' Which description do you report to the RN?", "options": ["Expressive aphasia: understands but cannot form words", "Receptive aphasia: hears speech but it has no meaning to him", "Dysarthria: slurred speech with normal language", "Anomic aphasia: only cannot name objects"]}, "rationale": "Receptive (sensory) aphasia comes from damage to Wernicke's area in the temporal lobe: the patient hears sound but it has no meaning, like a foreign language, so speech may flow but make no sense. Expressive (motor) aphasia is Broca's area in the frontal lobe: the patient understands but cannot get the words out. Dysarthria is a muscle control problem with normal language, and anomic aphasia is only trouble naming objects. Aphasia means language is defective or absent because of damage to the cerebral cortex.", "hook": "Broca = Broken speech (Expressive). Wernicke = Wordy but no meaning (Receptive).", "source": "MOD3_AP s23 to 24, s52; AHN Ch 14 p 665, p 701", "flag": "N21: textbook p 701 calls aphasia a 'total loss' of language, while the key terms and assessment section say defective OR absent. Use 'defective or absent' on the exam; ask professor if the wording comes up."}, {"id": "W4_006", "topic": "Neuro Diagnostics", "difficulty": "Intermediate", "type": "mc", "case": null, "adpie": "Assessment", "answer": [1], "r1": {"stem": "Ms. Juniper Wobble is scheduled for a lumbar puncture this afternoon. While prepping her, you notice she is newly restless, her headache is worse than this morning, and her right pupil reacts sluggishly. What should the nurse do?", "options": ["Help her empty her bladder and position her side lying with knees to chest", "Hold the procedure and report the findings, since a lumbar puncture is contraindicated with increased ICP", "Give the ordered acetaminophen and proceed, since a headache is expected before an LP", "Encourage oral fluids now to prevent a spinal headache later"]}, "r2": {"stem": "Before a scheduled LP, a patient becomes restless with a worsening headache and a sluggish pupil. Which action is best?", "options": ["Have her void, then place her in the lateral recumbent position", "Stop and report these signs, because an LP with raised intracranial pressure can cause herniation", "Medicate the headache and continue with the test", "Push oral fluids so she will not get a spinal headache"]}, "r3": {"stem": "As the LVN helping set up for a lumbar puncture, you find new restlessness, a worsening headache, and a sluggish right pupil. Which action is within your role and the priority?", "options": ["Finish positioning her so the provider is not delayed", "Stop the setup and report the findings to the RN and provider right away", "Give PRN acetaminophen and tell her the headache is normal", "Start pushing oral fluids and recheck after the LP"]}, "rationale": "Restlessness, a worsening headache, and a sluggish pupil are signs of increased ICP. A lumbar puncture is CONTRAINDICATED with increased ICP because removing CSF from below can let the brain herniate through the foramen magnum and press on the breathing and heart centers. Voiding and side lying positioning are normal LP prep, but only when the test is safe to do. Treating the headache or pushing fluids ignores a possible emergency.", "hook": "Pressure up top? The LP gets a STOP.", "source": "MOD3_AP s61; CD_ICP_HA s8; AHN Ch 14 p 668, p 676; Key Points p 718", "flag": null}, {"id": "W4_007", "topic": "Neuro Diagnostics", "difficulty": "Intermediate", "type": "sata", "case": null, "adpie": "Planning", "answer": [0, 1, 2, 3], "r1": {"stem": "Mr. Horace Tinkle, who wears a giant belt buckle shaped like a lucky horseshoe, has several neuro tests scheduled this week. Which teaching or care points match the test? Select all that apply.", "options": ["MRI: remove all metal and ask about a pacemaker or other implants", "CT with contrast: ask about iodine or shellfish allergy and check kidney function", "EEG: wash hair before the test; for a sleep deprived EEG, stay awake the night before", "Femoral cerebral angiogram: bed rest 4 to 6 hours after, with distal pulse and site checks for hematoma", "Myelogram: no baseline leg check is needed because the dye stays in the head", "MRI: it is silent and roomy, so claustrophobia is never an issue"]}, "r2": {"stem": "Which pairings of diagnostic test and nursing care are accurate? Select all that apply.", "options": ["Magnetic resonance imaging: take off metal objects and screen for implanted devices", "Contrast CT: screen for iodine or seafood allergy and review renal function", "Electroencephalogram: clean hair; keep awake overnight if a sleep deprived study is ordered", "Femoral angiography: 4 to 6 hours of bed rest with distal pulse and puncture site checks", "Myelography: skip baseline leg strength and sensation, since the dye goes to the brain", "Magnetic resonance imaging: quiet and spacious, so no need to ask about fear of tight spaces"]}, "r3": {"stem": "As the LVN reinforcing teaching and collecting data for Mr. Tinkle's tests, which actions are appropriate? Select all that apply.", "options": ["Before MRI, have him remove the belt buckle and report any pacemaker or implant to the RN", "Before contrast CT, ask about iodine or shellfish allergy and note his kidney labs", "Before EEG, check that his hair is clean; for a sleep deprived EEG, remind him to stay up the night before", "After a femoral angiogram, keep him on bed rest 4 to 6 hours and check pedal pulses and the site", "Before a myelogram, skip the baseline leg assessment since nothing changes in the legs", "Before MRI, tell him claustrophobia is never a concern, so there is nothing to report"]}, "rationale": "MRI uses a strong magnet, so remove all metal and ask about pacemakers, older aneurysm clips, stents, and shrapnel; it is also loud, and claustrophobia is common, so ask and medicate if needed. Contrast CT needs an iodine or shellfish allergy check and a kidney function review. EEG needs clean hair, and a sleep deprived EEG means staying awake the night before. After a femoral angiogram, keep bed rest 4 to 6 hours and check distal pulses and the site. A myelogram puts dye into the spinal subarachnoid space, so get a BASELINE of leg strength and sensation first.", "hook": "MRI = Magnet: Remove Iron.", "source": "MOD3_AP s59, s62; AHN Ch 14 p 668, Diagnostic Tests at a Glance (study notes p 8)", "flag": "N9: sources say ask about iodine and shellfish allergy before contrast; current evidence says shellfish allergy is not a specific contrast risk (a prior contrast reaction is). Exam answer: ask about iodine and shellfish allergy."}, {"id": "W4_008", "topic": "Neuro Diagnostics", "difficulty": "Difficult", "type": "mc", "case": null, "adpie": "Planning", "answer": [0], "r1": {"stem": "Mr. Basil Crumpet had a lumbar puncture at the L3 to L4 interspace this morning. Now he has a pounding headache every time he sits up, and bed rest, fluids, and analgesics have not helped. Which treatment should the nurse anticipate?", "options": ["An epidural blood patch using 20 to 30 mL of his own blood", "A second lumbar puncture to remove more CSF", "Sitting him in high Fowler position for several hours", "An IV opioid every 2 hours, since opioids work best for this headache"]}, "r2": {"stem": "After an LP, a patient's headache worsens when upright and does not improve with bed rest, hydration, and pain medicine. Which intervention is likely next?", "options": ["Injecting 20 to 30 mL of the patient's own blood into the epidural space", "Repeating the spinal tap to drain additional fluid", "Keeping him upright in high Fowler for several hours", "Scheduling IV opioids, the most effective option for this headache"]}, "r3": {"stem": "As the LVN caring for Mr. Crumpet, whose post LP headache did not respond to bed rest, fluids, and analgesics, which explanation can you reinforce after the provider's teaching?", "options": ["The provider may inject a small amount of your own blood near the puncture to seal the leak", "The provider will likely remove more spinal fluid to relieve the pressure", "Sitting straight up for several hours will close the hole", "Strong opioids every 2 hours are the best fix for this headache"]}, "rationale": "A post LP headache comes from CSF leaking out of the puncture site and happens in about 30% of patients. First line care is bed rest lying flat, hydration, analgesics, and ice to the head. If it is severe and persists, a blood patch injects 20 to 30 mL of the patient's own blood into the epidural space to seal the leak. Removing more fluid would make the leak worse, and sitting up worsens this type of headache. Opioids usually do not help a spinal headache.", "hook": "Leaky tap? Blood patch it: 20 to 30 mL.", "source": "MOD3_AP s61; AHN Ch 14 p 667 to 668 (study notes p 7)", "flag": "N1: the professor deck says the LP needle goes in at the L3 to L4 interspace; textbook notes say L4 to L5. Both are below where the cord ends (L1 to L2). Use L3 to L4 on the exam unless told otherwise; ask professor."}, {"id": "W4_009", "topic": "Increased ICP", "difficulty": "Difficult", "type": "mc", "case": null, "adpie": "Assessment", "answer": [1], "r1": {"stem": "Mrs. Rosalind Thistlewaite, a retired lighthouse keeper, has a growing LEFT sided brain tumor. Which pupil change would the nurse expect to see FIRST as her ICP rises?", "options": ["Both pupils fixed and dilated at the same time", "Her left pupil becomes sluggish, then dilates and stops reacting", "Her right pupil constricts to a pinpoint", "Both pupils react briskly and equally (PERRLA)"]}, "r2": {"stem": "A patient has an expanding mass on the left side of the brain. As intracranial pressure climbs, which early pupil pattern is expected?", "options": ["Bilateral fixed, dilated pupils appear first", "The left pupil turns sluggish, then widens and becomes nonreactive", "The right pupil becomes pinpoint", "Pupils stay equal, round, and briskly reactive"]}, "r3": {"stem": "As the LVN doing neuro checks on a patient with a left brain lesion, you note her left pupil is now larger and reacts slowly. Which interpretation do you report to the RN immediately?", "options": ["An expected finding, since both pupils always fix together late", "Same side (ipsilateral) CN III compression, a sign of impending herniation", "An opposite side pupil change that rules out increased ICP", "Normal PERRLA that needs no report"]}, "rationale": "Pupil changes start on the SAME side as the lesion because the expanding mass compresses the oculomotor nerve (CN III) on that side. The pupil first turns sluggish, then dilates and stops reacting, and later both pupils become fixed and dilated. A fixed, dilated ('blown') pupil is ominous and is reported immediately. A pinpoint pupil on the opposite side and brisk, equal pupils do not fit rising ICP. The classic picture is an ipsilateral dilated pupil with contralateral hemiparesis.", "hook": "Same side pupil blows first: Ipsi = Itself.", "source": "CD_ICP_HA s5 to 7; AHN Ch 14 p 674; Key Points p 718", "flag": "N19: textbook p 674 wording is confusing (it says the dilated pupil looks larger than 'the affected side' and describes the BP change two ways). Exam answer: the same side (ipsilateral) pupil dilates first, with widening pulse pressure; ask professor if the wording appears."}, {"id": "W4_010", "topic": "Increased ICP", "difficulty": "Basic", "type": "mc", "case": "W4_CASE1", "adpie": "Assessment", "answer": [0], "r1": {"stem": "At 0200, Mr. Pumpernickel needs a firm shake to wake up, then asks whether the cherry pie entries have been judged yet. At 2200 he woke to his name and was oriented. Which finding is the EARLIEST and most sensitive sign of increased ICP?", "options": ["The decrease in his level of consciousness", "Bradycardia with a widening pulse pressure", "A fixed, dilated pupil", "Decerebrate posturing"]}, "r2": {"stem": "Mr. Pumpernickel now takes more stimulation to wake and is confused about where he is. Which sign of rising ICP shows up first?", "options": ["A declining level of consciousness", "A slow pulse with a growing gap between systolic and diastolic", "A blown pupil that does not react", "Rigid extension of the arms and legs"]}, "r3": {"stem": "As the LVN on nights, you notice Mr. Pumpernickel now needs a firm shake to respond and is newly disoriented. His vital signs are stable. What is your best action?", "options": ["Report the LOC change to the RN now, since it is the earliest sign of rising ICP", "Wait until his BP rises and his pulse drops before calling", "Wait to call until one pupil is fixed and dilated", "Wait to report until he shows posturing"]}, "rationale": "A change or decrease in LOC is the earliest and most sensitive sign of increased ICP; it takes more stimulation to get the same response. LOC drops because poor cerebral blood flow starves the cortex and the reticular activating system of oxygen. Cushing triad, a blown pupil, and posturing are LATE signs, and waiting for them loses the window when ICP is still reversible. Report any LOC change right away.", "hook": "LOC is the first domino to fall.", "source": "CD_ICP_HA s5 to 7; MOD3_AP s48 to 49; AHN Ch 14 p 674", "flag": null}, {"id": "W4_011", "topic": "Increased ICP", "difficulty": "Intermediate", "type": "sata", "case": "W4_CASE1", "adpie": "Implementation", "answer": [0, 1, 2, 5], "r1": {"stem": "Which nursing interventions help keep Mr. Pumpernickel's ICP from rising? Select all that apply.", "options": ["Elevate the head of the bed 30 to 45 degrees", "Keep his neck in a neutral, midline position", "Suction only as needed, no longer than 10 seconds, with 100% oxygen before and after", "Encourage him to bear down and push during bowel movements so he does not get constipated", "Have him do resistive leg presses against the footboard every hour", "Avoid sharp flexion of his hips"]}, "r2": {"stem": "Which actions lower the risk of increasing intracranial pressure for this patient? Select all that apply.", "options": ["Raise the head of the bed to 30 to 45 degrees", "Keep the head and neck straight, not flexed or turned", "Limit suctioning to 10 seconds or less and give 100% O2 before and after", "Coach him to strain hard at stool to avoid constipation", "Schedule hourly isometric leg pushes against the footboard", "Prevent extreme flexion at the hips and waist"]}, "r3": {"stem": "As the LVN, which care measures for Mr. Pumpernickel are within your scope and help control ICP? Select all that apply.", "options": ["Keep the HOB at 30 to 45 degrees during care", "Use a small towel roll so his head stays midline", "Suction PRN for 10 seconds or less with 100% oxygen before and after", "Tell him to hold his breath and bear down on the bedpan", "Lead him through resistive exercises to keep his strength up", "Keep his hips from being bent sharply when you reposition him"]}, "rationale": "HOB 30 to 45 degrees and a neutral neck promote venous drainage from the head. Limit suctioning to 10 seconds with 100% oxygen before and after, since suctioning and hypoxia raise ICP. Avoid extreme hip flexion because it increases abdominal and chest pressure. Straining at stool is a Valsalva maneuver, and isometric or resistive exercise also raises ICP, so skip both. Fluids are restricted and fever is controlled as well.", "hook": "HEAD UP, NECK STRAIGHT, NO STRAIN, NO FLUID OVERLOAD, SUCTION 10 SEC MAX.", "source": "CD_ICP_HA s11; AHN Ch 14 p 676 patient problems", "flag": null}, {"id": "W4_012", "topic": "Increased ICP", "difficulty": "Difficult", "type": "mc", "case": "W4_CASE1", "adpie": "Assessment", "answer": [1], "r1": {"stem": "At 0400, Mr. Pumpernickel's BP is 186/70 (it was 138/82), his pulse is 48 (it was 84), and his breathing is irregular with pauses. How should the nurse interpret these findings?", "options": ["Hypovolemic shock from his poor appetite", "Cushing triad, a LATE sign that herniation may be near", "An early, expected response to his tumor", "Pain from his headache that will improve with acetaminophen"]}, "r2": {"stem": "Mr. Pumpernickel's systolic BP has climbed, his pulse pressure has widened, his heart rate is 48, and his respirations are irregular. What do these changes mean?", "options": ["Shock from dehydration", "Cushing response, a late sign of impending brain herniation", "Early compensation that is no cause for concern", "A pain response that will settle after analgesia"]}, "r3": {"stem": "As the LVN, you find a BP of 186/70, a pulse of 48, and irregular respirations in Mr. Pumpernickel. What is your priority action?", "options": ["Raise his legs and push fluids for shock", "Notify the RN immediately, since this is Cushing triad, a late ICP sign", "Recheck the vital signs in 4 hours, since early changes are expected", "Give PRN acetaminophen for pain and reassess later"]}, "rationale": "Rising systolic BP with a widening pulse pressure, bradycardia, and irregular respirations is Cushing triad. It is a LATE sign: the brainstem is being compressed and herniation may be imminent, so report it immediately. ICP signs are the OPPOSITE of shock, where BP drops and pulse and respirations rise. This is not an early or expected change, and pain does not slow the heart to 48.", "hook": "ICP is the opposite of shock: BP up, pulse down, breathing off.", "source": "CD_ICP_HA s5 to 7 (ICP vs shock card); AHN Ch 14 p 674", "flag": "N13: the professor deck text says Cushing triad respirations are irregular, but the ICP vs shock image card says decreased. Textbook says irregular. Both describe late ICP; pick irregular if asked."}, {"id": "W4_013", "topic": "Increased ICP", "difficulty": "Intermediate", "type": "mc", "case": "W4_CASE1", "adpie": "Planning", "answer": [1], "r1": {"stem": "The provider orders IV mannitol (Osmitrol) for Mr. Pumpernickel. Which statement about this drug is correct?", "options": ["It is a corticosteroid and the first choice standard therapy for all brain swelling", "It is an osmotic diuretic that pulls water out of swollen brain tissue, acting within about 15 minutes", "It prevents seizures by stabilizing nerve cell membranes", "It should be given IM because IV mannitol lowers ICP too fast"]}, "r2": {"stem": "Mannitol is ordered to lower intracranial pressure. How does it work?", "options": ["As a steroid that is now the standard treatment for cerebral edema", "As a hyperosmolar diuretic drawing fluid out of edematous brain tissue, with onset in about 15 minutes", "As an anticonvulsant that keeps seizures from raising ICP", "As an IM shot preferred over IV to avoid rapid drops in pressure"]}, "r3": {"stem": "As the LVN caring for Mr. Pumpernickel after the RN starts IV mannitol, which monitoring is most related to how this drug works?", "options": ["Watch his blood glucose, since mannitol is a steroid", "Track his urine output closely, since this osmotic diuretic pulls fluid off the brain and kicks in within about 15 minutes", "Watch for gum overgrowth, since mannitol is an anticonvulsant", "Check the IM injection site for bruising"]}, "rationale": "Mannitol is an osmotic diuretic: it is hyperosmolar and draws water out of swollen brain tissue into the blood so the kidneys can excrete it. It works within about 15 minutes and lasts 5 to 6 hours, so expect a large urine output (a Foley is used if the patient is not alert). Phenytoin is the anticonvulsant used in ICP, given IV, not IM. Dexamethasone is listed in the professor's deck, but the textbook says corticosteroids are no longer standard for ICP.", "hook": "Mannitol: 'Man, it pulls water.' On in 15 minutes, lasts 5 to 6 hours.", "source": "CD_ICP_HA s8; AHN Ch 14 p 676 (study notes p 11 to 12); key_exam_numbers", "flag": "N2: both professor decks list dexamethasone for cerebral edema, but the textbook ICP section says corticosteroids are NO LONGER STANDARD (higher mortality). Hold for professor; on the exam, mannitol is the safe ICP drug answer."}, {"id": "W4_014", "topic": "Headache and Neuropathic Pain", "difficulty": "Intermediate", "type": "sata", "case": null, "adpie": "Implementation", "answer": [0, 1, 2, 4], "r1": {"stem": "Ms. Clementine Haversack, a food truck owner famous for her 'Everything Pickled' sandwich, has migraines with a visual aura. Which teaching points are correct? Select all that apply.", "options": ["Keep a food and headache diary to find your triggers", "Limit aged cheese, cured meats, hot dogs, and foods with MSG", "Lie down in a dark, quiet room when a migraine starts", "Take OTC ibuprofen every day to stop migraines before they start", "A triptan such as sumatriptan (Imitrex) may be used for a moderate to severe attack", "Fermented and marinated foods are safe migraine snacks"]}, "r2": {"stem": "Which instructions belong in migraine teaching? Select all that apply.", "options": ["Track foods and headaches in a journal to spot triggers", "Cut back on aged cheese, cured meats, hot dogs, and MSG", "Rest in a dark, quiet room at the onset", "Use OTC ibuprofen daily as prevention", "Use a triptan like sumatriptan for a moderate to severe migraine", "Pickled and marinated foods do not trigger migraines"]}, "r3": {"stem": "As the LVN reinforcing the RN's migraine teaching, which statements by Ms. Haversack show correct understanding? Select all that apply.", "options": ["'I will write down what I eat and when my headaches hit.'", "'I'll go easy on aged cheddar, salami, hot dogs, and MSG.'", "'When the aura starts, I'll lie down in a dark, quiet room.'", "'I'll take ibuprofen every single day so the migraines never start.'", "'For a bad attack, I can use my sumatriptan.'", "'My pickled and marinated menu is fine for my migraines.'"]}, "rationale": "Migraine triggers include tyramine (aged cheese, cured meats, sauerkraut, soy), nitrites (hot dogs), MSG, caffeine, alcohol, and fermented or marinated foods, so a food diary helps. During an attack, a dark, quiet room helps. Triptans constrict dilated cranial vessels and are first line for moderate to severe migraine. Using OTC analgesics more than 3 days per week causes REBOUND headaches, so daily ibuprofen is not a prevention plan.", "hook": "OTC pain pills more than 3 days a week = rebound headache.", "source": "CD_ICP_HA s13 to 14, s16; AHN Ch 14 p 670 to 672; Cooper TB idea AHN14_SATA01", "flag": null}, {"id": "W4_015", "topic": "Headache and Neuropathic Pain", "difficulty": "Intermediate", "type": "mc", "case": null, "adpie": "Implementation", "answer": [0], "r1": {"stem": "Mr. Rufus Bellweather, a hot air balloon pilot, gets sudden, burning headaches behind one eye at the same time each night, with a watery eye and a stuffy nose. Which teaching point is most important for him?", "options": ["Avoid alcohol, since it is a major trigger for this type of headache", "Avoid chocolate and yogurt, since they cause this type of headache", "Apply moist heat to the back of the neck, which cures these attacks", "Request a lumbar puncture with every attack to relieve the pressure"]}, "r2": {"stem": "A patient has one sided, burning headaches that strike at the same time daily, with a stuffy nose and a watery eye. Which teaching is the priority?", "options": ["Alcohol is a significant trigger, so avoid it", "Chocolate and yogurt are the main cause of these headaches", "Warm packs to the neck will stop the attacks", "A spinal tap during each attack will relieve them"]}, "r3": {"stem": "As the LVN reinforcing teaching for a man with cluster headaches who flies hot air balloons at high altitude, which statement shows he understood?", "options": ["'I'll skip the beer, since alcohol can set off my cluster attacks.'", "'Cutting out chocolate will stop these headaches.'", "'Heat packs on my neck will cure each attack.'", "'I'll ask for a spinal tap whenever one starts.'"]}, "rationale": "This is a cluster headache: one sided, burning, sudden, at the same time of day, with tearing and nasal stuffiness, and more common in men. Alcohol is a significant trigger, along with exertion, heat, and high altitude. Chocolate and yogurt are classic MIGRAINE triggers, and neck heat is a tension headache comfort measure. A lumbar puncture is not a headache treatment. Source treatments are opioids, sumatriptan, and prednisone, and ergotamine before a flight may prevent altitude attacks.", "hook": "Cluster = same time, same side, mostly guys, and no booze.", "source": "CD_ICP_HA s15; AHN Ch 14 p 671 to 672; EAQ14_01 idea", "flag": "N18: neither source lists 100% oxygen by nonrebreather, which is standard first line for an acute cluster headache, and opioids are generally not recommended. Exam answer per sources: opioids, sumatriptan, prednisone; ask professor."}, {"id": "W4_016", "topic": "Headache and Neuropathic Pain", "difficulty": "Basic", "type": "mc", "case": null, "adpie": "Planning", "answer": [0], "r1": {"stem": "Mrs. Edna Marbleworth, a champion quilter, has diabetic neuropathy with burning, tingling pain in both feet. Which medication would the nurse expect for this type of pain?", "options": ["Gabapentin (Neurontin)", "Sumatriptan (Imitrex)", "Mannitol (Osmitrol)", "Pyridostigmine (Mestinon)"]}, "r2": {"stem": "Which drug is commonly ordered for burning, tingling nerve pain from diabetic neuropathy?", "options": ["The anticonvulsant gabapentin", "The triptan sumatriptan", "The osmotic diuretic mannitol", "The cholinesterase inhibitor pyridostigmine"]}, "r3": {"stem": "As the LVN reviewing the MAR for a patient with burning neuropathic foot pain, which order fits the source treatment so you can reinforce teaching about it?", "options": ["Gabapentin by mouth", "Sumatriptan at the onset of pain", "IV mannitol every 6 hours", "Pyridostigmine before meals"]}, "rationale": "Neuropathic pain is burning or tingling pain from damaged nerve tissue, as in diabetic neuropathy, postherpetic neuralgia, and phantom limb pain. Source medications include gabapentin, carbamazepine, antidepressants, and nonopioid analgesics; opioids are not first line. Other options include nerve block, TENS, and spinal cord stimulation. Sumatriptan treats migraine, mannitol lowers ICP, and pyridostigmine treats myasthenia gravis.", "hook": "Burning nerves? Think gabapentin.", "source": "CD_ICP_HA s17 to 18; AHN Ch 14 p 672 (study notes p 10 to 11)", "flag": null}, {"id": "W4_017", "topic": "Seizures", "difficulty": "Basic", "type": "sata", "case": null, "adpie": "Implementation", "answer": [0, 1, 2, 5], "r1": {"stem": "Mr. Barnaby Quill, a competitive yo yo champion, has a generalized tonic clonic seizure in the hallway. Which actions should the nurse take? Select all that apply.", "options": ["Ease him to the floor and protect his head", "Turn him on his side as soon as possible so secretions drain", "Loosen his collar and tie", "Place a padded tongue blade between his teeth", "Hold his arms down to stop the jerking", "Note the time it started and how long each phase lasts"]}, "r2": {"stem": "During a generalized tonic clonic seizure, which interventions are correct? Select all that apply.", "options": ["Lower him to the floor and cushion his head", "Position him side lying to prevent aspiration", "Loosen anything tight around the neck", "Insert a padded bite stick into his mouth", "Restrain his arms to limit movement", "Time the seizure and each phase"]}, "r3": {"stem": "As the LVN first on the scene of a tonic clonic seizure, which actions are within your scope? Select all that apply.", "options": ["Guide him down to the floor and pad under his head", "Turn him to his side to keep the airway clear", "Unbutton his tight collar", "Pry his jaw open to protect his tongue", "Have staff pin his arms and legs down", "Stay with him and record the start time, length, and what happened before"]}, "rationale": "The goals during a seizure are to prevent aspiration and injury and to observe and record. Lower the patient to the floor, protect the head, turn to the side, loosen clothing at the neck, and never leave him alone. Do NOT restrain him and do NOT pry the jaw or put anything in the mouth, since this causes injury. Record what came before, the time, and the length of each phase, because diagnosis often rests on that description.", "hook": "Floor, side, loosen, time. Nothing in the mouth, no holding down.", "source": "AHN Ch 14 p 683 (study notes p 15 to 16)", "flag": null}, {"id": "W4_018", "topic": "Seizures", "difficulty": "Difficult", "type": "mc", "case": null, "adpie": "Assessment", "answer": [1], "r1": {"stem": "Mr. Archibald Fennel, a weekend polka accordionist, is brought in having one generalized seizure after another without waking up between them. Which history is the MOST likely cause?", "options": ["He ate a large, high fat dinner", "He suddenly stopped taking his anticonvulsant last week", "He had a cluster headache yesterday", "He has been taking his phenytoin exactly on time"]}, "r2": {"stem": "A patient has repeated generalized seizures and does not regain consciousness between them. What is the most common cause of this emergency?", "options": ["A heavy, greasy meal", "Abrupt withdrawal of anticonvulsant medication", "A recent cluster headache", "Taking anti seizure medication on schedule"]}, "r3": {"stem": "As the LVN, you find a patient seizing repeatedly without waking in between. While the RN manages the emergency, which history do you gather and report as the most likely cause?", "options": ["What he ate for dinner", "Whether he stopped his anticonvulsant suddenly", "Whether he had a headache yesterday", "Whether he took his phenytoin on time"]}, "rationale": "Repeated generalized seizures without regaining consciousness is STATUS EPILEPTICUS, a medical emergency. The brain uses more energy than can be supplied, neurons exhaust, and permanent damage or death can follow. The most common cause is SUDDEN WITHDRAWAL of anticonvulsants. Care includes airway, injury protection, high dose drugs such as IV diazepam or fosphenytoin, an IV line, a Foley, and intubation if needed. Meals, headaches, and on time doses do not cause it.", "hook": "Stop meds suddenly, seizures start nonstop.", "source": "AHN Ch 14 p 680 to 682; Table 14.6 (diazepam, fosphenytoin for status); key_exam_numbers", "flag": null}, {"id": "W4_019", "topic": "Seizures", "difficulty": "Intermediate", "type": "mc", "case": null, "adpie": "Evaluation", "answer": [2], "r1": {"stem": "Ms. Ophelia Bramblewood, a substitute music teacher, is going home on phenytoin (Dilantin). Which statement shows she needs MORE teaching?", "options": ["'I'll brush and floss carefully, since this drug can make my gums overgrow.'", "'I won't drink alcohol while I'm on this medication.'", "'Once I go a month without a seizure, I can stop taking it.'", "'Wearing a medical alert bracelet is a good idea for me.'"]}, "r2": {"stem": "Which statement by a patient on phenytoin means the teaching did not work?", "options": ["'Good oral hygiene matters because my gums could thicken.'", "'Alcohol is off limits with my seizure medicine.'", "'After 30 seizure free days, I'll quit the pills.'", "'A medical ID bracelet would be smart to wear.'"]}, "r3": {"stem": "As the LVN reinforcing discharge teaching, which statement do you report to the RN as a need for more teaching?", "options": ["'I'll keep up with dental care because of my gums.'", "'I'm skipping the wine at book club from now on.'", "'If I'm seizure free for a month, I'll just stop the Dilantin.'", "'I'm going to wear my medical alert bracelet.'"]}, "rationale": "Anticonvulsants must be taken even when seizures stop; stopping suddenly can cause status epilepticus, so only the provider changes the dose. Phenytoin causes gum overgrowth (gingival hyperplasia), so good oral hygiene is correct teaching. Alcohol interferes with seizure control and should be avoided. Wearing a medical alert ID is appropriate. Also teach no driving, machinery, or swimming until seizures are controlled.", "hook": "Seizure meds: no skipping, no stopping, no sipping.", "source": "AHN Ch 14 p 682 to 683; Table 14.6; EAQ14_14 idea", "flag": "N24: textbook p 682 says the patient SHOULD wear a medical alert bracelet, but the Patient Teaching box on the same page calls it OPTIONAL; EAQ14_14 treats wearing it as correct. Exam answer: wearing one is appropriate teaching; it is the patient's choice."}, {"id": "W4_020", "topic": "Seizures", "difficulty": "Basic", "type": "mc", "case": null, "adpie": "Assessment", "answer": [1], "r1": {"stem": "Theo, 17, a competitive speedrun gamer, 'zones out' with a blank stare for a few seconds several times a day, then goes right back to his game with no confusion. Which seizure type does this describe?", "options": ["Generalized tonic clonic (grand mal)", "Absence (petit mal)", "Jacksonian focal", "Akinetic"]}, "r2": {"stem": "A teenager has brief episodes of a vacant stare lasting a few seconds, with no warning and no confusion afterward. What type of seizure is this?", "options": ["Grand mal, with stiffening and jerking", "Petit mal, also called absence", "Focal Jacksonian, starting in one hand", "Akinetic, with going limp and falling"]}, "r3": {"stem": "As the LVN collecting data on Theo, which detail about his staring spells best supports absence seizures in your report to the RN?", "options": ["He cries out, falls, jerks, then sleeps for 2 hours", "Spells last a few seconds with no aura and no postictal confusion", "Numbness starts in one hand and spreads up the arm", "He suddenly goes limp, falls, and is out for 1 to 2 minutes"]}, "rationale": "Absence (petit mal) seizures cause a vacant stare for a few seconds, with motor activity stopping except perhaps eyelid twitching. There is no aura and no postictal period, and they occur mostly in childhood and adolescence. Tonic clonic seizures have an aura, a cry, a fall, jerking, and a sleepy postictal phase. Jacksonian seizures start with numbness or tingling in a hand, foot, or face, and akinetic seizures cause a limp fall with 1 to 2 minutes of unconsciousness. EEG is the most common test to diagnose the seizure type.", "hook": "Absence = absent for a few seconds, then back like nothing happened.", "source": "AHN Ch 14 Table 14.5, p 681 to 682", "flag": null}, {"id": "W4_021", "topic": "Stroke and TIA", "difficulty": "Intermediate", "type": "mc", "case": "W4_CASE2", "adpie": "Planning", "answer": [0], "r1": {"stem": "Mrs. Featherstone arrives at 8:05 am, about an hour after her symptoms started. The team is considering alteplase (tPA). What must happen FIRST?", "options": ["A CT scan to rule out a hemorrhagic stroke", "Start heparin and aspirin right away", "Wait 24 hours to see whether this is just a TIA", "Give her water to check her swallow so she can take her pills"]}, "r2": {"stem": "Before tPA is given to a stroke patient who is still within the time window, what is the priority step?", "options": ["CT to confirm there is no bleeding in the brain", "Begin anticoagulant and antiplatelet drugs immediately", "Observe for a full day in case symptoms resolve", "Offer sips of water to see if she can swallow tablets"]}, "r3": {"stem": "As the LVN helping the stroke team with Mrs. Featherstone, which action fits your role and the treatment priority?", "options": ["Get her ready for transport to CT right away, since a bleed must be ruled out before tPA", "Prepare to give heparin and aspirin now", "Tell the family there is no rush because symptoms may resolve within 24 hours", "Give her a cup of water so she can take her home meds"]}, "rationale": "tPA (alteplase) dissolves clots and works best within 3 hours of symptom onset (some patients up to 4.5 hours), so timing is the most important factor. A CT must be done FIRST to rule out a hemorrhagic stroke, because a clot buster in a bleeding brain is deadly. Anticoagulants and antiplatelets are held for the first 24 hours after tPA. Waiting a day wastes the window, and nothing goes by mouth until her swallow is screened.", "hook": "Time is brain: CT first, tPA by 3 hours (some up to 4.5).", "source": "AHN Ch 14 p 701 to 702 (study notes p 24 to 25); key_exam_numbers", "flag": null}, {"id": "W4_022", "topic": "Stroke and TIA", "difficulty": "Difficult", "type": "sata", "case": "W4_CASE2", "adpie": "Assessment", "answer": [0, 1, 2, 5], "r1": {"stem": "Mrs. Featherstone's CT shows a LEFT hemisphere ischemic stroke. Which findings would the nurse expect? Select all that apply.", "options": ["Right sided weakness or paralysis (right hemiplegia)", "Aphasia", "Slow, cautious behavior", "Neglect of the left side of her body", "Impulsive behavior while denying any problem", "Awareness of her deficits, with depression or anxiety"]}, "r2": {"stem": "Which deficits fit a stroke in the left cerebral hemisphere? Select all that apply.", "options": ["Paralysis of the right side", "Language problems", "Moves slowly and carefully", "Ignores the left side of the body", "Acts impulsively and insists nothing is wrong", "Knows about her deficits and feels anxious or down"]}, "r3": {"stem": "As the LVN collecting data on Mrs. Featherstone, which findings fit her left brain stroke and should be reported? Select all that apply.", "options": ["Weak right arm and leg", "Trouble getting her words out", "Careful, slow movements", "Not noticing food on the left side of her tray", "Trying to get up alone while saying she is fine", "Tearful, saying 'I know I can't do what I used to'"]}, "rationale": "The left hemisphere controls the right side of the body and, in right handed people, language. A left brain stroke causes right hemiplegia, aphasia, trouble telling right from left, and slow, cautious behavior, and the patient is usually aware of deficits, which leads to depression and anxiety. Left side neglect, impulsiveness, poor judgment, and denying problems point to a RIGHT brain stroke. Ischemic strokes make up about 87% of strokes.", "hook": "Left brain = Language and Lingering (slow, cautious). Right brain = Reckless (impulsive).", "source": "AHN Ch 14 p 698 to 701 (right vs left table, study notes p 24)", "flag": "N21: the textbook gives the ischemic share as 87% (p 698) and 'nearly 90%' (p 699). Use 87%."}, {"id": "W4_023", "topic": "Stroke and TIA", "difficulty": "Intermediate", "type": "mc", "case": "W4_CASE2", "adpie": "Implementation", "answer": [1], "r1": {"stem": "After her CT and tPA, Mrs. Featherstone has a speech therapy approved soft diet with thickened liquids. She has right sided weakness. Which feeding action is correct?", "options": ["Give thin liquids through a straw so she can control the flow", "Sit her upright at 90 degrees, tuck her chin, and tip her head toward her stronger left side", "Have her wash down each bite with a sip of liquid", "Offer a milkshake to boost her calories"]}, "r2": {"stem": "Which technique is safest when feeding a patient with right hemiplegia and dysphagia?", "options": ["Offer thin liquids through a straw", "Seat her at 90 degrees with chin tucked and head tilted toward the unaffected left side", "Alternate every bite with a drink to help food go down", "Give a milkshake for extra calories"]}, "r3": {"stem": "As the LVN feeding Mrs. Featherstone, which action is within your scope and best prevents aspiration?", "options": ["Hand her a straw so she can sip thin juice on her own", "Position her upright at 90 degrees, chin tucked, head tipped toward her left side, then check her right cheek for pocketed food", "Mix liquids and solids in each spoonful so food slides down easier", "Bring her a chocolate milkshake from the cafeteria as a treat"]}, "rationale": "Sit the patient at 90 degrees with the chin tucked, and tip the head toward the UNAFFECTED side (her left), per the textbook. Thicken liquids, give small bites, keep dentures in, and check the affected cheek for pocketed food. Do not use straws, do not mix liquids and solids, and avoid thin liquids. Milk products thicken mucus and increase saliva, so skip the milkshake. Soft foods are best, except mashed potatoes.", "hook": "Up at 90, chin tucked, no straws, no milk, check the cheek.", "source": "AHN Ch 14 p 678, p 703 dysphagia box; Cooper TB idea AHN14_MC09", "flag": "Cooper textbook (p 678 and its own NCLEX review question 5) teaches tipping the head toward the UNAFFECTED side. Many other references teach turning the head toward the WEAK side. Use the textbook answer on this course's exams; ask professor."}, {"id": "W4_024", "topic": "Stroke and TIA", "difficulty": "Basic", "type": "mc", "case": "W4_CASE2", "adpie": "Implementation", "answer": [2], "r1": {"stem": "Mrs. Featherstone understands what you say but struggles to get her words out and gets frustrated. Which communication approach is best?", "options": ["Finish her sentences for her so she does not get frustrated", "Speak loudly and slowly, since aphasia means she cannot hear well", "Be unhurried, ask yes or no questions, and offer a communication board", "Talk to her family instead, since she can no longer make decisions"]}, "r2": {"stem": "For a patient with expressive aphasia who understands but cannot form words, which approach helps most?", "options": ["Complete her sentences to save her the frustration", "Raise your voice and slow way down", "Give her time, use yes or no questions, and provide a picture or letter board", "Direct all questions to the family since she lacks cognition"]}, "r3": {"stem": "As the LVN caring for Mrs. Featherstone, which action best supports her communication?", "options": ["Jump in with the word you think she wants", "Speak loudly so she can understand you", "Wait patiently, ask simple yes or no questions, and hand her the communication board", "Ask her daughter to answer for her about her pain"]}, "rationale": "With expressive aphasia, the patient understands but cannot form words, so give her time, do not prompt or finish her sentences, ask yes or no questions, and use a communication board. Inability to speak does NOT mean decreased cognition, so talk with her as an adult, not around her. Aphasia is a language problem, not a hearing problem, so a louder voice does not help.", "hook": "Wait, yes or no, board. Never finish her sentence.", "source": "AHN Ch 14 p 703 to 704; MOD3_AP s52", "flag": null}, {"id": "W4_025", "topic": "Stroke and TIA", "difficulty": "Intermediate", "type": "mc", "case": null, "adpie": "Evaluation", "answer": [1], "r1": {"stem": "Mr. Percival Gumm, a tuba player, had 20 minutes of left arm numbness and blurred speech that went away completely. He is diagnosed with a TIA. Which statement shows he understands his diagnosis?", "options": ["'Since it went away, I never need to worry about it again.'", "'A TIA is a warning sign that raises my stroke risk, so I'll take my aspirin and keep my follow up.'", "'A TIA lasts at least 48 hours, so mine was something else.'", "'A TIA is a small brain bleed, so aspirin is dangerous for me.'"]}, "r2": {"stem": "Which statement by a patient after a transient ischemic attack shows correct understanding?", "options": ["'It cleared up, so there is nothing to follow up on.'", "'This was a warning; my stroke risk is up, so I'll take my antiplatelet and keep my appointments.'", "'A TIA has to last more than 2 days, so this wasn't one.'", "'A TIA means bleeding in the brain, so I must avoid aspirin.'"]}, "r3": {"stem": "As the LVN reinforcing the RN's TIA teaching, which statement by Mr. Gumm shows the teaching worked?", "options": ["'I'm cured now, so I can cancel my carotid ultrasound.'", "'This was my warning shot; I'll take aspirin daily and keep my carotid follow up.'", "'TIAs last longer than 48 hours, so I just had a cramp.'", "'It was a tiny bleed, so I'll stop my aspirin.'"]}, "rationale": "A TIA is a brief episode of brain ischemia that lasts less than 24 hours (often under 15 minutes) and leaves no lasting deficit. It is a warning: about 40% of people with TIAs have a stroke within 2 to 5 years. Carotid stenosis causes most TIAs, so a carotid duplex often follows, and carotid endarterectomy is best with 70% or more stenosis. Treatment includes antiplatelets like aspirin (warfarin for A fib). A TIA is ischemic, not a bleed.", "hook": "TIA = Take It Alarmingly: under 24 hours, 40% stroke within 2 to 5 years.", "source": "AHN Ch 14 p 700; key_exam_numbers; textbook review Q1", "flag": null}, {"id": "W4_026", "topic": "Multiple Sclerosis", "difficulty": "Difficult", "type": "sata", "case": null, "adpie": "Assessment", "answer": [0, 1, 4], "r1": {"stem": "Ms. Daphne Pennywhistle, 32, a lighthouse photographer, has double vision, a blind spot, slurred speech, and bladder urgency that come and go. Which findings would support a diagnosis of multiple sclerosis? Select all that apply.", "options": ["Multiple plaques on MRI of the brain and spinal cord", "Elevated gamma globulin in the CSF", "Low CSF glucose", "Blood in the CSF", "New lesions appearing over time on repeat MRI", "A single positive blood test that confirms MS"]}, "r2": {"stem": "Which test results point toward multiple sclerosis? Select all that apply.", "options": ["Several sclerotic plaques seen on MRI", "Raised gamma globulin in the cerebrospinal fluid", "Decreased glucose in the cerebrospinal fluid", "Red blood cells in the spinal fluid", "Additional lesions on follow up MRI scans", "One definitive blood test that is positive for MS"]}, "r3": {"stem": "As the LVN reviewing results with the RN for Ms. Pennywhistle, which findings fit MS? Select all that apply.", "options": ["MRI report: multiple demyelinating plaques", "CSF report: gamma globulin elevated", "CSF report: glucose low", "CSF report: blood present", "Repeat MRI 6 months later: new plaques", "Lab report: MS specific blood test positive"]}, "rationale": "There is no single definitive test for MS. Diagnosis rests on the history plus multiple lesions over time on MRI (it detects plaques as small as 3 to 4 mm) and elevated gamma globulin in the CSF. Low CSF glucose suggests a bacterial or fungal infection like meningitis, and blood in the CSF suggests hemorrhage. High CSF protein points to degenerative disease or tumor.", "hook": "MS = Many Scars on MRI, showing up over time.", "source": "AHN Ch 14 p 685; MOD3_AP s58; EAQ14_07 (missed item idea)", "flag": null}, {"id": "W4_027", "topic": "Multiple Sclerosis", "difficulty": "Basic", "type": "mc", "case": null, "adpie": "Implementation", "answer": [1], "r1": {"stem": "Mr. Clyde Wigglesworth has relapsing remitting MS and plans to celebrate his birthday with a long soak in a 104 degree hot tub. Which teaching should the nurse give?", "options": ["Hot tubs are great, since heat strengthens weak muscles", "Avoid hot baths and hot tubs, since heat increases weakness", "Exercise hard until exhausted to build stamina", "Limit fluids to under 1000 mL a day to avoid bladder accidents"]}, "r2": {"stem": "Which instruction is correct for a patient with multiple sclerosis?", "options": ["Soak in hot water to build muscle strength", "Stay away from hot baths because heat worsens weakness", "Push exercise to the point of exhaustion", "Keep fluids under 1 L daily to reduce incontinence"]}, "r3": {"stem": "As the LVN reinforcing MS teaching, which statement by Mr. Wigglesworth shows he understood?", "options": ["'A long hot soak will make my legs stronger.'", "'I'll skip the hot tub and plan outings for the cool part of the day.'", "'I'll work out until I drop so I don't lose strength.'", "'I'll drink as little as possible so I don't have accidents.'"]}, "rationale": "Heat increases MS weakness, so avoid hot baths and plan travel and activity for the coolest part of the day. Exercise is encouraged, but not to the point of fatigue, and bed rest is used during an acute exacerbation. Fluids should be at least 2000 mL a day because UTIs are a major problem. Fatigue, chilling, and emotional stress can trigger exacerbations.", "hook": "MS plus heat = weak. Keep it cool, keep fluids at 2 liters.", "source": "AHN Ch 14 p 686; EAQ14_03 idea", "flag": null}, {"id": "W4_028", "topic": "Multiple Sclerosis", "difficulty": "Difficult", "type": "sata", "case": null, "adpie": "Implementation", "answer": [0, 1, 2], "r1": {"stem": "Mrs. Henrietta Spoon has MS with leg spasticity and a seizure disorder. She is started on oral baclofen. Which nursing actions are appropriate? Select all that apply.", "options": ["Give the oral dose with meals or milk to reduce GI upset", "Watch for an increase in her seizures", "Teach her to avoid driving until she knows how drowsy it makes her", "Give an antacid within 1 hour of the dose to boost absorption", "Teach her that dry mouth from this drug is best treated with ice chips"]}, "r2": {"stem": "Which interventions support safe baclofen therapy in a patient with MS and epilepsy? Select all that apply.", "options": ["Administer oral baclofen with food or milk", "Monitor for more frequent seizures", "Advise avoiding tasks that need alertness until the drowsiness effect is known", "Pair each dose with an antacid within the hour", "Explain that ice chips manage this drug's dry mouth"]}, "r3": {"stem": "As the LVN giving oral baclofen to Mrs. Spoon, which actions are within your scope? Select all that apply.", "options": ["Give it with her lunch tray or a glass of milk", "Watch for and report any increase in seizure activity to the RN", "Reinforce that she should not drive until she knows how sleepy it makes her", "Give her antacid at the same time to help the drug absorb", "Reinforce that baclofen dry mouth is managed with hard candy and ice chips"]}, "rationale": "Baclofen reduces spasticity from MS or spinal cord injury. Give the oral form with meals or milk to prevent GI distress, and watch for MORE seizures in patients with epilepsy. It causes drowsiness and dizziness, so avoid activities that need alertness until the effects are known. The dry mouth care and the 1 hour antacid rule belong to trihexyphenidyl, not baclofen.", "hook": "Baclofen: with food, watch for fits, no drowsy driving.", "source": "AHN Ch 14 Table 14.7 p 690 to 691; EAQ14_08 and EAQ14_10 (missed item idea)", "flag": null}, {"id": "W4_029", "topic": "Parkinson Disease", "difficulty": "Basic", "type": "sata", "case": null, "adpie": "Assessment", "answer": [0, 1, 2, 3], "r1": {"stem": "Mr. Ambrose Tuttle, 70, a retired jazz drummer, has Parkinson disease. Which findings would the nurse expect? Select all that apply.", "options": ["Pill rolling tremor of the hand at rest", "Cogwheel rigidity", "Masked, expressionless face and drooling", "Shuffling gait with decreased arm swing", "Nystagmus", "Constant writhing, twisting movements (chorea)"]}, "r2": {"stem": "Which assessment findings are typical of Parkinson disease? Select all that apply.", "options": ["Resting tremor with a pill rolling motion", "Ratchet like stiffness when a limb is moved", "Flat facial expression with drooling", "Short shuffling steps and reduced arm swing", "Involuntary rhythmic eye movements", "Uncontrolled writhing and twisting"]}, "r3": {"stem": "As the LVN collecting data on Mr. Tuttle, which findings are consistent with Parkinson disease and should be documented? Select all that apply.", "options": ["His hand trembles while it rests in his lap but stops when he picks up a cup", "His elbow moves in small catches when you bend it", "He has little facial expression and drools", "He shuffles with small steps and his arms barely swing", "His eyes jerk side to side", "He has constant dance like twisting of his arms and trunk"]}, "rationale": "Parkinson disease comes from loss of dopamine in the substantia nigra. The triad is tremor, rigidity, and bradykinesia: a resting pill rolling tremor that stops with movement, cogwheel rigidity, and slowness that shows up as a masked face, drooling, a shuffling gait with less arm swing, a soft voice, and tiny handwriting. Nystagmus is seen in MS, and chorea is the hallmark of Huntington disease, which has EXCESS dopamine.", "hook": "Parkinson triad TRB: Tremor at rest, Rigidity (cogwheel), Bradykinesia. Need 2 of 3.", "source": "AHN Ch 14 p 687 to 688; MOD3_AP s12 to 17 (dopamine); EAQ14_02 idea", "flag": null}, {"id": "W4_030", "topic": "Parkinson Disease", "difficulty": "Intermediate", "type": "mc", "case": null, "adpie": "Implementation", "answer": [0], "r1": {"stem": "Mr. Tuttle starts carbidopa levodopa. Which instruction BEST reduces his risk of falling from this drug?", "options": ["'Change positions slowly and dangle your legs before standing.'", "'Expect your urine to turn darker.'", "'It may take months to see the full effect.'", "'Double the next dose if you miss one.'"]}, "r2": {"stem": "To prevent falls related to carbidopa levodopa, which teaching is most important?", "options": ["Rise slowly and sit on the edge of the bed first", "Darker urine is a harmless effect", "Full benefit may take several months", "Make up a missed dose by taking two"]}, "r3": {"stem": "As the LVN reinforcing teaching on carbidopa levodopa, which point most directly protects Mr. Tuttle from a fall?", "options": ["Get up slowly and sit at the bedside before standing, since this drug can drop your BP", "Your urine may look darker, and that is okay", "You may not see full results for months", "If you miss a dose, take two next time"]}, "rationale": "Carbidopa levodopa can cause orthostatic hypotension and dizziness, so changing positions slowly and dangling the legs prevents falls. It is given with food, may darken urine, and can take months for full effect; those points are true but do not prevent falls. Never double a dose, and keep doses on schedule to limit 'off times.' Carbidopa protects levodopa so more reaches the brain and reduces nausea.", "hook": "Levodopa: rise slow, or down you go.", "source": "AHN Ch 14 Table 14.7 p 690 to 691; EAQ14_13 idea", "flag": null}, {"id": "W4_031", "topic": "Parkinson Disease", "difficulty": "Difficult", "type": "mc", "case": null, "adpie": "Planning", "answer": [1], "r1": {"stem": "Mr. Tuttle has lost weight, coughs and chokes during meals, and is constipated. Which meal plan is best?", "options": ["Three large high protein meals timed with his levodopa doses", "Six small meals cut into bite sized pieces, with high fiber foods and plenty of fluids", "Thin liquids through a straw to make swallowing easier", "Limit fluids to reduce drooling"]}, "r2": {"stem": "Which diet plan best prevents malnutrition, choking, and constipation in a patient with Parkinson disease?", "options": ["Three big, protein heavy meals taken with his levodopa", "Six small meals in bite sized pieces with whole grains, fruit, and adequate fluids", "Thin drinks through a straw for easier swallowing", "Cut back on fluids so he drools less"]}, "r3": {"stem": "As the LVN helping the RN and dietitian plan Mr. Tuttle's meals, which plan do you support?", "options": ["Big steak dinners right when his levodopa is due", "Small, frequent meals cut small, with fiber and fluids, eaten sitting at 90 degrees", "Thin juices with a bendy straw", "Hold water at meals so he drools less"]}, "rationale": "Parkinson patients struggle to chew and swallow and have slowed GI movement, so six small meals of bite sized food with high fiber and fluids prevent malnutrition and constipation. Sit at 90 degrees with the chin tucked, use soft solids and thick liquids, and no straws. Large high protein meals taken with levodopa are a problem because protein competes with levodopa absorption. Fluid restriction would worsen constipation.", "hook": "Small, often, fiber, fluids. Don't pile protein on the levodopa.", "source": "AHN Ch 14 p 692; EAQ14_09 (missed item idea)", "flag": "N20 and E1: textbook p 692 says the greatest intake should be PROTEINS, fruits, and vegetables, but EAQ14_09 marks high protein WRONG because protein interferes with levodopa absorption. Ask professor; on NCLEX style items, avoid high protein with levodopa."}, {"id": "W4_032", "topic": "Parkinson Disease", "difficulty": "Basic", "type": "mc", "case": null, "adpie": "Implementation", "answer": [1], "r1": {"stem": "While walking to the bathroom, Mr. Tuttle suddenly 'freezes' in the doorway and cannot move his feet. What should the nurse do?", "options": ["Pull him forward by the arm to get him moving", "Tell him to rock side to side or step over a line on the floor", "Hurry him along so he does not get tired", "Switch him to a wheelchair and stop all walking"]}, "r2": {"stem": "A patient with Parkinson disease freezes in place in the middle of a walk. Which action helps?", "options": ["Tug him forward by his arm", "Cue him to rock his weight side to side or step over a tape line", "Rush him so he keeps his momentum", "Use a wheelchair for every future trip"]}, "r3": {"stem": "As the LVN walking with Mr. Tuttle, he freezes at the doorway. Which action is safe and within your scope?", "options": ["Grab his arm and pull him through the door", "Calmly cue him to rock side to side, then step over a line or tape mark", "Tell him to hurry because the bathroom is close", "Chart that he should never walk again"]}, "rationale": "Freezing is common in Parkinson disease. Cues like rocking side to side, stepping over a line, or lifting the toes help restart movement. Never hurry or pull the patient, since the propulsive gait and poor balance make falls likely. Staying active is part of the plan, so stopping all walking leads to deconditioning.", "hook": "Frozen? Rock it, then step over it.", "source": "AHN Ch 14 p 689, p 692 (study notes p 19)", "flag": null}, {"id": "W4_033", "topic": "Alzheimer Disease", "difficulty": "Intermediate", "type": "mc", "case": null, "adpie": "Implementation", "answer": [0], "r1": {"stem": "Mrs. Gladys Honeycutt, a former crossword champion with middle stage Alzheimer disease, becomes anxious at dinner and keeps standing up. Which approach is best?", "options": ["Offer finger foods she can eat while walking, with a calm, unhurried approach", "Give her a menu with 12 choices so she feels in control", "Explain her whole care plan in detail so she understands", "Restrain her in the chair until she finishes eating"]}, "r2": {"stem": "A patient with Alzheimer disease will not sit through meals and is anxious. What is the best intervention?", "options": ["Provide finger foods she can eat on the move and stay calm and unhurried", "Present many menu options to increase her sense of control", "Give a detailed explanation of her treatment plan", "Use a restraint so she stays seated to eat"]}, "r3": {"stem": "As the LVN caring for Mrs. Honeycutt at dinner, which action best meets her nutrition and anxiety needs?", "options": ["Hand her a sandwich and fruit she can eat while walking, and speak slowly and calmly", "Let her pick from the entire cafeteria menu", "Explain her diet orders in full medical detail", "Apply a lap belt until her plate is clean"]}, "rationale": "Patients with Alzheimer disease often cannot sit through a meal, so finger foods eaten while walking keep nutrition up, along with at least 2000 mL of fluid a day. Reduce anxiety with a calm, unhurried approach, a consistent caregiver, simple explanations, and FEW choices. Many choices and long explanations overwhelm her. Restraints increase agitation and are not a feeding strategy.", "hook": "AD care: few choices, finger foods, no hurry.", "source": "AHN Ch 14 p 693 to 695, Care Plan 14.1; Key Points p 718", "flag": null}, {"id": "W4_034", "topic": "Alzheimer Disease", "difficulty": "Difficult", "type": "mc", "case": null, "adpie": "Implementation", "answer": [1], "r1": {"stem": "Mrs. Honeycutt is started on donepezil (Aricept). Which nursing action is correct?", "options": ["Give it in the morning with breakfast and expect it to cure the disease", "Give it in the evening just before bed and monitor her heart rate for bradycardia", "Hold it if her pulse is over 100, since the drug causes tachycardia", "Check liver enzymes daily, since donepezil causes liver failure"]}, "r2": {"stem
