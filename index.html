ndary prevention means early detection and prompt treatment, usually through screening, before disease becomes serious. Mammograms, blood pressure checks, and Pap tests all find disease early. Immunization is primary prevention because it prevents disease before it starts. Cardiac rehab is tertiary prevention because it limits disability and restores function after disease has happened.", "hook": "Secondary = Screening.", "source": "General NCLEX PN content (no FON or Patton pages uploaded)", "flag": null}, {"id": "W7_034", "topic": "Population Health and Epidemiology", "difficulty": "Difficult", "type": "mc", "case": null, "adpie": "Diagnosis", "answer": [0], "r1": {"stem": "Pickle Creek (population 5,000, home of the world's largest pickle statue) has 300 residents living with diabetes. Of those, 25 were newly diagnosed this year. Which statement is accurate?", "options": ["The 25 new cases this year are the incidence", "The 25 new cases this year are the prevalence", "The 300 total cases are the incidence", "The 300 total cases are the mortality"]}, "r2": {"stem": "In a town with a giant pickle statue, 300 people have diabetes, and 25 of them were diagnosed for the first time this year. How should the nurse describe these numbers?", "options": ["The 25 newly diagnosed people represent incidence", "The 25 newly diagnosed people represent prevalence", "The 300 people living with diabetes represent incidence", "The 300 people living with diabetes represent mortality"]}, "r3": {"stem": "The public health RN asks the LVN to help label Pickle Creek's diabetes data for an education plan. Which label should the LVN apply?", "options": ["Incidence: the 25 people diagnosed this year", "Prevalence: the 25 people diagnosed this year", "Incidence: all 300 people who have diabetes", "Mortality: all 300 people who have diabetes"]}, "rationale": "Incidence counts NEW cases during a set time period, so 25 new diagnoses this year is the incidence. Prevalence counts ALL existing ca       ${it.ok?"":`<p><b>Correct answer: ${keyLetters}</b></p>`}
      <p>${esc(q.rationale)}</p>
      ${q.hook?`<p class="hook"><b>Memory hook:</b> ${esc(q.hook)}</p>`:""}
      ${q.flag?`<p class="flag"><b>Professor check:</b> ${esc(q.flag)}</p>`:""}
      <p class="src">Source: ${esc(q.source)}</p></div>`;
  }
  return `<article class="q${q.case?" in-case":""}" id="card${idx}">
    <div class="top"><span class="qnum">Q${idx+1}</span><span class="topic">${esc(q.topic)}</span><span class="diff ${q.difficulty}">${q.difficulty}</span>
      ${W.round===3?`<span class="adpie">ADPIE \u00b7 ${q.adpie}</span>`:""}${multi?`<span class="sata">Select all that apply</span>`:""}
      <button class="bm" data-bm="${idx}" aria-pressed="${it.bm}" aria-label="Bookmark question">${it.bm?"\u2605":"\u2606"}</button></div>
    <p class="stem">${esc(v.stem)}</p>
    <div class="opts" role="group">${opts}</div>
    ${it.done?"":`<button class="btn submit" data-sub="${idx}" ${it.sel.size?"":"disabled"}>Submit</button>`}
    ${fb}</article>`;
}
function rerenderCard(idx){
  const el=document.getElementById("card"+idx);
  const t=document.createElement("div"); t.innerHTML=cardHTML(S.week.items[idx],idx);
  el.replaceWith(t.firstElementChild); bindCards();
}
function bindCards(){
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const it=S.week.items[+b.dataset.i], o=+b.dataset.o; if(it.done) return;
    if(it.q.type==="sata"){ it.sel.has(o)?it.sel.delete(o):it.sel.add(o); }
    else { if(it.sel.has(o)) it.sel.clear(); else { it.sel.clear(); it.sel.add(o); } }
    rerenderCard(+b.dataset.i);
  });
  app.querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>submit(+b.dataset.sub));
  app.querySelectorAll("[data-bm]").forEach(b=>b.onclick=()=>{ const it=S.week.items[+b.dataset.bm]; it.bm=!it.bm; rerenderCard(+b.dataset.bm); });
}
function submit(idx){
  const W=S.week, it=W.items[idx];
  if(it.done || !it.sel.size) return;
  const a=new Set(it.q.answer);
  it.ok = a.size===it.sel.size && [...a].every(x=>it.sel.has(x));
  it.done=true; it.msg = it.ok?pick(YES):pick(NOPE);
  W.answered++; if(it.ok) W.correct++;
  const h = W.history[it.q.id] || (W.history[it.q.id]={});
  h[W.round] = it.ok;
  rerenderCard(idx); refreshBar();
  if(W.auto) gotoNextUnanswered(idx, true);
}
function refreshBar(){
  const W=S.week, bar=app.querySelector(".bar");
  const t=document.createElement("div"); t.innerHTML=barHTML(true); bar.replaceWith(t.firstElementChild); bindBar();
  const f=document.getElementById("finish"); if(f) f.disabled = W.answered!==W.items.length;
}
function gotoNextUnanswered(from, delayed){
  const W=S.week, n=W.items.length;
  let target=-1;
  for(let k=1;k<=n;k++){ const i=(from+k+n)%n; if(!W.items[i].done){ target=i; break; } }
  const go=()=>{ const el = target>=0? document.getElementById("card"+target) : document.getElementById("finish");
    if(el) el.scrollIntoView({behavior:"smooth", block:"start"}); };
  delayed? setTimeout(go, 1600) : go();
}
function finishRound(){
  const W=S.week;
  W.lastScore = Math.round(W.correct/W.items.length*100);
  W.lastMissed = W.items.filter(it=>!it.ok).map(it=>it.q);
  if(W.round===3 && !W.retake){ const best=load("nsg_best")||{}; best[W.n]=Math.max(best[W.n]||0, W.lastScore); store("nsg_best",best); }
  if(W.retake){ S.view="results"; }
  else if(W.round===1){ S.view="inter"; }
  else if(W.round===2){ S.view="inter"; }
  else { W.finalMissed = W.lastMissed; S.view="results"; }
  render();
}
function renderInter(){
  const W=S.week;
  const r1 = W.round===1;
  app.innerHTML = `${barHTML(false)}<div class="inter">
    <p class="eyebrow">${ROUND_NAME[W.round]} complete</p>
    <p class="big">${W.lastScore}%</p>
    <h1>${r1?"Good job.":"Oh, you thought this was over?"}</h1>
    <p class="muted" style="max-width:46ch">${r1?"Now the same concepts come back in disguise. Every stem and every answer is reworded, so you cannot coast on remembering that the answer was C.":"Round 3 is the challenge round. Scope of practice, priorities, ADPIE. Your clinical instructor would be proud. Or terrified."}</p>
    ${missedList(W.lastMissed)}
    <button class="btn" id="next">${r1?"Start Round 2":"Bring on Round 3"}</button></div>`;
  bindBar();
  document.getElementById("next").onclick=()=>startRound(W.round+1);
}
function missedList(missed){
  if(!missed.length) return `<p>Zero misses. Absolutely unhinged performance.</p>`;
  const by={}; missed.forEach(q=>by[q.topic]=(by[q.topic]||0)+1);
  return `<div class="panel" style="width:100%;text-align:left"><h3>Missed by topic</h3><ul class="missed">${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([t,c])=>`<li><span>${esc(t)}</span><b>${c}</b></li>`).join("")}</ul></div>`;
}
function renderResults(){
  const W=S.week, wd=weekData(W.n);
  const qs=W.pool, rounds=[1,2,3];
  const pct=r=>{ const v=qs.map(q=>W.history[q.id]&&W.history[q.id][r]).filter(x=>x!==undefined); return v.length?Math.round(v.filter(Boolean).length/v.length*100)+"%":"n/a"; };
  const missed = W.retake? W.lastMissed : W.finalMissed;
  app.innerHTML = `${barHTML(false)}<div class="stack" style="margin-top:16px">
    <header class="hero" style="padding-block:6px"><p class="eyebrow">${META[W.n].label} complete</p><h1>${W.retake?"Retake done":"You survived "+esc(wd.title)}</h1></header>
    <section class="panel"><div class="row" style="justify-content:space-around;text-align:center">
      ${rounds.map(r=>`<div><p class="eyebrow">${ROUND_NAME[r].split(":")[0]}</p><p class="big" style="font-size:2.2rem">${pct(r)}</p></div>`).join("")}</div>
      ${W.retake?`<p class="muted">Retake score: ${W.lastScore}%</p>`:""}</section>
    ${missedList(missed)}
    ${missed.length?`<section class="panel"><h3>Persistent misses</h3><p class="muted">${missed.length} question${missed.length>1?"s":""} still fought back${W.retake?"":" in Round 3"}. Retake just those, Round 3 style.</p>
      <div><button class="btn" id="retake">Retake again</button></div></section>`:""}
    <div class="row"><button class="btn ghost" id="again">Run the whole week again</button></div>
    ${weekNav()}</div>`;
  bindBar(); bindNav();
  const rt=document.getElementById("retake");
  if(rt) rt.onclick=()=>{ W.pool=missed.slice(); W.retake=true; startRound(3); };
  document.getElementById("again").onclick=()=>openWeek(W.n);
}
/* theme toggle: sun mode and dark mode */
(function(){
  const root=document.documentElement, btn=document.getElementById("themebtn");
  const sysDark=()=>window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  const cur=()=>root.dataset.theme || (sysDark()?"dark":"light");
  function paint(){ const d=cur()==="dark"; btn.textContent=d?"\u2600\ufe0f":"\u{1F319}";
    btn.setAttribute("aria-label", d?"Switch to sun mode":"Switch to dark mode"); btn.title=d?"Sun mode":"Dark mode"; }
  let saved=null; try{ saved=localStorage.getItem("nsg_theme"); }catch(e){}
  if(saved==="dark"||saved==="light") root.dataset.theme=saved;
  btn.onclick=()=>{ const next=cur()==="dark"?"light":"dark"; root.dataset.theme=next; try{ localStorage.setItem("nsg_theme",next); }catch(e){} paint(); };
  paint();
})();
render();
</script>

</body></html>
