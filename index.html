OK. Position the patient on the BACK or the NON OPERATIVE side. Report SEVERE or PROGRESSIVE pain to the surgeon immediately; pain, redness, vision loss, and photophobia can signal REJECTION. COUGHING IS DISCOURAGED, and bending, lifting, and straining are avoided for about 1 month to protect IOP and sutures. A metal shield is worn at night.", "hook": "New cornea: no reading race, no cough, no lying on the graft.", "source": "Ch 13 p 634 to 635; EAQ13_23, EAQ13_42", "flag": null}, {"id": "W5_034", "topic": "Hearing Assessment and Loss", "difficulty": "Difficult", "type": "mc", "case": null, "adpie": "Assessment", "answer": [1], "r1": {"stem": "Mr. Ortega reports hearing loss in his RIGHT ear. On the Weber test, the sound is louder in his LEFT ear, and on the Rinne test of the right ear, air conduction is heard longer than bone conduction. Which type of loss does this suggest?", "options": ["Conductive loss in the right ear", "Sensorineural loss in the right ear", "Conductive loss in the left ear", "Normal hearing in both ears"]}, "r2": {"stem": "A patient with right sided hearing loss hears the Weber tone louder on the left, and the right Rinne shows air longer than bone. What is the likely type of loss?", "options": ["Right ear conductive loss", "Right ear sensorineural loss", "Left ear conductive loss", "No hearing loss"]}, "r3": {"stem": "As the LVN assisting with tuning fork tests, you note: complaint of right ear loss, Weber louder on the left, right Rinne air longer than bone. Which result do you report to the RN?", "options": ["Findings consistent with a right conductive loss", "Findings consistent with a right sensorineural loss", "Findings consistent with a left conductive loss", "Normal tuning fork results"]}, "rationale": "In SENSORINEURAL loss, the Weber lateralizes to the GOOD (unaffected) ear, and on the Rinne, air conduction is still heard longer than bone (but not twice as long). In CONDUCTIVE loss, the Weber lateralizes to the BAD ear (it gets bone vibration without background noise), and the Rinne shows bone heard as long as or longer than air. His Weber goes to the left (good) ear and air beats bone on the right, so this is right sensorineural loss. Normal hearing would give equal Weber sound in both ears.", "hook": "Weber: sensoriNEURAL goes to the Normal ear; CONDUCTIVE goes to the Crummy ear. Rinne: conductive = Bone beats air.", "source": "Ch 13 p 638, p 640; EAQ13_30; tb AHN13_MC17 idea", "flag": null}, {"id": "W5_035", "topic": "Hearing Assessment and Loss", "difficulty": "Basic", "type": "mc", "case": null, "adpie": "Diagnosis", "answer": [3], "r1": {"stem": "Which cause produces a CONDUCTIVE hearing loss, where sound is quieter but still clear, so a hearing aid helps?", "options": ["Ototoxic medications", "Presbycusis", "A stroke damaging the auditory pathways", "Cerumen impaction"]}, "r2": {"stem": "Which condition blocks sound in the outer or middle ear, causing a conductive loss?", "options": ["Drugs that are toxic to the ear", "Age related hearing loss (presbycusis)", "Stroke involving the brain's hearing pathways", "Impacted earwax"]}, "r3": {"stem": "As the LVN reviewing a patient's history, which finding do you recognize as a cause of conductive hearing loss?", "options": ["Long term use of an ototoxic antibiotic", "Gradual age related hearing loss", "A recent stroke affecting auditory pathways", "Earwax packed tightly in the canal"]}, "rationale": "CONDUCTIVE loss happens when sound is blocked in the EXTERNAL or MIDDLE ear: cerumen buildup, otitis media with effusion, foreign bodies, otosclerosis, and canal stenosis. Volume drops but clarity is unchanged, so hearing aids help. SENSORINEURAL loss is an inner ear defect that DISTORTS sound; causes include ototoxic drugs, presbycusis, noise damage to cochlear hair cells, trauma, and infection. A stroke or tumor damaging brain auditory pathways causes CENTRAL hearing loss.", "hook": "Conductive = Clogged (wax, fluid, stiff stapes). Sensorineural = Scrambled.", "source": "Ch 13 p 639 to 640; EAQ13_03, EAQ13_15; tb AHN13_SATA01 idea", "flag": null}, {"id": "W5_036", "topic": "Hearing Assessment and Loss", "difficulty": "Basic", "type": "sata", "case": null, "adpie": "Implementation", "answer": [0, 1, 2], "r1": {"stem": "Grandpa Elmer is famous for setting his TV to volume 65. Which hearing aid care instructions are correct? Select all that apply.", "options": ["Wash the ear mold daily in mild soap and water, then dry it well before reconnecting", "Turn the aid off and open the battery compartment when it is not in use", "If the aid whistles, reinsert the ear mold", "Wash the hearing aid itself in soapy water", "Wear the aid overnight so you can hear the smoke alarm", "Use hair spray while the aid is in so it stays in place"]}, "r2": {"stem": "Which teaching about hearing aid care is accurate? Select all that apply.", "options": ["Clean the ear mold each day with mild soap and water and dry it thoroughly", "Switch it off and open the battery door when not wearing it", "Whistling means the ear mold should be reseated", "Submerge the hearing aid in soapy water to clean it", "Sleep with the hearing aid in place", "Apply hair spray with the aid in your ear"]}, "r3": {"stem": "As the LVN reinforcing hearing aid care with Grandpa Elmer, which instructions do you include? Select all that apply.", "options": ["Wash only the ear mold daily and let it dry completely before hooking it back up", "At night, turn it off and pop open the battery compartment", "When it squeals, take the ear mold out and put it back in properly", "Give the whole hearing aid a good soak in the sink", "Leave it in all night long", "Style your hair with spray while it is in"]}, "rationale": "Box 13.3: wash the EAR MOLD (not the aid) daily in mild soap and water and dry it thoroughly before reconnecting. When not in use, turn the aid OFF and OPEN the battery compartment to save the battery. WHISTLING means the mold is not seated, so reinsert it. Never wash the hearing aid itself, never wear it in the shower or OVERNIGHT, and avoid cream, oil, or hair spray while it is on. Keep extra batteries and a cord available.", "hook": "Wash the MOLD, never the AID. Off and open at night.", "source": "Ch 13 p 641 (Box 13.3); EAQ13_52", "flag": null}, {"id": "W5_037", "topic": "Hearing Assessment and Loss", "difficulty": "Intermediate", "type": "mc", "case": null, "adpie": "Implementation", "answer": [0], "r1": {"stem": "The LVN observes a nursing assistant talking with Mr. Haskins, who has a sensorineural hearing loss. Which action needs correction?", "options": ["Shouting each word slowly with exaggerated lip movements", "Moving closer to his better ear", "Facing him in a well lit room", "Rephrasing a sentence he did not understand"]}, "r2": {"stem": "Which communication technique with a hearing impaired patient is inappropriate?", "options": ["Yelling and over accentuating each word", "Speaking toward his stronger ear", "Facing the patient with good lighting", "Rewording a sentence he missed"]}, "r3": {"stem": "As the LVN supervising a CNA's care, which behavior do you step in to correct when she speaks to a patient with sensorineural hearing loss?", "options": ["She yells and exaggerates every syllable", "She moves to the side of his better ear", "She stands facing him under good light", "She says it a different way when he misses it"]}, "rationale": "SHOUTING distorts sound and is too loud for someone with sensorineural damage, and over accentuating words makes lip reading harder; speak clearly in a NORMAL tone. Facing the patient in good light, REPHRASING (some words are hard to lip read), and moving closer to the BETTER ear are all correct. Also make sure the hearing aid is IN, ON, and WORKING before you start, get attention by raising a hand, and do not chew gum or cover your mouth.", "hook": "Face, light, rephrase, better ear. Never shout.", "source": "Ch 13 p 640 (communication box); EAQ13_21; tb AHN13_MC07 idea", "flag": null}, {"id": "W5_038", "topic": "Ear Infections", "difficulty": "Intermediate", "type": "mc", "case": null, "adpie": "Assessment", "answer": [2], "r1": {"stem": "Marisol, a competitive synchronized swimmer, has ear pain that gets worse when the nurse gently pulls her auricle, plus green, foul smelling drainage. Which condition and organism are most likely?", "options": ["Meniere disease", "Otosclerosis", "External otitis, likely Pseudomonas", "Otitis media, likely a fungus"]}, "r2": {"stem": "Pain on moving the pinna with green drainage that has a distinct odor suggests which problem?", "options": ["Excess endolymph in the inner ear (Meniere disease)", "A fixed stapes from spongy bone (otosclerosis)", "Swimmer's ear (external otitis) from Pseudomonas", "Middle ear infection caused by a fungus"]}, "r3": {"stem": "As the LVN collecting data, you find pain when you tug the auricle and green, foul drainage in a swimmer's ear canal. Which condition do you report to the RN as likely?", "options": ["An inner ear fluid disorder such as Meniere disease", "Otosclerosis of the middle ear bones", "External otitis with probable Pseudomonas infection", "Fungal otitis media"]}, "rationale": "EXTERNAL OTITIS (swimmer's ear) causes pain when the auricle is moved or with chewing; swimming washes out protective cerumen. PSEUDOMONAS causes GREEN drainage with a distinct odor, while fungal drainage is BLACK. Otitis media does NOT cause pain on palpation of the external ear. Hydrocortisone drops reduce EDEMA so the antibiotic drops can penetrate. Malignant external otitis is a rare, bone destroying Pseudomonas infection mostly in diabetics, with 50 to 75% mortality untreated.", "hook": "Pull the pinna, it hurts = external. Green = Pseudomonas, Black = fungus.", "source": "Ch 13 p 641 to 642; EAQ13_13, EAQ13_29, EAQ13_32; tb AHN13_MC16 idea", "flag": "S11: The prognosis paragraph on p 642 says 'malignant external otitis media'; the condition is malignant external OTITIS (outer canal, Pseudomonas, diabetics), not otitis media."}, {"id": "W5_039", "topic": "Ear Infections", "difficulty": "Difficult", "type": "mc", "case": null, "adpie": "Implementation", "answer": [1], "r1": {"stem": "Theo, a 30 year old who 'only' finished half of his antibiotic for otitis media, now has fever, headache, malaise, earache, and large amounts of purulent ear drainage. What is the best nursing action?", "options": ["Irrigate the ear with tap water to wash out the pus", "Report these findings immediately, because they suggest mastoiditis", "Tell him these are expected and to finish the leftover pills", "Stop all antibiotics, since the drainage shows they are not working"]}, "r2": {"stem": "A patient with partially treated otitis media develops fever, headache, malaise, ear pain, and heavy purulent drainage. What should the nurse do?", "options": ["Flush the canal with tap water", "Notify the provider at once for possible mastoiditis", "Reassure him these symptoms are normal and to finish his old pills", "Discontinue antibiotics because the infection is resistant"]}, "r3": {"stem": "As the LVN, you collect these data from Theo: fever, headache, malaise, earache, and heavy purulent drainage after he stopped his antibiotic early. What do you do?", "options": ["Irrigate his ear with tap water before reporting", "Report them to the RN and provider immediately as possible mastoiditis", "Tell him to take the rest of his old prescription and rest", "Instruct him to stop all antibiotics"]}, "rationale": "Untreated or under treated otitis media can spread through the posterior wall of the middle ear to the MASTOID. Earache, fever, headache, malaise, and large amounts of purulent exudate must be REPORTED IMMEDIATELY; mastoiditis is hard to treat and needs IV antibiotics. Infection from the ear or mastoid can even extend into the brain, the primary cause of a brain abscess (Ch 14). Completing the FULL antibiotic course prevents this; children 6 to 36 months are most at risk because their eustachian tubes are shorter and straighter. Ear pain that suddenly stops can mean the eardrum ruptured.", "hook": "Ear infection skipped meds = mastoid trouble. Finish the full course.", "source": "Ch 13 p 642 to 645; Ch 14 p 709 to 710 (brain abscess); EAQ13_22; tb AHN13_MC29 idea", "flag": null}, {"id": "W5_040", "topic": "Otosclerosis and Ear Surgery", "difficulty": "Intermediate", "type": "mc", "case": null, "adpie": "Implementation", "answer": [3], "r1": {"stem": "Four hours after a stapedectomy for otosclerosis, Ms. Rosalind, a church choir director, cries, 'I still can't hear a thing! It didn't work!' Which response is best?", "options": ["'The surgery probably failed; I'll call the surgeon now.'", "'Your hearing will come back after we irrigate the ear tonight.'", "'Turn onto your operative side so the fluid drains out.'", "'Hearing usually doesn't improve until the swelling goes down and the packing is removed.'"]}, "r2": {"stem": "What should the nurse tell a patient who has no hearing improvement a few hours after stapedectomy?", "options": ["The procedure has likely failed", "An ear irrigation tonight will restore hearing", "Lying on the operative side will drain the ear and help", "Hearing typically returns after edema subsides and the ear packing comes out"]}, "r3": {"stem": "As the LVN, how do you respond to a choir director who is upset that she cannot hear 4 hours after her stapedectomy?", "options": ["'Sounds like it didn't work. Let me page the surgeon.'", "'We'll flush the ear tonight and that should fix it.'", "'Lie on the surgery side and let it drain.'", "'This is expected for now; hearing improves once the swelling settles and the packing is out.'"]}, "rationale": "OTOSCLEROSIS is spongy bone around the oval window that fixes the stapes, causing slowly progressive CONDUCTIVE loss; STAPEDECTOMY replaces the stapes with a prosthesis. Hearing does NOT improve until edema subsides and the packing is removed; about 90% improve, often to near normal. Post op, keep her FLAT with the OPERATIVE SIDE UP and do not turn her; headache, nausea, and dizziness are expected early. Irrigation is not part of post op care, and lying on the operative side is wrong.", "hook": "Stapedectomy: operative side UP, hearing comes back when the packing comes OUT.", "source": "Ch 13 p 646 to 647, p 650; EAQ13_10, EAQ13_49; tb AHN13_MC06, AHN13_SATA05 ideas", "flag": null}, {"id": "W5_041", "topic": "Otosclerosis and Ear Surgery", "difficulty": "Intermediate", "type": "sata", "case": null, "adpie": "Evaluation", "answer": [0, 1, 2], "r1": {"stem": "Ms. Rosalind is going home after her stapedectomy. Which statements show she understands her teaching? Select all that apply.", "options": ["'I'll sneeze and cough with my mouth open.'", "'I'll keep my ear dry for 6 weeks and wear a shower cap.'", "'I won't fly for at least 1 week.'", "'I'll blow my nose hard to clear the pressure.'", "'I can swim laps next week.'", "'I'll wash my hair the day after surgery.'"]}, "r2": {"stem": "Which discharge statements after ear surgery indicate correct understanding? Select all that apply.", "options": ["'When I sneeze or cough, I'll keep my mouth open.'", "'Water stays out of my ear for 6 weeks, so I'll use a shower cap.'", "'No airplane trips for at least a week.'", "'Forceful nose blowing will relieve the pressure.'", "'Swimming is fine starting next week.'", "'Shampooing my hair tomorrow is OK.'"]}, "r3": {"stem": "As the LVN evaluating discharge teaching after a stapedectomy, which statements tell you Ms. Rosalind understood? Select all that apply.", "options": ["'Mouth open for every sneeze and cough.'", "'Shower cap on, and no water in the ear for 6 weeks.'", "'The choir trip by plane will have to wait at least a week.'", "'A big honk into a tissue will pop my ears.'", "'I'll get back in the pool next week.'", "'I'm washing my hair first thing tomorrow.'"]}, "rationale": "After ear surgery, open the MOUTH when sneezing or coughing and blow the nose gently, one side at a time, for 1 week, to avoid pressure on the middle ear. Keep the ear DRY for 6 WEEKS (shower cap; two pieces of cotton outdoors), no hair washing for 1 week, and NO AIRPLANE flights for at least 1 week. Forceful nose blowing, swimming, and early hair washing all risk pressure or water in the ear. Avoid people with URIs and protect the ear from loud noise.", "hook": "Ear surgery: mouth open, ear dry 6 weeks, grounded 1 week.", "source": "Ch 13 p 650 to 651 (Patient Teaching after ear surgery)", "flag": null}, {"id": "W5_042", "topic": "Meniere and Vertigo", "difficulty": "Intermediate", "type": "sata", "case": null, "adpie": "Planning", "answer": [0, 1, 2, 3], "r1": {"stem": "Ms. Delacroix, 48, a coffee shop owner, has Meniere disease with recurrent vertigo, tinnitus, and hearing loss. Which measures belong in her plan of care? Select all that apply.", "options": ["Low salt diet", "Fluid restriction as ordered", "Diuretics as ordered", "Avoid caffeine and nicotine", "Drink extra espresso to stay alert during attacks", "Walk briskly during a vertigo attack to work through it"]}, "r2": {"stem": "Which interventions help control the symptoms of Meniere disease? Select all that apply.", "options": ["Restricting sodium", "Limiting fluids per orders", "Giving prescribed diuretics", "Cutting out caffeine and nicotine", "Increasing coffee intake", "Encouraging fast walking when vertigo hits"]}, "r3": {"stem": "As the LVN contributing to the plan of care for a patient with Meniere disease, which interventions do you include? Select all that apply.", "options": ["Low sodium meal trays", "Following the ordered fluid restriction", "Giving the scheduled diuretic", "Teaching her to avoid caffeine and to stop smoking", "Offering her a double shot latte at breakfast", "Walking her quickly in the hall during an attack"]}, "rationale": "Meniere disease is a buildup of ENDOLYMPH that raises pressure in the inner ear labyrinth, causing the triad of vertigo, tinnitus, and sensorineural hearing loss (plus ear fullness), usually in one ear. Treatment targets the fluid: LOW SALT diet, FLUID RESTRICTION, and DIURETICS, and the patient avoids CAFFEINE and NICOTINE (nicotine causes vasoconstriction). During an attack she needs bed rest and to sit or lie down immediately, not walk, because sudden movement worsens vertigo. Diagnosis requires two or more documented episodes plus positive tests.", "hook": "Meniere: treat the fluid. Low salt, less water, diuretics, no caffeine or nicotine.", "source": "Ch 13 p 647 to 650; EAQ13_48", "flag": null}, {"id": "W5_043", "topic": "Meniere and Vertigo", "difficulty": "Difficult", "type": "mc", "case": null, "adpie": "Implementation", "answer": [0], "r1": {"stem": "Ms. Delacroix is in an acute Meniere attack with severe vertigo and nausea. Which nursing action is most appropriate?", "options": ["Keep the room quiet and darkened, and stand in front of her when speaking so she does not turn her head", "Approach from the side and call her name so she turns toward you", "Turn on the TV to distract her from the dizziness", "Give her a magazine to read until the attack passes"]}, "r2": {"stem": "Which intervention is best during an acute attack of Meniere disease?", "options": ["Provide a quiet, dark room and talk to her from directly in front", "Speak from her side so she turns her head toward you", "Distract her with television", "Offer reading material to pass the time"]}, "r3": {"stem": "As the LVN caring for a patient in an acute Meniere attack, which action do you take?", "options": ["Dim the lights, keep things quiet, and position yourself in front of her when you talk", "Walk in from her side and say her name so she looks over", "Put on a game show to take her mind off it", "Hand her the newspaper crossword"]}, "rationale": "During an acute Meniere attack, provide a QUIET, DARKENED room and a comfortable position, and STAND IN FRONT of the patient so she does not turn her head; sudden head movement worsens vertigo. Avoid fluorescent or flickering lights and TV, and no READING while vertigo or tinnitus is present. Keep an emesis basin handy, raise the side rails, and place supplies so she does not have to turn her head. Background music can help tinnitus between attacks.", "hook": "Meniere attack: dark, quiet, still. Talk from the front.", "source": "Ch 13 p 649 to 650", "flag": null}, {"id": "W5_044", "topic": "Meniere and Vertigo", "difficulty": "Basic", "type": "mc", "case": null, "adpie": "Implementation", "answer": [2], "r1": {"stem": "Rocco, a tilt a whirl operator, has labyrinthitis and is prescribed meclizine. Which instruction is correct?", "options": ["'Spin the opposite direction to cancel out the dizziness.'", "'Drink less water so you don't feel so dizzy.'", "'When vertigo hits, lie down right away and keep your head still until it passes; avoid alcohol with meclizine.'", "'Walk it off quickly when you feel dizzy.'"]}, "r2": {"stem": "Which teaching is appropriate for a patient with labyrinthitis on meclizine?", "options": ["Rotate the other way to undo the spinning", "Limit fluids to lessen dizziness", "Lie down immediately during vertigo, hold the head in one position, and avoid alcohol and other CNS depressants", "Walk briskly when dizziness starts"]}, "r3": {"stem": "As the LVN reinforcing teaching for Rocco, which instruction do you give?", "options": ["'Try spinning the other way on the ride to balance it out.'", "'Cut back on water to help the dizziness.'", "'If the room starts spinning, lie down right away and hold your head still, and skip the beer while on meclizine.'", "'Push through it and keep walking.'"]}, "rationale": "Labyrinthitis is inflammation of the inner ear canals and the MOST COMMON cause of vertigo, often after a viral URI. During an attack, LIE DOWN immediately (if driving, pull over) and hold the head in ONE position until it lessens. Meclizine and dimenhydrinate are anticholinergic antihistamines that cause drowsiness, so NO alcohol or other CNS depressants. Walking during vertigo risks falls, and fluids should be ENCOURAGED, since vomiting can dehydrate. Check for vertigo before ambulating and supervise walking.", "hook": "Vertigo: drop and freeze. Meclizine: no booze.", "source": "Ch 13 p 643 to 646 (Table 13.5, vertigo teaching); EAQ13_39, EAQ13_50", "flag": null}]}, {"week": 6, "title": "Neuro Trauma and Autonomic Drugs", "tagline": "Helmets on, heads neutral, and nobody blows their nose. Welcome to trauma week.", "cases": {"W6_CASE1": {"title": "Case: Dale, the Backyard Trampoline Champion", "text": "Dale Buckley, 34, calls himself the trampoline champion of his cul de sac. He bounced off the safety net, landed headfirst on the patio, was knocked out for about a minute, then woke up cracking jokes with the paramedics. In the ED an hour later he is getting harder to wake, and you notice bruising behind his left ear and clear, watery fluid dripping from his nose."}, "W6_CASE2": {"title": "Case: Ms. Ortega, Retired Rodeo Clown", "text": "Rosalind Ortega, 58, spent 30 years as a rodeo clown until a bull named Sir Stompsalot gave her a complete T4 spinal cord injury. She lives in a long term care facility and has an indwelling urinary catheter. This afternoon she calls you in: her head is pounding, her face is flushed and sweaty, her BP is 210/120 mm Hg, and her pulse is 48."}}, "questions": [{"id": "W6_001", "topic": "TBI Basics", "difficulty": "Basic", "type": "mc", "case": null, "adpie": "Assessment", "answer": [1], "r1": {"stem": "Pickles McGee, 26, rode the same roller coaster 31 times in a row to win a bet. Now he has a headache and brief confusion, but his head never hit anything. Which mechanism of injury fits best?", "options": ["Direct trauma from a blow to the skull", "Indirect trauma from acceleration deceleration and shearing forces", "Open head injury with a breached dura", "Penetrating injury from a foreign object"]}, "r2": {"stem": "A thrill seeker rode a coaster 31 straight times and now has confusion and a headache, yet nothing ever struck his head. How is this injury mechanism classified?", "options": ["A direct hit that struck the cranium", "Indirect injury caused by rapid speeding up, sudden stopping, and tearing forces", "An open injury in which the dura was torn", "A penetrating wound from an object entering the skull"]}, "r3": {"stem": "As the LVN collecting data on a high school linebacker who was tackled hard but whose helmet never touched the ground, you note confusion and a headache. Which mechanism do you describe when you report to the RN?", "options": ["Direct trauma from an object striking his skull", "Indirect trauma: the brain kept moving after the skull stopped, stretching and tearing neurons", "Open head injury, because the dura must be torn", "Penetrating trauma straight through the helmet"]}, "rationale": "Indirect trauma happens when force travels through the body and neck, causing acceleration deceleration and rotation. The skull stops, but the brain keeps moving (inertia), strikes the inside of the skull, and neurons stretch and tear (shearing). Car crashes, whiplash, football tackles, and roller coaster forces are classic examples, and the head never has to hit anything. Direct trauma means something actually struck the head, like a bat or a bullet. Open and penetrating injuries require the skull or dura to be breached, which did not happen here.", "hook": "Direct = something Dents the head. Indirect = Inertia does the damage.", "source": "Prof deck TBI slide 4", "flag": null}, {"id": "W6_002", "topic": "TBI Basics", "difficulty": "Intermediate", "type": "sata", "case": null, "adpie": "Assessment", "answer": [0, 1, 2], "r1": {"stem": "Walt, a grandpa who live streams his woodworking, had a shelf full of homemade birdhouses fall on his head. His granddaughter, a nursing student, writes a study sheet about head injuries. Which statements are correct? Select all that apply.", "options": ["In an open head injury the skull or dura is breached, so the main risk is infection", "In a closed head injury the skull and dura are intact, so the main risks are bleeding and increased ICP", "A comminuted skull fracture means the skull is shattered into several fragments", "A linear skull fracture means the skull is caved in", "A compound skull fracture stays sealed off from the outside environment"]}, "r2": {"stem": "A man hit by a collapsing shelf of birdhouses has a head injury. Which statements about head injury types are accurate? Select all that apply.", "options": ["When the skull or dura is broken open, infection is the biggest worry", "When the skull and dura stay intact, bleeding and rising intracranial pressure are the biggest worries", "Comminuted means the skull broke into multiple pieces", "Linear means the bone is pushed inward", "Compound means the fracture has no contact with the outside"]}, "r3": {"stem": "As the LVN reinforcing the RN's teaching with the family of a patient with a head injury, which statements are accurate to share? Select all that apply.", "options": ["Because his skull and dura were opened, we are watching closely for infection such as meningitis", "When the skull and dura are intact, we watch mainly for bleeding and pressure building inside the skull", "A comminuted fracture is one where the bone broke into several pieces", "A linear fracture is one where the bone is dented inward", "A compound fracture does not connect with the outside, so infection is not a concern"]}, "rationale": "Open injuries breach the skull or dura (a fracture or penetrating wound), opening a path for germs, so INFECTION is the main risk. Closed injuries keep the skull and dura intact, so the danger is BLEEDING and INCREASED ICP inside a closed box. Comminuted means shattered into several fragments. A linear fracture is a hairline crack; a skull that is caved in is a depressed fracture. A compound fracture communicates with the outside environment, which is exactly what makes it open.", "hook": "Open = Organisms get in. Closed = Crowding (blood and pressure).", "source": "Prof deck TBI slides 5 to 7", "flag": null}, {"id": "W6_003", "topic": "TBI Basics", "difficulty": "Intermediate", "type": "mc", "case": null, "adpie": "Assessment", "answer": [2], "r1": {"stem": "Reginald, 70, a competitive mall walker, power walked face first into a glass door at the food court. His CT shows a bruise on the front of his brain and a second bruise at the back. What is the bruise at the BACK of his brain called?", "options": ["Coup contusion at the point of impact", "Concussion without bruised tissue", "Contrecoup contusion on the side opposite the impact", "Epidural hematoma between the skull and dura"]}, "r2": {"stem": "A senior speed walker struck his forehead on a glass door. Imaging finds brain bruising at the front and also at the rear. Which term names the rear bruise?", "options": ["A coup bruise right where the head struck", "A concussion, a jarring with no tissue bruising", "A contrecoup bruise from the rebound on the far side", "An arterial bleed between the skull and the dura"]}, "r3": {"stem": "As the LVN reviewing the chart before reinforcing teaching, you read that a patient hit the BACK of his head on a trampoline frame and the CT shows bruising in the frontal lobe. Which term do you use to explain the frontal bruise to his wife?", "options": ["A coup injury, right where his head hit", "A concussion, which involves no bruising at all", "A contrecoup injury, from the brain bouncing to the opposite side", "An epidural bleed from a torn artery"]}, "rationale": "A contusion is a bruise of brain tissue. The coup injury is at the point of impact, and the contrecoup injury is the rebound bruise on the OPPOSITE side as the brain slams back the other way. A concussion is a violent jarring of the brain, classically with temporary loss of consciousness, and no bruised tissue. An epidural hematoma is an arterial bleed between the skull and dura, not a bruise.", "hook": "Coup = Contact spot. Contrecoup = Counter side.", "source": "Prof deck TBI slides 5 to 7", "flag": null}, {"id": "W6_004", "topic": "Hematomas", "difficulty": "Difficult", "type": "sata", "case": null, "adpie": "Assessment", "answer": [0, 1, 3, 4], "r1": {"stem": "Bev, 81, who live streams her bingo nights, bumped her head on the bingo hall table last week and seemed fine. Today her daughter says she is confused and sleepy. Which statements about head bleeds are correct? Select all that apply.", "options": ["Epidural bleeding is usually arterial", "Subdural bleeding is usually venous", "Subdural hematomas always cause symptoms within minutes", "An epidural hematoma collects between the skull and the dura", "Being fine for several days and then becoming confused fits a subdural hematoma", "An epidural hematoma is slow enough to be watched at home"]}, "r2": {"stem": "An older woman bumped her head a week ago and now is drowsy and confused. Which statements about intracranial bleeds are accurate? Select all that apply.", "options": ["Epidural bleeds generally come from an artery", "Subdural bleeds generally come from veins", "A subdural bleed always produces signs right away", "Epidural blood pools between the skull bone and the dura", "Several days of normal behavior followed by new confusion suggests a subdural bleed", "An epidural bleed develops slowly and is safe to monitor at home"]}, "r3": {"stem": "As the LVN, you are preparing to report a patient whose confusion started several days after a minor fall. Which statements should guide your report to the RN? Select all that apply.", "options": ["Epidural hematomas are typically arterial and fast", "Subdural hematomas are typically venous and slower", "A subdural would have caused symptoms within minutes, so this cannot be one", "Epidural blood sits between the skull and the dura", "A delayed change in LOC days after a fall fits a subdural hematoma and must be reported", "Epidural bleeds can be safely monitored at home"]}, "rationale": "Epidural = an arterial bleed between the dura and the skull; it builds fast (minutes to hours), often with a lucid interval, and is an emergency. Subdural = a venous bleed below the dura; it is slower (days to weeks) and can be acute, subacute, or chronic. A patient who stays conscious for several days and then loses consciousness or develops neuro signs should make you suspect a subdural. No head bleed is safe to manage at home, and subdurals are often delayed rather than immediate.", "hook": "Epidural = Artery = Express. Subdural = Slow, Sneaky, venous.", "source": "Prof deck TBI slides 8 to 9; idea from test bank AHN14_MC17", "flag": null}, {"id": "W6_005", "topic": "Hematomas", "difficulty": "Intermediate", "type": "mc", "case": "W6_CASE1", "adpie": "Diagnosis", "answer": [1], "r1": {"stem": "Dale was knocked out, woke up joking, and is now getting harder to wake. Which injury does this pattern most strongly suggest?", "options": ["Chronic subdural hematoma", "Epidural hematoma", "Mild concussion that is resolving", "Simple linear skull fracture"]}, "r2": {"stem": "Dale lost consciousness, then seemed fine, and within the hour is becoming drowsy. Which bleed best matches this course?", "options": ["A slow venous bleed under the dura that shows up weeks later", "A fast arterial bleed between the skull and the dura", "A brain jarring that is getting better", "A hairline skull crack with no bleeding"]}, "r3": {"stem": "As the LVN, you note Dale was alert and joking 30 minutes ago and now opens his eyes only to a loud voice. Which problem do you suspect as you report this change to the RN immediately?", "options": ["Subdural hematoma, which usually takes days to weeks to show", "Epidural hematoma with a lucid interval, a surgical emergency", "A resolving concussion, so recheck at the end of the shift", "A linear skull fracture, which rarely changes LOC"]}, "rationale": "This is the classic LUCID INTERVAL: injured, knocked out, wakes up and seems okay, then becomes lethargic or unconscious. It points to an EPIDURAL hematoma, an arterial bleed between the dura and skull that builds fast (minutes to hours) and needs immediate treatment. A subdural hematoma is usually venous and slow, so neuro signs may not appear for days. A resolving concussion would improve, not worsen. A decline in LOC is the earliest sign of rising ICP and gets reported right away.", "hook": "Lucid interval = Epidural = Emergency.", "source": "Prof deck TBI slides 8 to 9", "flag": null}, {"id": "W6_006", "topic": "Basilar Skull Fracture and CSF Leak", "difficulty": "Intermediate", "type": "mc", "case": "W6_CASE1", "adpie": "Assessment", "answer": [2], "r1": {"stem": "The clear fluid from Dale's nose could be cerebrospinal fluid. Which finding best supports that it is CSF?", "options": ["The drainage is thick, green, and smells sour", "Dale says his nose always runs when he gets excited", "A yellow ring forms around a bloody center on the gauze, and the fluid tests positive for glucose", "The drainage stops when he tilts his head forward"]}, "r2": {"stem": "Which result suggests the watery drip from Dale's nose is spinal fluid?", "options": ["Discharge that is green, thick, and foul smelling", "His report that his nose runs whenever he is thrilled", "A halo of pale fluid around blood on the dressing plus a positive glucose test", "The drip ending once he leans his head forward"]}, "r3": {"stem": "As the LVN collecting data on Dale's nasal drainage, which finding do you report to the RN as a likely CSF leak?", "options": ["Purulent green drainage with an odor", "Dale stating he has had allergies since childhood", "A halo sign on the gauze and drainage positive for glucose on a test strip", "Drainage that slows when his head is bent forward"]}, "rationale": "CSF is identified two ways: the HALO (ring) sign, a bloody center with a lighter yellow ring spreading out on the dressing, and a POSITIVE GLUCOSE on a test strip, because CSF contains glucose and normal nasal mucus does not. Clear rhinorrhea after head trauma points to a basilar skull fracture with torn meninges. Green, foul drainage suggests infection, not CSF. His own explanation and a change with head position do not identify the fluid.", "hook": "Halo plus sugar = CSF. Sweet fluid, serious skull.", "source": "Prof deck TBI slides 13, 15 to 16; Ch 14 p 713 Fig 14.21", "flag": null}, {"id": "W6_007", "topic": "Basilar Skull Fracture and CSF Leak", "difficulty": "Basic", "type": "mc", "case": "W6_CASE1", "adpie": "Implementation", "answer": [3], "r1": {"stem": "Which nursing action is correct for Dale's clear nasal drainage?", "options": ["Gently suction the nostrils to keep the airway clear", "Pack the nostrils with gauze to stop the leak", "Have him gently blow his nose into a tissue every hour", "Loosely place gauze under his nose and teach him not to blow his nose, cough, or sneeze"]}, "r2": {"stem": "How should the nurse manage the watery drip from Dale's nose?", "options": ["Use gentle nasal suction to clear it", "Plug each nostril with packing", "Ask him to lightly blow his nose every hour", "Let it drain onto loose gauze below the nose and tell him to avoid nose blowing, coughing, and sneezing"]}, "r3": {"stem": "As the LVN, which action within your scope protects Dale while the RN notifies the provider about his possible CSF leak?", "options": ["Pass a suction catheter through his nose", "Insert nasal packing to hold the fluid in", "Coach him to blow his nose to clear it", "Place a loose dressing under his nose, tell him not to blow his nose or cough, and watch for signs of meningitis"]}, "rationale": "With a possible basilar skull fracture, let the fluid drain freely onto a loose dressing; never clean out, pack, or suction the orifice. NEVER suction through the nose, because a catheter could pass through the fracture. Blowing the nose, coughing, and sneezing raise pressure and can push bacteria up through the torn meninges, so teach him to avoid them. Watch for fever and a stiff neck, since meningitis can develop when the meninges open to the nose or ears.", "hook": "Leaky nose? No blow, no suction, no plug. Just catch it.", "source": "Prof deck TBI slides 15 to 16; Ch 14 p 713; idea from test bank AHN14_MC25", "flag": null}, {"id": "W6_008", "topic": "TBI Care and Meds", "difficulty": "Difficult", "type": "mc", "case": "W6_CASE1", "adpie": "Assessment", "answer": [0], "r1": {"stem": "Dale is now drowsy, has vomited, and has a possible skull fracture. Which assessment is the PRIORITY?", "options": ["Airway patency and breathing", "Pupil size and reaction", "The size of the bruise behind his left ear", "His own rating of his trampoline dismount on a scale of 1 to 10"]}, "r2": {"stem": "Dale is getting drowsier and has vomited. What does the nurse check FIRST?", "options": ["Whether his airway is open and he is breathing effectively", "How his pupils look and respond to light", "How far the bruise behind his ear has spread", "How he would score his own flip technique"]}, "r3": {"stem": "As the LVN, you are first to reach Dale after he vomits while lying drowsy on the stretcher. What is your FIRST action before you report to the RN?", "options": ["Check and protect his airway and breathing while keeping his neck aligned", "Check pupil size and reactivity with a penlight", "Measure the bruise behind his ear", "Ask him to describe the move that caused the fall"]}, "rationale": "Airway comes first in any serious head injury: a drowsy patient who is vomiting can aspirate, and the injured brain cannot tolerate low oxygen. Protect the airway while keeping the neck aligned, because you assume a neck injury with any head injury until it is ruled out. Pupil checks are important and are done often, but they come after airway and breathing. The bruise (Battle sign) is already known and does not need measuring right now.", "hook": "ABCs before pupils. The brain runs on oxygen.", "source": "Ch 14 p 713 and review question 15; prof deck TBI slides 11 to 12", "flag": null}, {"id": "W6_009", "topic": "Basilar Skull Fracture and CSF Leak", "difficulty": "Basic", "type": "sata", "case": null, "adpie": "Assessment", "answer": [0, 1, 3], "r1": {"stem": "Bubba, a weekend demolition derby driver, arrives after his car flipped twice. Which findings suggest a BASILAR skull fracture? Select all that apply.", "options": ["Bruising behind the ear (Battle sign)", "Bruising around both eyes (raccoon eyes)", "Hives across the chest", "Clear fluid draining from the ear", "Pinpoint pupils in both eyes"]}, "r2": {"stem": "A demolition derby hobbyist rolled his car. Which signs point to a fracture at the base of the skull? Select all that apply.", "options": ["Ecchymosis over the mastoid area behind the ear", "Periorbital ecchymosis", "Raised itchy welts over the trunk", "Otorrhea of clear fluid", "Both pupils constricted to tiny points"]}, "r3": {"stem": "As the LVN collecting data on a patient after a rollover crash, which findings do you report to the RN as a possible basilar skull fracture? Select all that apply.", "options": ["Postauricular bruising", "Dark bruising circling both eyes", "A hive like rash on the chest", "Clear drainage leaking from one ear", "Very small pupils in both eyes"]}, "rationale": "Basilar (base of skull) fractures show up as Battle sign (bruising behind the ear), raccoon eyes (periorbital bruising), rhinorrhea or otorrhea (CSF from the nose or ear), and a positive halo sign. They are more serious because the base of the skull sits near the medulla, which controls breathing, heart rate, and BP. Hives point to an allergic reaction, not a fracture. Pinpoint pupils are not a sign of basilar fracture.", "hook": "Battle behind the ear, raccoon around the eyes, leaks from the nose and ear.", "source": "Prof deck TBI slides 7, 13; Ch 14 p 713 Fig 14.21", "flag": null}, {"id": "W6_010", "topic": "TBI Care and Meds", "difficulty": "Difficult", "type": "mc", "case": null, "adpie": "Planning", "answer": [1], "r1": {"stem": "Lorenzo, a professional pinata tester, has cerebral edema after a TBI. Which medication does the nurse anticipate to lower his ICP?", "options": ["Large boluses of hypotonic IV fluid", "Mannitol", "High dose morphine every hour", "Atropine"]}, "r2": {"stem": "A man who tests pinatas for a living has brain swelling after a head injury. Which drug order would the nurse expect to reduce intracranial pressure?", "options": ["Rapid infusions of a hypotonic solution", "The osmotic diuretic mannitol", "Frequent large doses of morphine", "The anticholinergic atropine"]}, "r3": {"stem": "As the LVN helping plan care for a TBI patient with cerebral edema, which ordered drug do you expect, and what will you monitor after it is given?", "options": ["Hypotonic fluid boluses; monitor for weight gain", "Mannitol; monitor urine output, I and O, and neuro status", "Morphine every hour; monitor for sleepiness", "Atropine; monitor for a slow heart rate"]}, "rationale": "Mannitol is an osmotic diuretic that pulls fluid out of swollen brain tissue into the blood, where the kidneys excrete it. It acts within about 15 minutes and lasts 5 to 6 hours, so expect a large urine output and track I and O and neuro checks. Hypotonic fluid shifts water into brain cells and worsens edema. Large opioid doses depress breathing and mask LOC changes. Atropine is an anticholinergic and does nothing for cerebral edema.", "hook": "Mannitol Mops water out of the brain.", "source": "Prof deck TBI slide 14; ICP deck slide 8; Ch 14 ICP section", "flag": "Dexamethasone for cerebral edema is listed in the professor decks for ICP and TBI, but the textbook ICP section says steroids are no longer standard (higher mortality) and current TBI guidelines advise against them. Mannitol is the safe exam answer for lowering ICP; ask professor."}, {"id": "W6_011", "topic": "TBI Care and Meds", "difficulty": "Intermediate", "type": "sata", "case": null, "adpie": "Implementation", "answer": [0, 1, 3], "r1": {"stem": "Dot, 77, the reigning yo yo champion of her senior center, fell off a step stool and has a moderate TBI. Which nursing measures belong in her plan? Select all that apply.", "options": ["Give the ordered anticonvulsant to prevent seizures", "Treat a fever promptly, since heat raises brain metabolism", "Encourage vigorous coughing every hour", "When she becomes restless, check for a full bladder, pain, or a need to reposition, and report the change", "Suction through her nose every 2 hours"]}, "r2": {"stem": "A yo yo champion in her seventies has a head injury after a fall. Which interventions fit her care? Select all that apply.", "options": ["Administer the prescribed seizure prevention medication", "Bring down an elevated temperature quickly because fever increases the brain's workload", "Have her cough forcefully every hour", "Look for a distended bladder, pain, or positioning needs when she grows restless, and report it", "Perform nasal suctioning every 2 hours"]}, "r3": {"stem": "As the LVN caring for a patient with a TBI, which actions are within your scope and appropriate? Select all that apply.", "options": ["Give the scheduled anticonvulsant as ordered", "Apply ordered cooling measures and antipyretics for a fever, and report the temperature", "Teach her to cough hard to clear her lungs", "Respond to new restlessness by checking bladder, pain, and position, then report it to the RN", "Clear secretions with scheduled nasal suctioning"]}, "rationale": "Anticonvulsants are given to prevent seizures after TBI. Fever must be controlled because hyperthermia increases brain metabolism and worsens brain damage. Restlessness can mean she needs a position change, has pain, or has a full bladder, but it can also signal rising ICP, so check the simple causes and report it. Coughing raises ICP, so instruct her to avoid it, and never suction through the nose after a head injury because a skull fracture is possible. For pain, the goal is an analgesic that does not depress breathing or hide LOC changes.", "hook": "TBI care: no seizures, no fever, no coughing, no nose suction.", "source": "Prof deck TBI slides 14 to 16; Ch 14 p 713", "flag": "Codeine is taught for TBI pain as an analgesic that does not depress breathing, but the textbook ICP rule says to AVOID opioids and drugs that depress respirations, since they can also mask LOC changes. Hold for professor; on the exam pick the option that protects breathing and neuro checks."}, {"id": "W6_012", "topic": "TBI Care and Meds", "difficulty": "Intermediate", "type": "mc", "case": null, "adpie": "Evaluation", "answer": [2], "r1": {"stem": "Chad, 22, was filming a skateboard trick for his followers and got a mild head injury. He is going home with his roommate. Which statement by the roommate shows the teaching worked?", "options": ["I will let him sleep all day and not bother him", "A worse headache is normal, so I will just give him more pain pills", "I will bring him back if he gets harder to wake, vomits, has a worsening headache, or has a seizure", "If his pulse gets slower, that just means he is relaxing"]}, "r2": {"stem": "Which comment from the roommate of a young skateboarder discharged after a mild head injury shows correct understanding?", "options": ["He can sleep as long as he wants without anyone checking on him", "Headaches that keep getting stronger are expected, so I will add more medicine", "I will take him back for increasing sleepiness, vomiting, a headache that keeps getting worse, or a seizure", "A slowing heart rate just means he is calm"]}, "r3": {"stem": "As the LVN reinforcing discharge teaching after a mild head injury, which caregiver statement shows the teaching was effective?", "options": ["I don't need to wake him or check on him tonight", "If his headache worsens, I will double his pain medicine", "I will get him seen for more drowsiness, vomiting, a worsening headache or stiff neck, seizures, or blurred vision", "A slower pulse is a good sign he is resting well"]}, "rationale": "After a mild head injury, the caregiver reports increasing drowsiness, nausea or vomiting, a worsening headache or stiff neck, seizures, blurred vision, behavior or motor changes, and a decreasing heart rate. These signal rising ICP or a delayed bleed. Letting him sleep with no checks could miss a decline in LOC, the earliest warning sign. A worsening headache needs evaluation, not more pills, and a slowing pulse can be a sign of increased ICP rather than relaxation.", "hook": "Home after a bump: sleepy, vomiting, worse headache, seizure, slow pulse = come back.", "source": "Ch 14 TBI home teaching (textbook notes p 31)", "flag": null}, {"id": "W6_013", "topic": "SCI Basics", "difficulty": "Basic", "type": "mc", "case": null, "adpie": "Implementation", "answer": [1], "r1": {"stem": "Chester, a self described backyard wrestling legend, jumped off a shed roof toward a kiddie pool and missed. He has neck pain and cannot feel his legs. You are first on the scene. What do you do?", "options": ["Help him sit up slowly to see if he can stand", "Keep him still with his head and neck in neutral alignment until EMS arrives", "Turn his head to the side so he can wave to his fans", "Tilt his head back and have him look up to check his neck"]}, "r2": {"stem": "A backyard wrestler landed on his head after leaping from a shed and reports neck pain and numb legs. What is the correct first aid?", "options": ["Assist him to a sitting position and try standing", "Hold him still with the head and neck neutral and wait for EMS", "Rotate his head toward the crowd", "Extend his neck by tilting the head back"]}, "r3": {"stem": "As an off duty LVN, you see a man fall from a roof; he has neck pain and no feeling in his legs. What is your priority action?", "options": ["Move him to a chair so he is more comfortable", "Prevent any movement, keeping the head neutral with no flexion, rotation, or extension, and assess his breathing", "Turn his head to one side in case he vomits", "Extend his neck to feel for a deformity"]}, "rationale": "Improper movement after a spinal injury can turn a partial injury into a permanent one, so do NOT move the patient unless there is immediate danger. Keep the head NEUTRAL: no flexion (chin to chest), no rotation (side to side), and no extension (looking up), and do not twist the body. Assess the breathing pattern, since a cervical injury can affect the diaphragm. Sitting him up, turning his head, or extending his neck can all damage the cord further.", "hook": "KEEP THE HEAD NEUTRAL. No nod, no turn, no look up.", "source": "Prof deck TBI slide 20; Ch 14 p 713 (assume a neck injury)", "flag": "One slide line says to keep the head in 'an extended position', which conflicts with the same slide's 'prevent extension' and 'keep the head neutral'. Exam answer: neutral alignment."}, {"id": "W6_014", "topic": "SCI Basics", "difficulty": "Basic", "type": "sata", "case": null, "adpie": "Assessment", "answer": [0, 1, 2], "r1": {"stem": "The rehab unit is hosting trivia night, and the prize is a pudding cup. Which statements about spinal cord injury terms are correct? Select all that apply.", "options": ["Complete injury: all motor and sensory function below the level is lost", "Incomplete injury: some motor or sensory function remains below the level", "Tetraplegia: a cervical injury affecting all four limbs", "Paraplegia: a cervical injury affecting only the arms", "Hemiplegia: weakness of both legs from a lumbar injury"]}, "r2": {"stem": "Which definitions of spinal cord injury terms are accurate? Select all that apply.", "options": ["Complete: nothing gets through, so all movement and feeling below the injury are gone", "Incomplete: something gets through, so some movement or feeling below the injury remains", "Tetraplegia: injury to a neck segment involving all four extremities", "Paraplegia: neck injury that paralyzes only the upper extremities", "Hemiplegia: lumbar injury causing weakness in both legs"]}, "r3": {"stem": "As the LVN reinforcing teaching with a newly injured patient's family, which explanations are accurate? Select all that apply.", "options": ["With a complete injury, all movement and feeling below the injury level are lost", "With an incomplete injury, some movement or feeling below the level remains", "A cervical injury causes tetraplegia, which affects the arms and the legs", "Paraplegia comes from a cervical injury and affects only the arms", "Hemiplegia means both legs are weak from a low back injury"]}, "rationale": "Complete injury (total transection) means NOTHING gets through: all motor and sensory function below the level is lost. Incomplete injury (partial transection) means SOMETHING gets through. Tetraplegia (tetra = 4) comes from a cervical injury and affects all four limbs. Paraplegia (para = 2) comes from thoracic, lumbar, or sacral lesions and affects the legs. Hemiplegia is one side of the body, which should make you think stroke.", "hook": "Tetra = 4 limbs, neck injury. Para = 2 legs, lower injury. Hemi = half, think stroke.", "source": "Prof deck TBI slides 18 to 19, 26; Ch 14 p 714", "flag": null}, {"id": "W6_015", "topic": "SCI Levels", "difficulty": "Difficult", "type": "mc", "case": null, "adpie": "Planning", "answer": [2], "r1": {"stem": "You have four patients with spinal cord injuries on your unit. Which one gets the FIRST respiratory assessment?", "options": ["A T10 injury who uses a manual wheelchair", "An L3 injury who walks with short leg braces", "A new C4 injury who can only shrug his shoulders", "A C6 injury who can bend her elbows and extend her wrists"]}, "r2": {"stem": "Of these four SCI patients, whose breathing does the nurse check first?", "options": ["Thoracic 10 injury who propels a manual chair", "Lumbar 3 injury who ambulates with short braces", "Newly injured at C4 and able to shrug but nothing more", "C6 injury with elbow flexion and wrist extension"]}, "r3": {"stem": "As the LVN receiving report on four SCI patients, which patient do you see first, ready to report any breathing change to the RN at once?", "options": ["The T10 patient transferring to a manual wheelchair", "The L3 patient practicing with leg braces and canes", "The patient with a fresh C4 injury who can shrug his shoulders", "The C6 patient working on wrist extension in therapy"]}, "rationale": "C3, C4, and C5 keep the diaphragm alive, so a C4 injury puts breathing at risk: think AIRWAY first, with a possible need for a ventilator. A C4 patient can shrug the shoulders but has paralysis of the arms, hands, trunk, and legs. A C6 patient breathes and speaks without a ventilator. Thoracic and lumbar injuries leave the diaphragm working, so they are a lower priority for breathing.", "hook": "C3, 4, 5 keep the diaphragm alive.", "source": "Prof deck TBI slides 27, 29, 37; Table 14.8 p 715", "flag": "C4: one slide says loss of diaphragm function with a possible ventilator, while Table 14.8 says C4 MAY breathe without a ventilator (and C3, C4, C5 keep the diaphragm alive). Safe exam answer: C4 = airway and breathing priority, may need a ventilator; do not memorize C4 as the most common SCI until confirmed (flag N5)."}, {"id": "W6_016", "topic": "SCI Levels", "difficulty": "Difficult", "type": "sata", "case": null, "adpie": "Planning", "answer": [0, 1, 2], "r1": {"stem": "The rehab team is building a 'Level Up' board game for patients. Which pairings of injury level and expected function belong on the game cards? Select all that apply.", "options": ["C1 to C3: no independent breathing; needs a ventilator", "C5: can feed self after setup with adaptive equipment", "C6: can assist with transfers and drive an adapted van", "T7 to T12: can climb stairs using crutches", "L3 to L4: needs a 24 hour attendant"]}, "r2": {"stem": "Which matches between spinal cord injury level and expected ability are correct? Select all that apply.", "options": ["C1 to C3: cannot breathe alone and relies on a ventilator", "C5: eats independently once the meal and equipment are set up", "C6: helps with transfers and can operate a modified van", "T7 to T12: goes up stairs with crutches", "L3 to L4: requires an attendant around the clock"]}, "r3": {"stem": "As the LVN helping the rehab team set realistic goals, which level and ability matches are accurate? Select all that apply.", "options": ["C1 to C3: plan for a portable ventilator and a 24 hour attendant", "C5: plan for self feeding with setup and adaptive equipment", "C6: plan for assisted transfers and driving an adapted van", "T7 to T12: plan for independent stair climbing with crutches", "L3 to L4: plan for a full time attendant"]}, "rationale": "From Table 14.8: C1 to C3 has no diaphragm function, so the patient needs a portable ventilator and a 24 hour attendant. C5 has partial shoulder, biceps, and gross elbow movement and can feed self with setup, but cannot use the hands. C6 adds wrist extension and a weak thumb grasp, so the patient can assist with transfers and drive an adapted van. T7 to T12 patients can stand with full leg braces and use crutches but CANNOT climb stairs. L3 to L4 patients are independent with short leg braces and canes.", "hook": "Higher injury = more function lost. C6 = Can drive (adapted van).", "source": "Table 14.8 p 715; prof deck TBI slide 29; idea from test bank AHN14_MC18", "flag": null}, {"id": "W6_017", "topic": "SCI Basics", "difficulty": "Intermediate", "type": "mc", "case": null, "adpie": "Evaluation", "answer": [0], "r1": {"stem": "Hank, a rodeo barrel racer, has a new T8 injury with flaccid legs, no reflexes below the injury, and a BP of 84/50. His wife asks if this is permanent. Which finding would tell the nurse his spinal shock is RESOLVING?", "options": ["His patellar reflex returns", "His BP drops further", "His legs remain flaccid with no reflexes", "His loss of sensation moves higher up his body"]}, "r2": {"stem": "Which change shows that a patient's spinal shock is ending?", "options": ["The knee jerk reflex comes back", "The blood pressure falls even lower", "The legs stay limp without any reflexes", "Numbness spreads upward on the body"]}, "r3": {"stem": "As the LVN monitoring a patient in spinal shock after a T8 injury, which finding do you report to the RN as a sign that spinal shock is resolving?", "options": ["A patellar reflex can now be elicited", "Systolic BP has dropped another 10 points", "Flaccid paralysis and areflexia continue below T8", "The level of numbness has risen toward his chest"]}, "rationale": "Spinal shock (areflexia) is the early period of flaccid paralysis and complete loss of reflexes below the injury, with loss of sensory and autonomic function too. Loss of sympathetic tone causes vasodilation and HYPOTENSION. It is temporary, lasting days to weeks, so it is not by itself proof of permanent paralysis. The return of reflexes, such as the patellar reflex, means it is resolving. Falling BP, ongoing flaccidity, or a rising level of sensory loss means it is not improving.", "hook": "Spinal shock = Shut down (flaccid, no reflexes, low BP). Reflexes back = shock lifting.", "source": "Prof deck TBI slide 21; idea from test bank AHN14_MC19", "flag": null}, {"id": "W6_018", "topic": "Autonomic Dysreflexia", "difficulty": "Basic", "type": "mc", "case": "W6_CASE2", "adpie": "Implementation", "answer": [1], "r1": {"stem": "What is your FIRST action for Ms. Ortega?", "options": ["Lay her flat and raise her legs", "Sit her upright, unless contraindicated", "Give her scheduled oral BP pill and recheck in an hour", "Leave the room to call the provider before doing anything else"]}, "r2": {"stem": "Which action does the nurse take first for Ms. Ortega?", "options": ["Place her supine with her legs elevated", "Raise her to a sitting position if not contraindicated", "Give her routine antihypertensive tablet and check BP in 60 minutes", "Step out to phone the provider first"]}, "r3": {"stem": "As the LVN first at Ms. Ortega's bedside, what do you do FIRST?", "options": ["Lower the head of the bed flat and elevate her legs", "Sit her straight up (unless contraindicated) to lower her BP, stay with her, and call for help", "Give her daily BP medication and recheck in an hour", "Leave her alone to page the provider"]}, "rationale": "This is AUTONOMIC DYSREFLEXIA: an injury at T6 or higher, a trigger below the injury, and a massive sympathetic response with severe hypertension (systolic up to 300 mm Hg), a pounding headache, and bradycardia. The first step is to SIT HER UP, which pools blood in the legs and lowers BP quickly. Lying flat with the legs raised sends more blood toward the head and makes it worse. Waiting an hour risks stroke, seizures, blindness, or death, and you should stay with her and call for help while you act.", "hook": "Dysreflexia: SIT UP first, then hunt the trigger.", "source": "Box 14.4 p 716; prof deck TBI slides 23 to 25; Ch 14 review question 11; idea from test bank AHN14_MC20", "flag": null}, {"id": "W6_019", "topic": "Autonomic Dysreflexia", "difficulty": "Difficult", "type": "mc", "case": "W6_CASE2", "adpie": "Implementation", "answer": [0], "r1": {"stem": "Ms. Ortega is now sitting up, and her BP is still 200/116 mm Hg. What is your NEXT action?", "options": ["Check her catheter tubing for kinks or blockage", "Do a digital rectal check for impaction", "Send a urine sample for culture", "Give a vasodilator such as nitroprusside"]}, "r2": {"stem": "Ms. Ortega is upright, and her BP remains very high. What should the nurse do next?", "options": ["Inspect the urinary catheter and tubing for kinks or occlusion", "Examine the rectum for stool", "Collect urine for a culture", "Administer nitroprusside"]}, "r3": {"stem": "As the LVN, Ms. Ortega is upright, but her BP is still dangerously high. Following Box 14.4, which action do you take NEXT?", "options": ["Check the catheter for kinks and patency, and if it is blocked, get a new catheter inserted right away", "Check for fecal impaction using anesthetic ointment", "Obtain a urine culture to look for infection", "Give an IV vasodilator"]}, "rationale": "Box 14.4 order: sit the patient up, check the catheter for kinks or occlusion (insert a new one immediately if it is blocked), check the rectum for impaction using anesthetic ointment, give a ganglionic blocker or vasodilator as ordered if conservative steps fail, keep monitoring BP, and send a urine culture if no other cause is found. A distended bladder is the most common trigger, so the catheter comes before the rectum. Medications are used only when removing the trigger does not work. A culture does nothing to lower the BP right now.", "hook": "Sit up, Bladder, Bowel, then Drugs.", "source": "Box 14.4 p 716; prof deck TBI slide 24", "flag": null}, {"id": "W6_020", "topic": "Autonomic Dysreflexia", "difficulty": "Intermediate", "type": "sata", "case": "W6_CASE2", "adpie": "Assessment", "answer": [0, 1, 2, 4], "r1": {"stem": "Which findings fit Ms. Ortega's autonomic dysreflexia? Select all that apply.", "options": ["Bradycardia", "Nasal stuffiness", "Goose flesh below the injury", "Severe hypotension", "Flushing and sweating above the injury", "Warm, flushed, sweaty legs"]}, "r2": {"stem": "Which signs would the nurse expect during this episode? Select all that apply.", "options": ["A slow pulse", "A stuffy nose", "Goose bumps below the level of injury", "A very low blood pressure", "Red, sweaty skin above the injury", "Warm, red, damp skin on the legs"]}, "r3": {"stem": "As the LVN collecting data during Ms. Ortega's episode, which findings do you expect and report to the RN? Select all that apply.", "options": ["Heart rate below 60", "Congested nose", "Piloerection on the skin below T4", "Systolic pressure in the 70s", "Flushed, diaphoretic face and neck", "Warm, pink, sweaty lower legs"]}, "rationale": "Autonomic dysreflexia causes severe HYPERtension, a pounding headache, and BRADYCARDIA, because baroreceptors fire the vagus nerve to slow the heart. Above the injury, vessels dilate, so the face flushes and sweats, and she may have nasal stuffiness, blurred vision, and dilated pupils. Below the injury, vessels stay clamped down, so the skin is pale and cool with goose flesh. Hypotension belongs to spinal shock, not dysreflexia.", "hook": "Above: red, wet, pounding head. Below: pale, cool, goose bumps.", "source": "Prof deck TBI slide 23; Ch 14 Fig 14.23", "flag": "One slide line reads 'sweating (pale extremities below)', which can be misread as sweating below the injury. Standard teaching and Fig 14.23: flushing AND sweating ABOVE the injury; pale, cool skin and goose flesh BELOW. Pick above; ask professor."}, {"id": "W6_021", "topic": "Autonomic Dysreflexia", "difficulty": "Intermediate", "type": "mc", "case": "W6_CASE2", "adpie": "Evaluation", "answer": [3], "r1": {"stem": "After the episode resolves, the nurse reinforces teaching. Which statement by Ms. Ortega shows understanding?", "options": ["This only happens in the first few weeks after a spinal injury", "When my head pounds, I should lie flat until it passes", "Since I take a BP pill, a full bladder can't cause this", "If my head pounds and my face flushes, I'll sit up and get my bladder and bowels checked right away"]}, "r2": {"stem": "Which comment from Ms. Ortega shows she understood the teaching?", "options": ["This is only a problem right after an injury, so I am past it", "When I get a pounding headache, I will lie down flat", "My blood pressure medicine protects me from a full bladder causing this", "If I get a pounding headache and a flushed face, I will sit up and have my bladder and bowel checked at once"]}, "r3": {"stem": "As the LVN evaluating Ms. Ortega's learning after the RN's teaching, which statement shows the teaching worked?", "options": ["I am years out from my injury, so this won't happen again", "The fix for a pounding head is to lie flat", "My BP pill means I can skip my bladder program", "I know my warning signs; I'll sit up, check my catheter and bowels, and get help fast"]}, "rationale": "Autonomic dysreflexia remains a risk long after the injury for anyone injured at T6 or higher, and patients often learn to recognize their own pattern of signs. The plan is the same every time: sit up, then find and remove the trigger, most often a distended bladder or fecal impaction. Lying flat raises the BP further. A BP pill does not stop a blocked catheter from triggering an episode, so the bladder and bowel programs still matter. It is a medical emergency that needs quick action.", "hook": "Know your signs, sit up, find the trigger.", "source": "Ch 14 pp 714 to 717; Key Points p 719", "flag": null}, {"id": "W6_022", "topic": "SCI Hospital Care", "difficulty": "Intermediate", "type": "mc", "case": null, "adpie": "Planning", "answer": [1], "r1": {"stem": "Duke, a professional stunt double for a cartoon dog, arrives in the ED 3 hours after a fall with a new cervical spinal cord injury. Which order does the nurse anticipate to limit secondary injury to his cord?", "options": ["Baclofen for muscle spasticity", "High dose methylprednisolone", "Bethanechol for urinary retention", "Atropine to dry secretions"]}, "r2": {"stem": "A stunt performer reaches the ED 3 hours after a cervical cord injury. Which drug would the nurse expect to reduce further cord damage?", "options": ["Baclofen to relax spastic muscles", "A high dose of the steroid methylprednisolone", "Bethanechol to help the bladder empty", "Atropine to reduce secretions"]}, "r3": {"stem": "As the LVN helping prepare a patient who arrived 3 hours after an SCI, which drug do you anticipate, and why does the timing matter?", "options": ["Baclofen, because spasticity starts right away", "High dose methylprednisolone, because it is given within 8 hours of injury", "Bethanechol, because retention must be treated in the first hour", "Atropine, because it must be given within 8 hours to dry secretions"]}, "rationale": "If the patient is seen within 8 hours of injury, high dose methylprednisolone may be given to limit secondary cord damage from edema, inflammation, and ischemia. Baclofen and dantrolene treat spasticity, which develops later with upper motor neuron injury. Bethanechol treats urinary retention but does not protect the cord. Atropine is an anticholinergic and has no role in limiting cord swelling.", "hook": "Methylpred within 8: get the steroid in before the cord swells.", "source": "Prof deck TBI slides 36, 40; Ch 14 SCI section", "flag": "High dose methylprednisolone within 8 hours of SCI is the professor and textbook answer, but current neurosurgical guidelines no longer recommend it routinely. Exam answer: within 8 hours."}, {"id": "W6_023", "topic": "SCI Hospital Care", "difficulty": "Intermediate", "type": "sata", "case": null, "adpie": "Implementation", "answer": [0, 2, 4, 5], "r1": {"stem": "Gus, a professional mascot who performs as the Dancing Taco, has a cervical fracture. Which actions are correct for his traction and spine care? Select all that apply.", "options": ["Let Crutchfield tong weights hang freely without resting on the bed or floor", "Use the halo ring as a handle to help turn him", "Keep the halo wrench available at all times for emergencies", "Let him take a quick daily shower in the halo vest", "Log roll him to reposition after spinal fusion surgery", "Keep the vest lining dry and assess the skin around the pins"]}, "r2": {"stem": "A man who dances as a taco mascot has a neck fracture. Which traction and spine care actions are appropriate? Select all that apply.", "options": ["Make sure skull tong weights dangle freely and never rest on anything", "Grab the halo frame to turn him in bed", "Keep the wrench for the halo within reach for emergencies", "Allow a brief shower each day while he wears the vest", "Turn him as one unit with a log roll after his fusion", "Keep the vest padding dry and clean and inspect the pin sites"]}, "r3": {"stem": "As the LVN caring for patients in cervical traction, which actions are within your scope and correct? Select all that apply.", "options": ["Check that tong weights hang free and ropes sit in the pulleys", "Lift the patient up in bed using the halo ring", "Confirm the halo wrench is at the bedside for emergencies", "Help him shower daily with the vest on", "Use a log roll with help when repositioning after spinal fusion", "Keep the vest lining dry and do pin site care as ordered"]}, "rationale": "Crutchfield tongs use weights for traction with the body as counter traction, so the weights must hang freely and the ropes must stay in the pulleys. NEVER turn or lift a patient by the halo device. Keep a wrench available for emergencies, report loose vest or ring bolts, keep the vest lining dry (no showers), and clean and assess the pin sites. After a laminectomy or spinal fusion, reposition by LOG ROLLING so the spine moves as one unit.", "hook": "Halo rules: not a handle, no shower, wrench close by.", "source": "Prof deck TBI slides 40 to 42", "flag": null}, {"id": "W6_024", "topic": "SCI Hospital Care", "difficulty": "Intermediate", "type": "sata", "case": null, "adpie": "Planning", "answer": [0, 1, 2], "r1": {"stem": "Vince, a former competitive cup stacker, has paraplegia from a T10 injury. Which bladder and bowel plan items are correct? Select all that apply.", "options": ["Start intermittent catheterization as early as possible", "Encourage fluids of 3000 to 4000 mL per day unless restricted", "Give a bisacodyl suppository every other night, followed by digital stimulation", "Limit fluids to 1000 mL per day to prevent accidents", "Keep an indwelling catheter long term because it has the lowest infection risk"]}, "r2": {"stem": "A cup stacking champion with T10 paraplegia needs a bladder and bowel program. Which plan items are appropriate? Select all that apply.", "options": ["Begin intermittent cathing as soon as possible", "Promote an intake of 3000 to 4000 mL of fluid daily unless restricted", "Use a bisacodyl suppository every second night, then digital stimulation", "Restrict fluids to 1000 mL daily to avoid incontinence", "Leave a Foley in place for good, since it causes the fewest infections"]}, "r3": {"stem": "As the LVN helping plan Vince's bladder and bowel program, which items do you support? Select all that apply.", "options": ["Move to intermittent catheterization early to preserve bladder tone", "Push fluids to 3000 to 4000 mL a day if not restricted, and palpate for distention", "Bisacodyl suppository every other night, then digital stimulation", "Cap his fluids at 1000 mL a day", "Keep a chronic indwelling catheter as the safest option"]}, "rationale": "An indwelling catheter is used first, but CHRONIC indwelling catheters raise infection risk, so intermittent catheterization starts as early as possible to keep bladder tone. High fluid intake (3000 to 4000 mL per day) helps prevent UTIs and constipation. The bowel program is a bisacodyl suppository every other night, then digital stimulation, with the goal of eventually stopping the suppositories. Restricting fluids invites UTIs and constipation, and urinary and respiratory infections are leading causes of death after SCI. The bladder can distend without the patient feeling it, so palpate it and track I and O.", "hook": "SCI bladder and bowel: cath early, fluids high, suppository every other night.", "source": "Ch 14 pp 716 to 717 (SCI bladder and bowel); prof deck TBI slides 30, 38", "flag": "A slide says that below S2 and S3 the bladder contracts but does not empty. Standard teaching: injury ABOVE the sacral micturition center (S2 to S4) gives a reflex bladder that empties incompletely, and injury AT the center gives a flaccid bladder. Hold for professor."}, {"id": "W6_025", "topic": "SCI Hospital Care", "difficulty": "Basic", "type": "mc", "case": null, "adpie": "Diagnosis", "answer": [2], "r1": {"stem": "Nadine, a retired synchronized swimmer with a cervical SCI, coughs and chokes during meals because of dysphagia. Which complication is the MOST serious risk?", "options": ["Fecal impaction", "Weight loss over the next month", "Aspiration pneumonia", "A pressure injury on her sacrum"]}, "r2": {"stem": "A former synchronized swimmer with a neck level cord injury has trouble swallowing and chokes at meals. Which complication is most dangerous?", "options": ["Hard, impacted stool", "Gradual weight loss", "Pneumonia from aspirated food or fluid", "Skin breakdown over the sacrum"]}, "r3": {"stem": "As the LVN observing Nadine choke during lunch, which risk do you identify as the priority problem to report to the RN?", "options": ["Constipation leading to impaction", "Poor nutrition over the coming weeks", "Aspiration leading to pneumonia", "A sacral pressure injury"]}, "rationale": "Aspiration pneumonia is the most immediately life threatening risk when a patient cannot swallow safely, and respiratory infections are a leading cause of death after SCI. Poor nutrition, constipation, and skin breakdown are real concerns, but they develop more slowly. Report choking or coughing with meals so the team can adjust the diet and positioning. Keep her upright for meals and watch her lung sounds and temperature.", "hook": "Choking at meals = think lungs first.", "source": "Ch 14 p 717; idea from EAQ14_15", "flag": null}, {"id": "W6_026", "topic": "Unconscious Patient", "difficulty": "Intermediate", "type": "mc", "case": null, "adpie": "Implementation", "answer": [1], "r1": {"stem": "Earl, 66, holds three trophies for competitive napping, but today he is truly unconscious from a brain infection. Which nursing action is correct?", "options": ["Offer sips of water to test his swallow", "Place him in semi Fowler position and keep him NPO until consciousness returns", "Reposition him every 8 hours so he can rest", "Keep him flat on his back at all times"]}, "r2": {"stem": "A man who is unresponsive from a brain infection is in your care. Which action is appropriate?", "options": ["Give small sips of water to check swallowing", "Raise the head of the bed to semi Fowler and keep him NPO until he is awake", "Turn him every 8 hours to avoid disturbing him", "Keep him supine and flat around the clock"]}, "r3": {"stem": "As the LVN caring for an unconscious patient, which action within your scope best protects his airway?", "options": ["Test his gag by offering a little water", "Keep him in semi Fowler position, NPO, with suction ready, and turn him every 2 hours", "Turn him once a shift to let him sleep", "Keep the bed completely flat"]}, "rationale": "An unconscious patient cannot protect his own airway, so airway comes first. Semi Fowler position reduces aspiration and helps the lungs expand. Keep him NPO until consciousness returns and meet nutrition needs with IV or enteral feedings. Reposition every 2 hours to protect the skin, and do ROM exercises. Fluids by mouth invite aspiration, and lying flat raises aspiration risk.", "hook": "Unconscious = cannot guard the airway. Head up, nothing by mouth.", "source": "Prof deck TBI slides 43 to 44", "flag": null}, {"id": "W6_027", "topic": "Unconscious Patient", "difficulty": "Basic", "type": "mc", "case": null, "adpie": "Assessment", "answer": [2], "r1": {"stem": "Mr. Pemberton, a professional mattress tester, is unconscious after a fall from a display bunk bed. Which tool does the nurse use to track his level of consciousness?", "options": ["Braden scale", "Morse fall scale", "Glasgow Coma Scale", "Snellen chart"]}, "r2": {"stem": "Which tool best measures and trends the LOC of an unconscious patient?", "options": ["The Braden pressure injury tool", "The Morse fall risk tool", "The Glasgow Coma Scale", "The Snellen eye chart"]}, "r3": {"stem": "As the LVN doing neuro checks on an unconscious patient, which tool do you use, and which change do you report to the RN?", "options": ["Braden scale; report a score change once a week", "Morse scale; report any new fall risk", "Glasgow Coma Scale; report any drop in the score", "Snellen chart; report reduced visual acuity"]}, "rationale": "The Glasgow Coma Scale is the key tool for LOC, scoring eye opening (E4), verbal response (V5), and motor response (M6). A score of 15 is normal, 3 is the lowest, and 8 or less means coma. Track the trend: a falling score is a change in LOC, the earliest sign of rising ICP, and must be reported. Braden measures pressure injury risk, Morse measures fall risk, and Snellen tests visual acuity.", "hook": "GCS: 15 best, 3 worst, 8 or less = intubate and worry.", "source": "Prof deck TBI slide 43; Ch 14 GCS", "flag": null}, {"id": "W6_028", "topic": "Brain Tumor", "difficulty": "Intermediate", "type": "mc", "case": null, "adpie": "Assessment", "answer": [0], "r1": {"stem": "Phyllis, a semi retired fortune teller, admits, 'I did not see this coming.' She has been having headaches and is being worked up for a brain tumor. Which headache pattern is typical of a brain tumor?", "options": ["Worse in the morning, often with dizziness or loss of balance", "Only after eating spicy food", "Completely relieved by lying flat all day", "Clusters of stabbing pain around one eye at night"]}, "r2": {"stem": "A fortune teller who did not predict her own diagnosis has headaches from a suspected brain tumor. Which headache pattern is most typical?", "options": ["Strongest on waking, often with dizziness or poor balance", "Triggered only by spicy meals", "Gone entirely with bed rest lying flat", "Nighttime bursts of pain around one eye"]}, "r3": {"stem": "As the LVN collecting data on a patient with a suspected brain tumor, which finding do you expect and report to the RN?", "options": ["Morning headaches with dizziness or balance problems", "Headaches that happen only after spicy food", "Headaches that disappear with bed rest", "Clustered headaches around one eye"]}, "rationale": "Headache
