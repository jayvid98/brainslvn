": "Which statement about giving donepezil is accurate?", "options": ["A morning dose that reverses the disease", "An evening dose at bedtime, with heart rate checks for a slow pulse", "Hold it for a fast pulse, since it speeds the heart", "Daily liver labs are needed because it causes liver failure"]}, "r3": {"stem": "As the LVN giving medications to Mrs. Honeycutt, which action with donepezil is correct?", "options": ["Give it at breakfast and tell the family it will stop the disease", "Give it at bedtime, check her pulse first, and report a slow rate", "Hold it whenever her pulse is over 100", "Draw liver labs daily before each dose"]}, "rationale": "Donepezil inhibits acetylcholinesterase and may temporarily lessen Alzheimer symptoms, but it does NOT change the course of the disease. Give it in the evening just before bed, with or without food. It can cause BRADYCARDIA, so monitor heart rate. Weekly liver enzyme checks belong to tacrine, not donepezil, and a fast pulse is not its typical problem.", "hook": "Donepezil: Doze at bedtime, Down goes the pulse.", "source": "AHN Ch 14 Table 14.7 p 690 to 691; p 694", "flag": null}, {"id": "W4_035", "topic": "Myasthenia Gravis", "difficulty": "Intermediate", "type": "mc", "case": null, "adpie": "Assessment", "answer": [2], "r1": {"stem": "Ms. Winifred Larkspur, a church choir soprano with myasthenia gravis, has a cold. Her voice fades as she talks, her eyelids droop, and she says it is harder to take a deep breath. Which finding is the PRIORITY?", "options": ["Drooping eyelids", "Fading, nasal voice", "Difficulty taking a deep breath", "Double vision"]}, "r2": {"stem": "In a patient with myasthenia gravis and a respiratory infection, which finding needs attention first?", "options": ["Ptosis", "A voice that weakens as she speaks", "Shortness of breath and trouble breathing deeply", "Diplopia"]}, "r3": {"stem": "As the LVN, which finding in Ms. Larkspur do you report to the RN immediately as a possible myasthenic crisis?", "options": ["Her eyelids droop more in the evening", "Her voice fades by the end of a hymn", "She says she can't take a deep breath, and her vital capacity is dropping", "She sees double when reading the hymnal"]}, "rationale": "In myasthenia gravis, antibodies attack acetylcholine receptors at the neuromuscular junction, causing weakness that worsens with activity. Weakness of the DIAPHRAGM is the most dangerous complication because it threatens breathing and may require a ventilator. Infection, stress, and surgery can trigger myasthenic crisis, so monitor vital capacity and tidal volume. Ptosis, diplopia, and a fading voice are classic signs but are not life threatening.", "hook": "MG: airway beats eyelids.", "source": "AHN Ch 14 p 695 to 696; EAQ14_11 idea", "flag": null}, {"id": "W4_036", "topic": "Myasthenia Gravis", "difficulty": "Basic", "type": "mc", "case": null, "adpie": "Evaluation", "answer": [1], "r1": {"stem": "Ms. Larkspur takes pyridostigmine (Mestinon). Which statement shows she understands her medication?", "options": ["'I'll take it right after I finish eating.'", "'I'll take it exactly on time, before meals, so I can chew and swallow better.'", "'I'll skip doses on days I feel strong.'", "'I'll take it whenever I remember, since timing doesn't matter.'"]}, "r2": {"stem": "Which statement about pyridostigmine shows correct understanding?", "options": ["'I take it after my meals.'", "'I take it on schedule, before eating, to help my chewing and swallowing.'", "'I leave it out when I feel good.'", "'The timing of my doses isn't important.'"]}, "r3": {"stem": "As the LVN reinforcing teaching on pyridostigmine, which statement would you document as correct understanding?", "options": ["'I'll take it once dinner is done.'", "'I set phone alarms so I take it on time, before I eat.'", "'If I feel strong, I'll skip a dose.'", "'Whenever I remember is good enough.'"]}, "rationale": "Pyridostigmine is an anticholinesterase that keeps acetylcholine from being destroyed, so nerve impulses reach the muscles better. It must be taken EXACTLY on time, evenly spaced, and before eating or activity so strength peaks when she needs to chew and swallow. Taking it after meals defeats the purpose, and late or skipped doses can bring on weakness. Watch for bradycardia and increased bronchial secretions, and document her response after each dose.", "hook": "Mestinon on time, before you dine.", "source": "AHN Ch 14 Table 14.7 p 690 to 691; p 696 teaching box; EAQ14_05 idea", "flag": null}, {"id": "W4_037", "topic": "ALS and Huntington", "difficulty": "Intermediate", "type": "mc", "case": null, "adpie": "Implementation", "answer": [1], "r1": {"stem": "Mr. Leopold Finch, a retired crossword puzzle editor, has advanced ALS and can no longer speak clearly. His family talks about him in front of him as if he cannot understand. What should the nurse teach the family?", "options": ["ALS destroys thinking early, so he likely cannot follow conversations", "ALS affects motor neurons but usually leaves the mind intact, so keep including him", "He will regain his speech once riluzole is started", "His muscle twitching means the disease is reversing"]}, "r2": {"stem": "Which fact about ALS should guide how the family communicates with the patient?", "options": ["Cognition is lost early in ALS", "The patient usually stays cognitively intact while motor function declines", "Riluzole will restore lost speech", "Fasciculations are a sign of recovery"]}, "r3": {"stem": "As the LVN, which statement best reinforces the RN's teaching to Mr. Finch's family?", "options": ["'He probably doesn't understand much anymore.'", "'His mind is usually sharp even though his muscles are failing, so talk with him, not about him.'", "'Once the riluzole kicks in, he'll talk again.'", "'The twitching means he is getting better.'"]}, "rationale": "ALS destroys both upper and lower motor neurons, causing weakness, dysarthria, dysphagia, fasciculations, and wasting, but the patient usually stays COGNITIVELY INTACT. Talk with him, not around him, and include him in decisions. Riluzole and edaravone slow or ease symptoms but do not restore function. Respiratory failure and respiratory infection are the main causes of death, and most live 3 to 5 years after diagnosis.", "hook": "ALS: the body fails, the mind stays.", "source": "AHN Ch 14 p 697 (study notes p 23)", "flag": null}, {"id": "W4_038", "topic": "ALS and Huntington", "difficulty": "Difficult", "type": "sata", "case": null, "adpie": "Planning", "answer": [0, 1, 2, 3], "r1": {"stem": "Ms. Marigold Peabody, 42, a former tap dance teacher, has Huntington disease with constant writhing movements. Which statements about her disease and care are correct? Select all that apply.", "options": ["Each of her children has a 50% chance of inheriting the gene", "Her chorea is linked to EXCESS dopamine activity", "She may need 4000 to 5000 calories a day", "Screen her regularly for depression and suicide risk", "A genetic test can tell her children exactly what age symptoms will start", "Her disease is caused by a dopamine deficiency, just like Parkinson disease"]}, "r2": {"stem": "Which facts about Huntington disease should guide care? Select all that apply.", "options": ["It is autosomal dominant, so each child has a 1 in 2 chance", "The chorea results from overactive dopamine", "Calorie needs can reach 4000 to 5000 per day", "Depression and suicide risk are high, so screen often", "Genetic testing predicts the age of onset", "It is a dopamine shortage, the same as Parkinson"]}, "r3": {"stem": "As the LVN helping plan Ms. Peabody's care, which points belong in the plan? Select all that apply.", "options": ["Support a genetic counseling referral, since each child has a 50% risk", "Remember that her movements come from too much dopamine activity", "Offer high calorie snacks to meet needs of 4000 to 5000 calories a day", "Watch for and report signs of depression or talk of suicide", "Tell her kids a gene test will predict exactly when symptoms begin", "Expect her meds to work by boosting dopamine, like in Parkinson"]}, "rationale": "Huntington disease is autosomal dominant, so each child has a 50% risk, and onset is usually between 30 and 50. It involves the basal ganglia like Parkinson, but with EXCESS dopamine, so symptoms are the opposite: chorea, or writhing and twisting. Constant movement means needs of 4000 to 5000 calories a day, and aspiration and malnutrition are risks. Depression and suicide risk are high. Genetic testing shows carrier status but cannot predict onset.", "hook": "Huntington = Hyper dopamine, Hungry (4000 to 5000 cal), Half the kids at risk.", "source": "AHN Ch 14 p 697 to 698 (study notes p 23)", "flag": null}, {"id": "W4_039", "topic": "Aging and Health Promotion", "difficulty": "Basic", "type": "mc", "case": null, "adpie": "Assessment", "answer": [1], "r1": {"stem": "Mr. Ezekiel Bloom, 81, worries that because it takes him longer to learn his new smartphone, he must be 'going senile.' Which response by the nurse is accurate?", "options": ["'Dementia is a normal part of getting older.'", "'Older adults can still learn new things; it just may take more time.'", "'Long term memory fades much faster than short term memory with age.'", "'Once neurons are lost, no kind of dementia can ever be reversed.'"]}, "r2": {"stem": "Which statement about normal neurologic aging is correct?", "options": ["'Senility is expected with age.'", "'Learning slows with age, but older adults can still learn.'", "'Aging hurts long term memory more than short term memory.'", "'No form of dementia can be reversed.'"]}, "r3": {"stem": "As the LVN reinforcing teaching for Mr. Bloom, which statement is accurate to share?", "options": ["'Getting senile is just part of turning 80.'", "'You can absolutely learn the phone; give yourself extra time.'", "'Your old memories will fade before your recent ones.'", "'If it's dementia, nothing can be done to reverse it.'"]}, "rationale": "Normal aging slows learning and reaction time, but older adults can still learn, so allow extra time when teaching. Dementia is NOT an inevitable part of aging. Short term memory declines more than long term memory. Some dementias are reversible, such as those caused by anemia, fluid and electrolyte imbalance, malnutrition, hypothyroidism, drug toxicity, and low BP.", "hook": "Aging is slower, not senile.", "source": "MOD3_AP s44; AHN Ch 14 p 663; EAQ14_12 idea", "flag": null}, {"id": "W4_040", "topic": "Aging and Health Promotion", "difficulty": "Intermediate", "type": "sata", "case": null, "adpie": "Planning", "answer": [0, 1, 2, 3], "r1": {"stem": "The nurse is giving health promotion talks at a skateboard park and a senior center. Which teaching points help prevent neurologic problems? Select all that apply.", "options": ["Wear helmets and seatbelts every time", "Control blood pressure, since hypertension is the most important modifiable stroke risk", "Never dive into shallow water or water of unknown depth", "Get ear and sinus infections treated promptly", "Driving after a couple of drinks is fine if you go slowly", "Smoking only affects the lungs, not the brain"]}, "r2": {"stem": "Which statements belong in teaching to prevent neuro injury and disease? Select all that apply.", "options": ["Use a helmet and buckle up", "Keep blood pressure controlled to lower stroke risk", "Do not dive into shallow or unfamiliar water", "Seek prompt treatment for ear and sinus infections", "Slow driving makes a few drinks safe", "Cigarettes do not raise neurologic risk"]}, "r3": {"stem": "As the LVN helping with the community teaching, which points would you reinforce? Select all that apply.", "options": ["'Helmet on the board, seatbelt in the car.'", "'Know your BP numbers; high BP is the biggest stroke risk you can change.'", "'Feet first into any water you don't know.'", "'Ear or sinus infection? Get it treated so it doesn't spread to the brain.'", "'A couple of beers is fine if you stay under the speed limit.'", "'Smoking has nothing to do with your brain.'"]}, "rationale": "Seatbelts and motorcycle helmets are the most effective survival measures, and preventing crashes is one of the best ways to prevent head injury. Hypertension is the most important modifiable stroke risk factor, and neurovascular risk factors match cardiac ones: high BP, high cholesterol, smoking, obesity, stress, and no exercise. Never dive into shallow or unknown water. Treat ear and sinus infections promptly to prevent meningitis or brain abscess. There is no safe amount of impaired driving.", "hook": "Buckle, helmet, BP, feet first.", "source": "MOD3_AP s45 to 46; AHN Ch 14 p 663 safety alert; stroke p 698", "flag": null}]}, {"week": 5, "title": "Neurological and Sensory Disorders", "tagline": "Cranial nerves, eyeballs, and ear canals: this week we look, listen, and keep our balance.", "cases": {"W5_CASE1": {"title": "Case: Mr. Bellamy, Retired Air Traffic Controller", "text": "Walt Bellamy, 67, spent 30 years spotting planes on a radar screen, but lately he keeps bumping door frames on both sides. He has type 2 diabetes. Tonometry shows an IOP of 28 mm Hg in both eyes, and he is diagnosed with primary open angle glaucoma. He is started on timolol and pilocarpine eye drops."}, "W5_CASE2": {"title": "Case: Mr. Dupree, Polka Accordion Champ", "text": "Gus Dupree, 52, a three time polka accordion champion, had a stomach bug two weeks ago. Now both feet tingle, and over the last day the weakness has climbed to his knees on both sides. He is admitted with suspected Guillain Barre syndrome and keeps asking when he can get back to his squeezebox."}}, "questions": [{"id": "W5_001", "topic": "Guillain Barre Syndrome", "difficulty": "Intermediate", "type": "mc", "case": "W5_CASE2", "adpie": "Assessment", "answer": [2], "r1": {"stem": "Mr. Dupree, the polka accordion champ, is in his first day of admission for Guillain Barre syndrome. Which finding needs to be reported FIRST?", "options": ["Mild weakness in both ankles", "Tingling in both feet that he calls 'super annoying'", "Shallow breathing and a weaker cough than he had this morning", "Asking his daughter to bring his accordion from home"]}, "r2": {"stem": "Which of these findings in Mr. Dupree is the highest priority to report?", "options": ["Slight bilateral ankle weakness", "Pins and needles feeling in the soles of both feet", "Breaths getting shallower with a cough that is losing strength", "Requesting that his squeezebox be brought to the hospital"]}, "r3": {"stem": "As the LVN collecting data at the start of your shift, which change in Mr. Dupree do you report to the RN right away?", "options": ["Both ankles slightly weaker than his wrists", "Bilateral foot numbness and tingling, unchanged from admission", "Respirations that are now shallow, with a noticeably weak cough", "He wants to practice accordion fingering on his tray table"]}, "rationale": "GBS paralysis climbs upward, and once it reaches the intercostal muscles the patient can go into respiratory failure and need a ventilator. That is why respiratory function is the top priority, and shallow breathing with a weakening cough must be reported right away. Tingling in the feet and mild ankle weakness are the expected early findings because the legs are hit first. Wanting his accordion is a normal, healthy request, not a clinical change. In GBS, think airway and breathing before anything else.", "hook": "GBS = Goes Bottom to Sky. When it reaches the ribs, watch the breathing.", "source": "Prof deck CPN slides 3 to 9; Ch 14 p 706 to 707; tb AHN14_MC34 idea", "flag": null}, {"id": "W5_002", "topic": "Guillain Barre Syndrome", "difficulty": "Basic", "type": "mc", "case": "W5_CASE2", "adpie": "Diagnosis", "answer": [1], "r1": {"stem": "Mr. Dupree's wife asks how Guillain Barre syndrome usually moves through the body. Which description is accurate?", "options": ["It starts in the face and works its way down to the feet", "It starts in the feet, climbs upward on both sides, and recovery comes back down in reverse", "It affects only one side of the body, like a stroke", "Weakness is worst at the end of the day and improves with rest"]}, "r2": {"stem": "Which statement correctly describes the usual pattern of GBS weakness?", "options": ["Weakness begins at the head and travels downward toward the legs", "Weakness begins in the legs, rises symmetrically, and recovery returns from the top down", "Weakness stays on one side of the body", "Muscles get weaker with use and recover after rest"]}, "r3": {"stem": "As the LVN reinforcing the RN's teaching, which explanation of GBS progression do you give Mr. Dupree's family?", "options": ["'The paralysis begins at his face and moves down his body.'", "'It starts at his feet, rises evenly on both sides, and when he recovers it comes back in reverse, top to bottom.'", "'It will stay on one side, so his other side will compensate.'", "'He will be weakest in the evening and stronger after a nap.'"]}, "rationale": "GBS is an autoimmune attack on the Schwann cells of the PERIPHERAL nerves, causing demyelination. It begins in the legs and feet (the longest nerves), is symmetrical, and ascends; recovery happens in reverse, moving downward. It often follows a viral respiratory or GI infection, and a lumbar puncture shows ELEVATED protein in the CSF. One sided weakness fits a stroke, and weakness that worsens with activity and improves with rest describes myasthenia gravis, not GBS.", "hook": "Ascends up, recovers down. CSF protein goes UP too.", "source": "Prof deck CPN slides 3 to 7; Ch 14 p 706 to 707", "flag": null}, {"id": "W5_003", "topic": "Guillain Barre Syndrome", "difficulty": "Difficult", "type": "mc", "case": "W5_CASE2", "adpie": "Planning", "answer": [3], "r1": {"stem": "The provider tells Mr. Dupree there is a treatment that works best when started within the first 2 weeks to shorten and lessen his symptoms. Which treatment is this?", "options": ["IV antibiotics for 2 weeks", "Carbamazepine (Tegretol)", "Acyclovir", "Plasmapheresis"]}, "r2": {"stem": "Which therapy, given early in the first 2 weeks, decreases the severity and length of GBS symptoms?", "options": ["A 2 week course of intravenous antibiotics", "The antiseizure drug carbamazepine", "The antiviral acyclovir", "Plasma exchange (plasmapheresis)"]}, "r3": {"stem": "As the LVN helping plan Mr. Dupree's care with the RN, which early treatment do you expect so you can prepare him for it?", "options": ["Two weeks of IV antibiotic therapy", "Oral carbamazepine three times a day", "IV acyclovir", "Removal and replacement of plasma (plasmapheresis)"]}, "rationale": "Plasmapheresis in the FIRST 2 WEEKS decreases the severity and length of GBS symptoms by removing the circulating antibodies; IVIG is the alternative, and IVIG patients must be well hydrated with good renal function. GBS is autoimmune, not bacterial, so IV antibiotics (used for bacterial meningitis) do not treat it. Carbamazepine is the go to drug for trigeminal neuralgia. Acyclovir treats herpes infections such as HSV encephalitis. The prof deck and textbook also list adrenocortical steroids, which conflicts with current guidelines (see flag).", "hook": "Plasma Pheresis = Pull the Problem antibodies out.", "source": "Prof deck CPN slide 8; Ch 14 p 707", "flag": "N22: The prof deck and textbook list adrenocortical steroids for GBS, but current guidelines and NCLEX teaching say corticosteroids are NOT effective; plasmapheresis or IVIG are the treatments. Plasmapheresis in the first 2 weeks is safe on any exam; ask professor about steroids."}, {"id": "W5_004", "topic": "Guillain Barre Syndrome", "difficulty": "Intermediate", "type": "sata", "case": "W5_CASE2", "adpie": "Implementation", "answer": [0, 1, 2], "r1": {"stem": "Mr. Dupree is now on a ventilator. Which nursing actions are appropriate? Select all that apply.", "options": ["Talk to him and explain care, because his thinking is not affected", "Perform range of motion and reposition him to protect his skin", "Check vital signs and motor strength frequently", "Assume he cannot follow bedside conversations", "Hold physical therapy until he is fully recovered", "Tell his wife that full recovery from GBS almost never happens"]}, "r2": {"stem": "Which interventions belong in the plan of care for a ventilated patient with GBS? Select all that apply.", "options": ["Explain procedures and reassure him, since his cognition is intact", "Do ROM exercises and turn him to prevent contractures and pressure injuries", "Monitor VS and muscle strength often", "Speak freely at the bedside since he cannot understand", "Wait until he is discharged to start PT", "Prepare the family to expect permanent paralysis"]}, "r3": {"stem": "As the LVN caring for Mr. Dupree on the ventilator, which actions are within your role? Select all that apply.", "options": ["Orient and reassure him before each task, knowing his mind is fully awake", "Carry out ROM and turning per the care plan to prevent skin breakdown and contractures", "Collect frequent vital signs and motor strength checks and report changes", "Discuss his prognosis in front of him as if he cannot hear", "Cancel the early PT consult because he is too weak", "Tell his wife on your own that he will never walk again"]}, "rationale": "A ventilated GBS patient is fully alert inside a body that cannot move, so COGNITION IS NOT IMPAIRED: talk to him, explain care, and reassure him. Prevent contractures, pressure injuries, and loss of ROM, and start PT EARLY. Monitor VS and motor strength often and watch for hypoxia; fluctuating BP can occur from autonomic involvement. Never talk over him, and do not tell the family recovery is hopeless: about 70% have full recovery per the professor. Gabapentin or amitriptyline may be ordered for neuropathic pain.", "hook": "Paralyzed, not perplexed: he hears everything.", "source": "Prof deck CPN slides 8 to 9; Ch 14 p 707", "flag": "N26: GBS recovery: prof deck and chapter text say 70% full recovery; Ch 14 Key Points say 85% regain complete function. Pick 70% (professor value) and ask professor."}, {"id": "W5_005", "topic": "Bell Palsy and Trigeminal Neuralgia", "difficulty": "Basic", "type": "mc", "case": null, "adpie": "Implementation", "answer": [0], "r1": {"stem": "Delphine, a karaoke host, woke up with a drooping mouth and cannot close her right eyelid. She is diagnosed with Bell palsy. Which nursing action is the priority?", "options": ["Protect the right eye with artificial tears and an eye shield or taping at night", "Apply ice packs to the face every hour", "Keep her NPO until the paralysis resolves", "Have her chew only on the affected side to strengthen it"]}, "r2": {"stem": "A patient with Bell palsy cannot shut her right eye. What is the most important intervention?", "options": ["Keep the right eye moist with artificial tears and shield or tape it closed during sleep", "Put cold packs on her face hourly", "Withhold all food and fluids until she can smile again", "Tell her to chew on the weak side for exercise"]}, "r3": {"stem": "As the LVN caring for a patient with new Bell palsy whose right eyelid will not close, which action do you carry out first?", "options": ["Instill the ordered artificial tears and apply an eye shield before she sleeps", "Place an ice pack on her cheek every hour", "Post an NPO sign until her facial movement returns", "Coach her to chew food on the paralyzed side"]}, "rationale": "Bell palsy is inflammation of CN VII (facial nerve), usually viral, causing sudden one sided facial weakness: she cannot wrinkle her forehead, close the eyelid, smile, or whistle. Because the eyelid will not close, the cornea dries out and can be injured, so PROTECTING THE EYE is the priority: artificial tears and an eye shield or tape at night. Ice packs are not part of the plan; the textbook uses warm moist heat along the nerve. She does not need to be NPO, and chewing on the affected side is not a Bell palsy intervention.", "hook": "Bell palsy: Seven is the face nerve; the eye can't close, so cover the eye.", "source": "Prof deck CPN slides 10 to 12; Ch 14 p 705 to 706", "flag": null}, {"id": "W5_006", "topic": "Bell Palsy and Trigeminal Neuralgia", "difficulty": "Intermediate", "type": "mc", "case": null, "adpie": "Evaluation", "answer": [2], "r1": {"stem": "Delphine has been taught about her Bell palsy. Which statement shows she understood the teaching?", "options": ["'My trigeminal nerve, cranial nerve V, is the one that is inflamed.'", "'Bell palsy always affects both sides of the face.'", "'I will wrinkle my brow, close my eyes, and puff my cheeks for 5 minutes, 3 times a day.'", "'I can stop the prednisone the minute my smile comes back.'"]}, "r2": {"stem": "Which comment by a patient with Bell palsy indicates the teaching was effective?", "options": ["'The nerve causing this is cranial nerve V.'", "'Both sides of my face will droop with this disease.'", "'I'll do my facial exercises, like frowning, shutting my eyes, and puffing my cheeks, 5 minutes three times daily.'", "'Once I feel better I will quit my prednisone all at once.'"]}, "r3": {"stem": "As the LVN evaluating your reinforcement of discharge teaching, which statement from a patient with Bell palsy tells you the teaching worked?", "options": ["'This is a problem with my fifth cranial nerve.'", "'Expect the other half of my face to droop soon too.'", "'Five minutes of brow wrinkling, eye closing, and cheek puffing, three times a day. Got it.'", "'I'll toss the prednisone as soon as I can whistle.'"]}, "rationale": "The professor teaches facial exercises for 5 MINUTES, 3 TIMES A DAY (wrinkle the brow and forehead, close the eyes, puff the cheeks) to keep muscle tone. Bell palsy involves CN VII, the facial nerve; CN V is the trigeminal nerve. Per the professor it is UNILATERAL. Prednisone is started immediately and TAPERED over about 2 weeks, so it is not stopped abruptly. Taste returning in the first week is an early sign of improvement.", "hook": "5 minutes x 3 times a day = 5 x 3 face workout.", "source": "Prof deck CPN slides 10 to 12; Ch 14 p 705 to 706", "flag": "N23 and N25: Prof deck says Bell palsy recovery takes a few weeks to a month (age 20 to 60) and is UNILATERAL; textbook says 3 to 6 months (age 15 to 45) and can be bilateral. Use the professor values and unilateral on the exam; ask professor."}, {"id": "W5_007", "topic": "Bell Palsy and Trigeminal Neuralgia", "difficulty": "Intermediate", "type": "sata", "case": null, "adpie": "Planning", "answer": [0, 1, 2], "r1": {"stem": "Mr. Gallo, a retired auctioneer famous for talking at lightning speed, has trigeminal neuralgia. Which measures belong in his plan of care? Select all that apply.", "options": ["Chew food on the unaffected side", "Offer lukewarm, soft or pureed foods", "Keep the room free of drafts", "Serve ice cold smoothies to numb the pain", "Scrub the painful side of the face firmly to desensitize it"]}, "r2": {"stem": "Which interventions help prevent attacks for a patient with trigeminal neuralgia? Select all that apply.", "options": ["Use the side of the mouth that does not hurt for chewing", "Provide soft or pureed food served lukewarm", "Avoid cold air and drafts across the face", "Give very cold drinks to calm the nerve", "Rub the trigger area vigorously with a washcloth"]}, "r3": {"stem": "As the LVN contributing to Mr. Gallo's plan of care, which comfort measures do you include? Select all that apply.", "options": ["Remind him to chew on the side without pain", "Order his meal trays as soft foods at lukewarm temperature", "Close the window and move him away from the air vent", "Bring him a frozen slushie from the cafeteria", "Perform firm facial scrubs during morning care"]}, "rationale": "Trigeminal neuralgia is pressure on or degeneration of CN V, causing brief, excruciating, lightning like pain on ONE side of the face. The slightest stimulation triggers attacks: chewing, brushing teeth, hot or cold air, washing the face, yawning, and talking. So chew on the UNAFFECTED side, serve lukewarm soft or pureed food, and avoid drafts. Extreme temperatures (ice cold drinks) and touching or scrubbing the face can set off an attack. Because of pain, these patients often neglect hygiene and nutrition, so watch both.", "hook": "Tic douloureux: no drafts, no extremes, chew on the good side.", "source": "Prof deck CPN slides 13 to 15; Ch 14 p 704 to 705 and notes p 26", "flag": null}, {"id": "W5_008", "topic": "Bell Palsy and Trigeminal Neuralgia", "difficulty": "Basic", "type": "mc", "case": null, "adpie": "Planning", "answer": [1], "r1": {"stem": "Which medication do you expect the provider to order first line for trigeminal neuralgia?", "options": ["Pilocarpine", "Carbamazepine (Tegretol)", "Mannitol", "Acyclovir"]}, "r2": {"stem": "A patient with tic douloureux will most likely be started on which drug?", "options": ["The miotic eye drop pilocarpine", "The antiseizure drug carbamazepine", "The osmotic diuretic mannitol", "The antiviral acyclovir"]}, "r3": {"stem": "As the LVN reviewing the MAR for a patient admitted with trigeminal neuralgia, which ordered drug do you recognize as the expected treatment?", "options": ["Pilocarpine eye drops", "Carbamazepine by mouth", "IV mannitol", "IV acyclovir"]}, "rationale": "Trigeminal neuralgia (CN V) is treated first with ANTISEIZURE drugs such as carbamazepine (Tegretol), phenytoin (Dilantin), or gabapentin; baclofen is an antispasmodic option. If drugs fail, options include alcohol injection of the nerve branch and surgery to resect the sensory root. Mannitol treats cerebral edema, acyclovir treats herpes infections, and pilocarpine is a miotic for glaucoma.", "hook": "Tegretol tames the Trigeminal.", "source": "Prof deck CPN slide 14; Ch 14 p 704 to 705", "flag": null}, {"id": "W5_009", "topic": "Meningitis and Encephalitis", "difficulty": "Basic", "type": "mc", "case": null, "adpie": "Assessment", "answer": [3], "r1": {"stem": "When the nurse gently flexes Mr. Tran's neck toward his chest, his hips and knees bend on their own. What is this finding?", "options": ["Positive Romberg test", "Cushing triad", "Positive Kernig sign", "Positive Brudzinski sign"]}, "r2": {"stem": "A patient's hips and knees flex involuntarily when his neck is bent forward. Which sign is this?", "options": ["Romberg sign", "Cushing triad", "Kernig sign", "Brudzinski sign"]}, "r3": {"stem": "As the LVN, you observe that a feverish patient's knees and hips flex when his neck is flexed. Which sign do you document and report to the RN?", "options": ["A positive Romberg sign", "Signs of Cushing triad", "A positive Kernig sign", "A positive Brudzinski sign"]}, "rationale": "BRUDZINSKI sign is involuntary flexion of the hips and knees when the NECK is flexed; it signals meningeal irritation, as in meningitis. KERNIG sign is severe hamstring stiffness: the patient cannot straighten the leg when the hip is flexed to 90 degrees. Romberg tests balance with the feet together and eyes closed. Cushing triad (bradycardia, widening pulse pressure, irregular respirations) is a late sign of increased ICP.", "hook": "KERNIG = Knee won't straighten. BRUDZINSKI = Bend the neck, the legs Bend.", "source": "Prof deck CPN slides 16 to 21", "flag": null}, {"id": "W5_010", "topic": "Meningitis and Encephalitis", "difficulty": "Difficult", "type": "mc", "case": null, "adpie": "Planning", "answer": [0], "r1": {"stem": "A patient with suspected meningitis has orders for a CT scan and a lumbar puncture. Which plan is correct?", "options": ["Do the CT first to rule out increased ICP, then the LP only if ICP is not increased", "Do the LP first, because CSF results are needed before any imaging", "Skip both tests, since a positive Kernig sign confirms meningitis", "Do the LP during the CT scan to save time"]}, "r2": {"stem": "Which sequence of diagnostic tests is safest for a patient suspected of having meningitis?", "options": ["CT scan first to check for raised ICP; LP afterward if ICP is not elevated", "LP first, then imaging once the CSF is back", "No testing is needed when meningeal signs are present", "LP and CT performed at the same moment"]}, "r3": {"stem": "As the LVN preparing a patient with suspected meningitis for testing, which order of tests do you expect so you can prepare him correctly?", "options": ["Transport for CT first; the LP follows only if the CT shows no increased ICP", "Set up the LP tray first; CT can wait for the CSF results", "Cancel both tests because his Brudzinski sign is positive", "Set up the LP tray in the CT room so both happen at once"]}, "rationale": "The professor teaches CT FIRST to rule out increased ICP. An LP is CONTRAINDICATED with increased ICP, because removing CSF can cause brain herniation. If ICP is not increased, the LP is done and the CSF identifies the pathogen (bacterial meningitis shows pus, high protein, and high WBCs). Meningeal signs raise suspicion but do not identify the organism, so testing is still needed.", "hook": "See the brain before you tap the spine: CT then LP.", "source": "Prof deck CPN slides 19 to 20; Ch 14 notes p 28", "flag": null}, {"id": "W5_011", "topic": "Meningitis and Encephalitis", "difficulty": "Intermediate", "type": "mc", "case": null, "adpie": "Implementation", "answer": [2], "r1": {"stem": "Ms. Pickering, a school bus driver, is admitted with bacterial meningitis caused by Neisseria meningitidis. Which precaution is needed?", "options": ["Contact precautions for the full 2 weeks of antibiotics", "No precautions, since meningitis is not contagious", "Droplet precautions until at least 24 hours of effective antibiotics", "Standard precautions only"]}, "r2": {"stem": "Which isolation is appropriate for a patient with meningococcal meningitis?", "options": ["Contact isolation lasting the whole 2 week antibiotic course", "No isolation is required for meningitis", "Respiratory (droplet) isolation for at least the first 24 hours of effective antibiotic therapy", "Only the usual standard precautions"]}, "r3": {"stem": "As the LVN receiving a newly admitted patient with bacterial meningitis, which precaution do you put in place?", "options": ["Contact precautions until the antibiotic course is finished", "No isolation sign, because meningitis does not spread", "Droplet precautions, continued at least until 24 hours of effective antibiotics have been given", "Standard precautions and nothing more"]}, "rationale": "Bacterial meningitis requires DROPLET (respiratory) precautions until the pathogen is no longer found on a nasopharyngeal swab, which is AT LEAST the first 24 hours of effective antibiotics. Standard precautions alone are not enough for this droplet spread infection, and contact precautions do not address respiratory droplets. Bacterial meningitis IS contagious: close contacts receive prophylactic antibiotics. Treatment is multiple IV antibiotics for about 2 weeks.", "hook": "Meningitis = droplets for a day (at least 24 hours).", "source": "Prof deck CPN slides 20 to 21; Ch 14 p 707 to 708; tb AHN14_MC30 idea", "flag": null}, {"id": "W5_012", "topic": "Meningitis and Encephalitis", "difficulty": "Intermediate", "type": "sata", "case": null, "adpie": "Implementation", "answer": [0, 1, 2, 3], "r1": {"stem": "Which nursing actions are appropriate for a patient with bacterial meningitis? Select all that apply.", "options": ["Keep the room dark and quiet", "Give acetaminophen for high fever and use a cooling blanket if there is no response", "Monitor intake and output and give IV fluids for dehydration", "Expect close contacts to receive prophylactic antibiotics", "Keep the TV and bright lights on for stimulation", "Encourage lots of visitors to keep the patient alert"]}, "r2": {"stem": "Which interventions belong in the care of a patient with bacterial meningitis? Select all that apply.", "options": ["Provide a darkened room with minimal noise", "Treat fever with acetaminophen, adding a cooling blanket if needed", "Track I and O and provide IV hydration", "Anticipate preventive antibiotics for people in close contact", "Leave the lights and television on to keep the patient oriented", "Invite many visitors to provide stimulation"]}, "r3": {"stem": "As the LVN caring for a patient with bacterial meningitis, which actions do you carry out? Select all that apply.", "options": ["Dim the lights and limit noise in the room", "Give the ordered acetaminophen for fever and apply the cooling blanket if fever persists", "Measure I and O and maintain the ordered IV fluids", "Reinforce that household close contacts will be given preventive antibiotics", "Turn on the overhead lights and TV to keep the patient engaged", "Tell the family to bring the whole bowling league to visit"]}, "rationale": "A dark, quiet room matters because the patient is light sensitive, and ANY increase in sensory stimulation can trigger a seizure. Fever increases cerebral edema and seizure risk, so treat it with acetaminophen or an NSAID and use a cooling blanket if there is no response. Dehydration is common, so IV fluids and I and O are needed. Close contacts of bacterial meningitis get prophylactic antibiotics. Bright lights, TV, and crowds of visitors add stimulation and increase seizure risk.", "hook": "Meningitis room = movie theater before the show: dark and quiet.", "source": "Prof deck CPN slide 21; Ch 14 p 707 to 708", "flag": null}, {"id": "W5_013", "topic": "Meningitis and Encephalitis", "difficulty": "Difficult", "type": "mc", "case": null, "adpie": "Assessment", "answer": [1], "r1": {"stem": "Which presentation most suggests ENCEPHALITIS rather than bacterial meningitis?", "options": ["Sudden severe headache and stiff neck developing over a few hours", "Gradual onset of high fever, headache, seizures, and a changing level of consciousness", "Ascending symmetric weakness that starts in the feet", "One sided facial droop with loss of taste"]}, "r2": {"stem": "Which group of findings points toward encephalitis instead of meningitis?", "options": ["Abrupt headache with nuchal rigidity over hours", "Slowly developing fever, headache, seizures, and altered LOC", "Bilateral weakness moving up from the legs", "Unilateral facial paralysis and decreased taste"]}, "r3": {"stem": "As the LVN collecting data on a new admission, which pattern makes you suspect encephalitis and report to the RN for close ICP monitoring?", "options": ["A headache and stiff neck that came on suddenly this afternoon", "Fever, headache, and confusion that built up gradually, now with a seizure", "Leg weakness on both sides that is creeping upward", "Drooping on one side of the face with altered taste"]}, "rationale": "Encephalitis looks like meningitis, but its onset is GRADUAL, with headache, high fever, seizures, and LOC changes. CEREBRAL EDEMA is the major problem, so expect mannitol and dexamethasone, monitor for increased ICP, and keep the HOB at 30 to 45 degrees. HSV is the most common cause and acyclovir is the drug of choice. Sudden headache with stiff neck is classic meningitis, ascending weakness is GBS, and one sided facial droop with taste loss is Bell palsy.", "hook": "Meningitis is a Sprint (sudden); Encephalitis is a slow Escalator (gradual).", "source": "Prof deck CPN slides 22 to 23; Ch 14 p 708", "flag": null}, {"id": "W5_014", "topic": "Meningitis and Encephalitis", "difficulty": "Intermediate", "type": "mc", "case": null, "adpie": "Implementation", "answer": [3], "r1": {"stem": "Coach Barb, who runs dusk softball games by a pond, asks how to prevent West Nile virus. Which teaching is accurate?", "options": ["Wear a surgical mask, because West Nile spreads by respiratory droplets", "Never use DEET on anyone, because it is too toxic", "Play only at dusk, because mosquitoes stay away when it gets dark", "Use DEET 10 to 35% on skin and clothing, wear long sleeves, limit time outside from dusk to dawn, and empty standing water"]}, "r2": {"stem": "Which instruction correctly helps prevent West Nile virus infection?", "options": ["Mask up around people who cough, since it is droplet spread", "Avoid DEET completely because of its toxicity", "Schedule outdoor events at dusk when mosquitoes are least active", "Apply 10 to 35% DEET to skin and clothes, cover arms, stay in from dusk to dawn, and dump standing water"]}, "r3": {"stem": "As the LVN reinforcing community teaching about West Nile virus, which advice do you give?", "options": ["Wear a mask in crowds, because the virus spreads through coughing", "Throw out all insect repellent, because DEET always causes toxicity", "Move outdoor practices to dusk, when mosquitoes go to bed", "DEET at 10 to 35% for casual use (spray clothing too), long sleeves, limit dusk to dawn exposure, and empty water from buckets and birdbaths"]}, "rationale": "West Nile virus is spread by the bite of an infected FEMALE MOSQUITO, not by respiratory droplets, so standard precautions are used in the hospital. DEET has been the gold standard since 1946; 10 to 35% is adequate for casual use, and the AAP limits infants and children to 30% maximum, so DEET is not banned, just used correctly. Dusk to dawn is peak mosquito time. Most infections (70 to 80%) cause no symptoms, and under 1% become neuroinvasive.", "hook": "West Nile = mosquito bite: DEET, sleeves, no dusk, dump the water.", "source": "Ch 14 p 709 and notes p 28 to 29", "flag": null}, {"id": "W5_015", "topic": "Eye Anatomy and Vision Tests", "difficulty": "Intermediate", "type": "sata", "case": null, "adpie": "Assessment", "answer": [0, 1, 2, 3], "r1": {"stem": "Which statements about eye examinations are correct? Select all that apply.", "options": ["For the Snellen test, the patient stands 20 feet from the chart", "20/40 vision means the patient sees at 20 feet what a normal eye sees at 40 feet", "The Amsler grid checks central vision and the health of the macula", "Tonometry measures intraocular pressure", "20/40 vision means the patient sees at 40 feet what a normal eye sees at 20 feet", "The Amsler grid is the main test for peripheral vision"]}, "r2": {"stem": "Which facts about vision testing are accurate? Select all that apply.", "options": ["The Snellen chart is read from a distance of 20 feet", "A result of 20/40 means seeing at 20 feet what normal eyes see at 40 feet", "Staring at the dot on an Amsler grid assesses the macula and central vision", "Tonometry is how IOP is measured", "20/40 means seeing at 40 feet what normal eyes see at 20 feet", "Amsler grid testing is mainly for side vision"]}, "r3": {"stem": "As the LVN assisting in an eye clinic, which statements do you know to be correct when you reinforce what each test does? Select all that apply.", "options": ["Position the patient 20 feet from the Snellen chart", "A Snellen result of 20/40 means at 20 feet he sees what a typical eye sees at 40 feet", "Amsler grid: stare at the center dot and report wavy or missing areas, which checks the macula", "Tonometry, such as the air puff test, checks eye pressure", "20/40 means he must stand at 40 feet to see what others see at 20 feet", "Amsler grid is used to screen for tunnel vision"]}, "rationale": "The Snellen test checks visual ACUITY with the patient 20 feet from the chart. The top number is the patient's distance (20 feet) and the bottom is the distance at which a normal eye could read that line, so 20/40 means he sees at 20 feet what a normal eye sees at 40 feet (worse than 20/20). The Amsler grid checks CENTRAL vision and the macula (macular degeneration). Tonometry measures IOP (glaucoma); the air puff is most common, and Goldmann tonometry numbs the eye. Peripheral fields are tested with visual field and automated perimetry tests, not the Amsler grid.", "hook": "Snellen: top number = you, bottom number = a normal eye.", "source": "Ch 13 p 611 to 612; EAQ13_05, EAQ13_26; tb AHN13_MC01 idea (key corrected)", "flag": "Test bank AHN13_MC01 keys 20/40 as 20 feet, which is wrong. Correct: 20/40 means the patient sees at 20 feet what a normal eye sees at 40 feet (textbook p 612)."}, {"id": "W5_016", "topic": "Eye Anatomy and Vision Tests", "difficulty": "Basic", "type": "mc", "case": null, "adpie": "Assessment", "answer": [0], "r1": {"stem": "Which eye structure drains aqueous humor into the bloodstream and helps control intraocular pressure?", "options": ["Canal of Schlemm", "Optic disc", "Lacrimal gland", "Fovea centralis"]}, "r2": {"stem": "Aqueous humor leaves the eye and IOP is regulated through which structure?", "options": ["The canal of Schlemm", "The optic disc", "The lacrimal gland", "The fovea centralis"]}, "r3": {"stem": "As the LVN reinforcing glaucoma teaching, which structure do you explain is the drain that, when blocked, raises eye pressure?", "options": ["The canal of Schlemm, where the sclera and cornea meet", "The optic disc at the back of the eye", "The tear gland above and outside each eye", "The fovea in the center of the retina"]}, "rationale": "The canal of Schlemm is a venous sinus at the junction of the sclera and cornea that drains aqueous humor into the bloodstream and helps control IOP. The ciliary body constantly makes aqueous humor, so if drainage is blocked, pressure builds, which is the problem in glaucoma. The optic disc is where nerve fibers exit, the BLIND SPOT. The lacrimal gland makes tears, and the fovea centralis has densely packed cones for the sharpest vision.", "hook": "Schlemm = the eye's sink drain. Clogged drain = high pressure.", "source": "Ch 13 p 609 to 611", "flag": null}, {"id": "W5_017", "topic": "Blindness and Refractive Errors", "difficulty": "Basic", "type": "mc", "case": null, "adpie": "Implementation", "answer": [2], "r1": {"stem": "Mr. Okafor, a legally blind jazz pianist, is admitted after hip surgery. Which approach to his ADLs best builds independence and confidence?", "options": ["Speak loudly so he always knows where you are standing", "Do all of his ADLs for him quickly and efficiently", "Set aside extra time and assist only as needed so he can do what he can himself", "Help only if he specifically asks for it"]}, "r2": {"stem": "Which nursing approach to ADLs best fosters independence for a patient who is legally blind?", "options": ["Use a loud voice so he can locate you", "Complete all of his care for him to save time", "Allow extra time and help as necessary so he can perform his own self care", "Wait for him to request help before offering any"]}, "r3": {"stem": "As the LVN planning your morning with Mr. Okafor, which action best supports his independence with ADLs?", "options": ["Announce yourself in a loud, booming voice each time", "Bathe and dress him yourself so you stay on schedule", "Schedule extra time with him and assist only with the parts he cannot do", "Leave his supplies and check back only if he calls"]}, "rationale": "Allowing extra time for self care builds independence and confidence; assist as needed rather than taking over. Doing everything for him takes away independence, and waiting for him to ask fails because many patients will not ask even when they need help. Box 13.1 says to talk in a NORMAL tone; announce your presence when entering, introduce yourself, explain activity in the room, and announce when you leave. As a sighted guide, walk about 1 foot AHEAD while he holds the back of your arm near the elbow.", "hook": "Blind, not helpless: time, not takeover. Normal voice, announce in and out.", "source": "Ch 13 p 612 to 615; EAQ13_46 (missed item), EAQ13_20", "flag": null}, {"id": "W5_018", "topic": "Blindness and Refractive Errors", "difficulty": "Basic", "type": "mc", "case": null, "adpie": "Assessment", "answer": [1], "r1": {"stem": "Grandpa Rudy can read his racing program up close but cannot read the scoreboard across the track. Which refractive error fits, and where does light focus?", "options": ["Astigmatism; the lens is cloudy", "Myopia; light focuses in front of the retina", "Hyperopia; light focuses in front of the retina", "Hyperopia; light focuses behind the retina, so distance is blurry"]}, "r2": {"stem": "A patient sees close objects clearly but distant objects are blurry. Which condition is this, and what happens to light?", "options": ["Astigmatism caused by a clouded lens", "Nearsightedness (myopia), with light landing in front of the retina", "Farsightedness (hyperopia), with light landing in front of the retina", "Farsightedness (hyperopia), with light landing behind the retina and blurry distance vision"]}, "r3": {"stem": "As the LVN collecting a vision history, a patient says road signs are blurry until he is right next to them, but his phone is clear. Which finding do you recognize and report?", "options": ["Signs of astigmatism from a cloudy lens", "Signs of myopia, where light falls in front of the retina", "Signs of hyperopia, where light falls in front of the retina", "Signs of hyperopia, where light falls behind the retina and far objects blur"]}, "rationale": "In MYOPIA (nearsightedness) the eyeball is elongated, so light focuses IN FRONT of the retina and distant objects blur. In HYPEROPIA (farsightedness) light focuses BEHIND the retina and CLOSE objects blur. Astigmatism comes from abnormal corneal curvature, not a cloudy lens; a cloudy lens is a cataract. Myopia is the refractive error most often corrected by laser surgery, and patients stop wearing contacts 1 to 2 weeks before the surgical evaluation.", "hook": "MYopia = MY world is close. HYPERopia = HYPER far.", "source": "Ch 13 p 613 to 616; EAQ13_04", "flag": null}, {"id": "W5_019", "topic": "Eye Infections and Dry Eye", "difficulty": "Intermediate", "type": "sata", "case": null, "adpie": "Implementation", "answer": [0, 1, 3], "r1": {"stem": "Twins Kip and Kenzie, both makeup tutorial influencers, have bacterial conjunctivitis. Which teaching is correct? Select all that apply.", "options": ["Wash hands before and after touching the eyes or giving eye meds", "Use separate washcloths and towels", "Cover the eyes with eye pads at night to keep germs in", "Do not wear contact lenses during treatment", "Share eye makeup only with each other since you both have it", "Rinse contact lenses with tap water to clean them"]}, "r2": {"stem": "Which instructions are appropriate for a patient with bacterial pinkeye? Select all that apply.", "options": ["Perform hand hygiene before and after any contact with the eyes", "Keep personal towels and washcloths separate", "Place eye pads over the infected eyes overnight", "Leave contact lenses out until treatment is finished", "Sharing makeup is fine between family members who are infected", "Clean contacts using tap water"]}, "r3": {"stem": "As the LVN reinforcing discharge teaching for conjunctivitis, which instructions do you include? Select all that apply.", "options": ["Clean your hands every time before and after you touch your eyes", "Use your own towel and washcloth only", "Tape a gauze eye pad over each eye at bedtime", "Keep your contacts out while you are being treated", "Swapping mascara is fine since you both have pinkeye", "Tap water is a good rinse for your contact lenses"]}, "rationale": "Conjunctivitis spreads rapidly by HANDS and soiled items, so hand hygiene, separate towels and washcloths, and no contact lenses during treatment are key. EYE PADS ARE CONTRAINDICATED because they hold in warmth and moisture that promote bacterial growth. Makeup should not be shared and should be replaced after any eye infection. Tap water is never used on contacts (risk of Acanthamoeba keratitis). Warm compresses 2 to 4 times a day help, and for a hordeolum (stye) the top goal is also preventing spread with hand hygiene.", "hook": "Pinkeye: wash hands, own towel, no pads, no contacts.", "source": "Ch 13 p 617 to 619, p 633 Safety Alert; EAQ13_18, EAQ13_25, EAQ13_27", "flag": null}, {"id": "W5_020", "topic": "Eye Infections and Dry Eye", "difficulty": "Difficult", "type": "mc", "case": null, "adpie": "Implementation", "answer": [3], "r1": {"stem": "Lorraine, a daily lap swimmer who rinses her contacts in tap water, has SEVERE eye pain, photophobia, and tearing. She is diagnosed with keratitis. Which order would the nurse question?", "options": ["An oral analgesic", "Topical antibiotic drops", "Cycloplegic mydriatic drops", "Corticosteroid eye drops"]}, "r2": {"stem": "A patient has keratitis with intense eye pain and light sensitivity. Which prescribed medication should be clarified with the provider?", "options": ["A pain pill by mouth", "Antibiotic eye drops", "Cycloplegic mydriatic eye drops", "Steroid eye drops"]}, "r3": {"stem": "As the LVN checking the new orders for a patient with keratitis, which drug do you hold and clarify with the RN and provider before giving?", "options": ["Oral pain medication", "Antibiotic ophthalmic solution", "Cycloplegic mydriatic ophthalmic drops", "Corticosteroid ophthalmic drops"]}, "rationale": "In keratitis, CORTICOSTEROIDS ARE CONTRAINDICATED because they prolong the course, deepen ulceration, and cause systemic complications. Antibiotic drops, cycloplegic mydriatic drops (which rest the eye and dilate the pupil), and analgesics are all expected treatments. SEVERE EYE PAIN is the key symptom that sets keratitis apart, because the cornea is richly innervated. Rinsing contacts in tap water and frequent swimming raise the risk of Acanthamoeba keratitis. By contrast, dry eye causes a sandy, gritty feeling, and Schirmer's test is the definitive test.", "hook": "Keratitis: Killer pain, Keep steroids out.", "source": "Ch 13 p 619 to 621; EAQ13_54", "flag": null}, {"id": "W5_021", "topic": "Cataracts", "difficulty": "Intermediate", "type": "sata", "case": null, "adpie": "Assessment", "answer": [0, 1, 2, 3], "r1": {"stem": "Which factors are associated with cataract formation? Select all that apply.", "options": ["Aging", "Smoking", "Long term corticosteroid use", "Diabetes mellitus", "History of eye surgery", "Hypotension"]}, "r2": {"stem": "Which risk factors raise the chance of developing cataracts? Select all that apply.", "options": ["Advancing age", "Cigarette use", "Prolonged steroid therapy", "Diabetes", "Previous eye surgery", "Low blood pressure"]}, "r3": {"stem": "As the LVN collecting a health history before an eye exam, which findings do you flag as cataract risk factors? Select all that apply.", "options": ["The patient is 78 years old", "Smokes a pack a day", "Has taken prednisone for years", "Has type 2 diabetes", "Had LASIK 15 years ago", "Runs a low blood pressure"]}, "rationale": "Most cataracts are age related (senile); about 50% of people 65 to 74 have some cataract and about 70% after 75. Other links: diabetes, hypertension, smoking, UV light, long term systemic or topical corticosteroids, trauma, and maternal rubella (congenital). A history of eye surgery is NOT a listed risk factor, and hypotension is not either. Remember, the classic early symptom is PAINLESS blurred vision with glare that is worse at night.", "hook": "Cataract risks = A S S D: Age, Smoking, Steroids, Diabetes (plus UV and rubella).", "source": "Ch 13 p 621 to 622; EAQ13_36 (missed item), EAQ13_09; tb AHN13_SATA04 idea", "flag": null}, {"id": "W5_022", "topic": "Cataracts", "difficulty": "Intermediate", "type": "mc", "case": null, "adpie": "Evaluation", "answer": [0], "r1": {"stem": "Mrs. Pham, 79, who live streams her weekly bingo games, had cataract surgery on her right eye today. Which statement means she needs MORE teaching?", "options": ["'I'll sleep on my right side tonight so the eye can drain.'", "'I'll wear my eye shield at night.'", "'I won't bend over to tie my shoes or lift my grandson for a while.'", "'If I get sudden pain in that eye, I'll call the surgeon.'"]}, "r2": {"stem": "After right eye cataract extraction, which patient statement shows a need for further teaching?", "options": ["'Tonight I plan to lie on my right side to help it drain.'", "'The shield goes over my eye at bedtime.'", "'No bending down or heavy lifting for now.'", "'Sudden eye pain means I call the surgeon right away.'"]}, "r3": {"stem": "As the LVN reinforcing post op teaching after right cataract surgery, which statement tells you Mrs. Pham needs the teaching reviewed again?", "options": ["'Sleeping on my right side tonight will help it heal.'", "'I'll put the protective shield on before bed.'", "'My grandson will have to wait for a piggyback ride.'", "'I'll call right away if the eye suddenly hurts.'"]}, "rationale": "After cataract surgery the patient should NOT lie on the operative side the night after surgery; if turned, she goes on the UNAFFECTED side. Avoid anything that raises IOP: bending, lifting, coughing, sneezing, straining, and sudden head movement. Wear the eye shield at night, and report SUDDEN PAIN, decreased vision, flashes, floaters, or purulent drainage right away. Antibiotic and steroid drops continue for 1 to 2 weeks; slight redness, mild watering, and glare are normal for a while.", "hook": "Cataract post op: no bend, no lift, no lying on the fixed side.", "source": "Ch 13 p 622 to 624 (Care Plan 13.1); EAQ13_45; tb AHN13_MC13 idea", "flag": null}, {"id": "W5_023", "topic": "Glaucoma", "difficulty": "Basic", "type": "mc", "case": "W5_CASE1", "adpie": "Assessment", "answer": [2], "r1": {"stem": "Mr. Bellamy says, 'My straight ahead view is perfect, but I keep bumping door frames.' Which finding is consistent with his primary open angle glaucoma?", "options": ["Loss of central vision with straight lines looking wavy", "Flashes, floaters, and a curtain over one eye", "Gradual, painless loss of peripheral vision (tunnel vision)", "Sudden excruciating eye pain with nausea and vomiting"]}, "r2": {"stem": "Which symptom pattern matches primary open angle glaucoma?", "options": ["Blurry center of vision and distorted lines", "Flashing lights, floaters, and a shade over the eye", "Slow, painless narrowing of side vision", "Abrupt severe eye pain with vomiting"]}, "r3": {"stem": "As the LVN collecting data from Mr. Bellamy, which finding do you recognize as typical of his diagnosis?", "options": ["Trouble seeing faces in the center of his vision", "A dark curtain falling over one eye after flashes of light", "Bumping into things on both sides because his side vision has slowly faded without pain", "Severe eye pain that started suddenly with vomiting"]}, "rationale": "Primary open angle glaucoma (90% of primary glaucoma) is slow and painless: aqueous outflow is decreased at the trabecular meshwork (a 'clogged kitchen sink'), IOP slowly rises, and PERIPHERAL vision is lost first, causing tunnel vision. Normal IOP is 10 to 22 mm Hg, POAG is usually 22 to 32, and his 28 fits. Sudden severe pain with nausea and vomiting is ACUTE ANGLE CLOSURE glaucoma. Central vision loss with wavy lines is macular degeneration, and flashes, floaters, and a curtain mean retinal detachment.", "hook": "OPEN = slOw, painless, tunnel vision.", "source": "Ch 13 p 628 to 630; EAQ13_19", "flag": null}, {"id": "W5_024", "topic": "Glaucoma", "difficulty": "Difficult", "type": "mc", "case": "W5_CASE1", "adpie": "Assessment", "answer": [1], "r1": {"stem": "Mr. Bellamy, who has type 2 diabetes, is started on timolol eye drops. Which nursing consideration is most important?", "options": ["Give timolol with a high protein meal to improve absorption", "Monitor his blood glucose closely, because timolol can mask signs of hypoglycemia", "Expect a fast heart rate as a normal side effect", "Stop the timolol right away if his eyes sting"]}, "r2": {"stem": "Because Mr. Bellamy is diabetic, what is the key concern with his timolol?", "options": ["Timolol must be taken with protein for absorption", "Timolol can hide the warning signs of low blood sugar, so glucose needs close watching", "Tachycardia is an expected effect of timolol", "Any eye irritation means discontinue timolol at once"]}, "r3": {"stem": "As the LVN giving Mr. Bellamy his timolol drops, which data do you watch closely and report to the RN?", "options": ["Whether he ate enough protein with the dose", "His fingerstick glucose and any subtle signs of low blood sugar, since timolol can mask them", "A rising heart rate, which is the main expected effect", "Mild stinging, which means the drug must be stopped today"]}, "rationale": "Timolol is a beta blocker that lowers IOP by reducing aqueous production, and it can MASK HYPOGLYCEMIA (blunting the fast heart rate and tremor that warn of low sugar), so glucose must be watched closely in a diabetic. Beta blockers SLOW the heart (bradycardia), they do not cause tachycardia. Timolol should NOT be stopped abruptly; mild eye irritation is a known local side effect. Use caution in asthma and heart disease, and check IOP after 4 weeks. Protein interaction is a levodopa issue, not a timolol issue.", "hook": "Timolol hides the Tremor and Tachycardia of low sugar.", "source": "Ch 13 p 630 to 631 (Table 13.4); EAQ13_17", "flag": null}, {"id": "W5_025", "topic": "Glaucoma", "difficulty": "Intermediate", "type": "sata", "case": "W5_CASE1", "adpie": "Implementation", "answer": [0, 1, 2], "r1": {"stem": "Mr. Bellamy will use timolol and pilocarpine at home. Which teaching is correct? Select all that apply.", "options": ["Use the drops for life, even when you have no symptoms", "Press gently on the inner corner of the eye (lacrimal sac) for 1 minute after each drop", "Do not drive for 1 to 2 hours after using pilocarpine", "You can stop the drops once your eye pressure is normal", "Dilating drops like atropine are fine for tired eyes", "Aim the drop right onto the center of the cornea"]}, "r2": {"stem": "Which home instructions for glaucoma eye drops are accurate? Select all that apply.", "options": ["Drops are usually lifelong and continue even without symptoms", "Apply light pressure to the lacrimal sac for 1 minute after instilling", "Avoid driving for 1 to 2 hours after a miotic like pilocarpine", "Once IOP is back to normal the drops can be discontinued", "Atropine type drops are safe for eye fatigue", "Drop the medicine directly onto the middle of the cornea"]}, "r3": {"stem": "As the LVN reinforcing Mr. Bellamy's discharge teaching, which instructions do you include? Select all that apply.", "options": ["Keep using the drops every day for the rest of your life, symptoms or not", "Hold pressure at the inner corner of your eye for 1 minute after each drop", "Wait 1 to 2 hours after pilocarpine before you drive", "When your next pressure check is normal, you are done with drops", "Ask the pharmacy for atropine drops if your eyes feel strained", "Put the drop straight onto the clear front of your eye"]}, "rationale": "Glaucoma drops are usually LIFELONG and must continue even without symptoms, because damage is silent and IRREVERSIBLE. Pressing the lacrimal sac for 1 minute after drops reduces systemic absorption. Miotics like pilocarpine constrict the pupil and blur vision, so no driving for 1 to 2 hours; pilocarpine can also cause bronchospasm, so use caution in asthma. Mydriatic or cycloplegic drugs like ATROPINE dilate the pupil and must be AVOIDED. Drops go in the LOWER conjunctival sac, not onto the cornea.", "hook": "Glaucoma drops: for life, press 1 minute, park the car after pilocarpine.", "source": "Ch 13 p 609, p 630 to 631 (Table 13.4, Patient Teaching); EAQ13_43", "flag": null}, {"id": "W5_026", "topic": "Glaucoma", "difficulty": "Difficult", "type": "mc", "case": null, "adpie": "Implementation", "answer": [3], "r1": {"stem": "Bertha, 62, was at a dim movie theater when she developed excruciating eye pain, vomiting, colored halos, and a fixed, dilated pupil. Acute angle closure glaucoma is diagnosed. Which order should the nurse question?", "options": ["IV mannitol", "Acetazolamide (Diamox)", "Pilocarpine eye drops", "Cyclopentolate eye drops"]}, "r2": {"stem": "A patient with acute angle closure glaucoma has four new orders. Which one needs clarification before it is given?", "options": ["Mannitol IV infusion", "Acetazolamide", "Pilocarpine ophthalmic drops", "Cyclopentolate ophthalmic drops"]}, "r3": {"stem": "As the LVN, you receive orders for a patient in an acute angle closure glaucoma attack. Which medication do you hold and clarify with the RN and provider?", "options": ["The mannitol infusion", "The acetazolamide dose", "The pilocarpine drops", "The cyclopentolate drops"]}, "rationale": "Acute angle closure glaucoma is an EMERGENCY: the angle narrows, IOP may climb to 50 mm Hg or higher, and the patient has excruciating pain, nausea and vomiting, halos, and an enlarged fixed pupil. Treatment lowers IOP fast with an osmotic diuretic (mannitol; check VS at least hourly and potassium daily), a carbonic anhydrase inhibitor (acetazolamide), and miotics (pilocarpine), then iridectomy or iridotomy. Cyclopentolate is an anticholinergic that DILATES the pupil, which can close the angle further, so it is contraindicated. Darkness dilates the pupil too, which is why a dim theater can set off an attack.", "hook": "CLOSED = Crisis: pain, puke, fixed dilated pupil. Never dilate a closed angle.", "source": "Ch 13 p 629 to 631 (Table 13.4); tb AHN13_MC28 idea", "flag": "S5: Table 13.4 calls cyclopentolate a diagnostic agent for angle closure glaucoma, but the same row says it is CONTRAINDICATED in angle closure glaucoma and the teaching box says avoid mydriatics and cycloplegics. Exam answer: avoid them (hold and call the provider); ask professor."}, {"id": "W5_027", "topic": "Retinal Disorders", "difficulty": "Basic", "type": "mc", "case": null, "adpie": "Implementation", "answer": [0], "r1": {"stem": "Hal, a retired rodeo clown, calls the clinic: 'I saw flashes, then a bunch of floaters, and now it's like a curtain is coming down over my right eye. It doesn't hurt.' Which response is best?", "options": ["Tell him to come in to be seen right away, because these signs suggest retinal detachment", "Reassure him that since it is painless, it can wait for his yearly exam", "Have him apply warm compresses and call back in 4 hours", "Tell him to rub the eye firmly to clear out the floaters"]}, "r2": {"stem": "A patient describes painless flashes, floaters, and a shade falling over one eye. What should the nurse do?", "options": ["Treat it as an emergency and get him evaluated immediately for possible retinal detachment", "Tell him painless symptoms are not urgent", "Recommend warm compresses and a recheck later today", "Advise rubbing the eye to break up the floaters"]}, "r3": {"stem": "As the LVN answering the clinic phone, which action do you take for a caller reporting painless flashes, floaters, and a curtain over one eye?", "options": ["Notify the RN or provider at once and have him seen immediately for suspected retinal detachment", "Book him for a routine visit next month because there is no pain", "Suggest warm packs and ask him to call back this evening", "Tell him to massage the eye until the floaters go away"]}, "rationale": "Flashes of light, then floaters, then a CURTAIN or shade over the field is the classic picture of RETINAL DETACHMENT, and it is PAINLESS because the retina has no pain nerves. It requires IMMEDIATE treatment: if the macula is still attached, repair is done within 24 to 48 hours; if central vision is already affected, within 7 to 10 days. Check visual acuity first with any complaint of vision loss. No pain does not mean no emergency, and rubbing the eye could worsen injury. Reattachment succeeds in about 90%.", "hook": "Flashes, Floaters, Curtain, no pain = retinal detachment = EMERGENCY.", "source": "Ch 13 p 627 to 628; EAQ13_33; tb AHN13_MC15 idea", "flag": null}, {"id": "W5_028", "topic": "Retinal Disorders", "difficulty": "Difficult", "type": "mc", "case": null, "adpie": "Planning", "answer": [2], "r1": {"stem": "After a pneumatic retinopexy, a gas bubble was placed to press the retina back in place. Which instruction is most important for the success of the repair?", "options": ["Lie on your operative side to help the fluid drain", "You can go back to lifting weights tomorrow", "Keep your head in the ordered position, such as face forward, so the bubble stays on the tear", "Lie flat on your back for 48 hours"]}, "r2": {"stem": "Which teaching after pneumatic retinopexy most directly determines whether the repair works?", "options": ["Rest on the surgical side to drain the eye", "Return to heavy lifting the next day", "Maintain the prescribed head position, often head forward, so the gas presses on the break", "Stay flat and face up for 2 days"]}, "r3": {"stem": "As the LVN planning care after a pneumatic retinopexy, which priority do you build into the plan with the RN?", "options": ["Position him on the operative side", "Schedule his return to the gym for tomorrow", "Help him keep the ordered head position, such as face forward, so the gas bubble holds the retina in place", "Keep him supine and flat for 48 hours"]}, "rationale": "In pneumatic retinopexy, gas is injected into the vitreous to form a bubble that presses the retina against the tear, and the patient keeps the HEAD FORWARD (or the ordered position) for several weeks so the bubble stays on the break. Flat on the back would float the bubble away from many tears, and lying on the operative side is not the ordered position. Strenuous activity and heavy lifting are avoided. Teach him to report signs of FURTHER detachment: new flashes, more floaters, or blurred vision.", "hook": "Bubble floats UP, so the head goes DOWN and forward.", "source": "Ch 13 p 627 to 628; EAQ13_35; tb AHN13_MC25 idea", "flag": null}, {"id": "W5_029", "topic": "Retinal Disorders", "difficulty": "Intermediate", "type": "mc", "case": null, "adpie": "Implementation", "answer": [1], "r1": {"stem": "Mrs. Lindqvist, who still beats everyone at shuffleboard, has DRY age related macular degeneration. Which statement by the nurse is accurate?", "options": ["'You will lose your side vision first, like tunnel vision.'", "'Your side vision will be kept, so magnifiers and other low vision aids can help.'", "'Injections into the eye will reverse the dry type.'", "'The dry type is the rare kind, only about 10% of cases.'"]}, "r2": {"stem": "Which teaching about dry macular degeneration is correct?", "options": ["Peripheral vision disappears first, causing tunnel vision", "Peripheral vision is preserved, so low vision aids such as magnifiers are useful", "Eye injections can reverse dry macular degeneration", "Dry macular degeneration accounts for only 10% of cases"]}, "r3": {"stem": "As the LVN reinforcing teaching for a patient with dry ARMD, which information do you share?", "options": ["'Expect to lose the edges of your vision before the center.'", "'You will keep your peripheral vision, so devices like magnifiers can help you stay independent.'", "'Shots in the eye will bring back your central vision.'", "'You have the less common type of this disease.'"]}, "rationale": "ARMD is a slow, progressive loss of CENTRAL vision; PERIPHERAL vision is spared, so stressing that side vision will be kept and using low vision aids (magnifiers, telescopic lenses) is accurate and reassuring. DRY ARMD is the common type (90%) and has NO treatment; supplements may slow advancing disease. Injections (bevacizumab) and photodynamic therapy are for the WET type (10%), and lost central vision cannot be restored. Tunnel vision is glaucoma. Drusen are the hallmark, and the Amsler grid maps the involved areas.", "hook": "DRY = Dominant 90%, no treatment. WET = Wild new vessels, 10%. Center goes, sides stay.", "source": "Ch 13 p 625 to 627; EAQ13_53; tb AHN13_MC27 idea", "flag": null}, {"id": "W5_030", "topic": "Retinal Disorders", "difficulty": "Intermediate", "type": "mc", "case": null, "adpie": "Implementation", "answer": [3], "r1": {"stem": "Mr. Castillo, who has had type 2 diabetes for 12 years, says, 'I'm going blind anyway, so why bother controlling my sugar?' Which response is best?", "options": ["'Early retinopathy causes obvious blurry vision, so you'll know when to worry.'", "'Nearly all people with type 2 diabetes go completely blind within 10 years.'", "'Laser treatment can restore any vision you lose, so it's not a big deal.'", "'Retinopathy is more common with long standing, poorly controlled diabetes, so good control and regular dilated eye exams can delay it.'"]}, "r2": {"stem": "How should the nurse respond to a diabetic patient who feels blindness is unavoidable?", "options": ["Explain that the early stage causes noticeable blurring that will warn him", "Agree that almost every type 2 diabetic becomes blind within a decade", "Explain that photocoagulation brings back lost vision", "Explain that poor, long term glucose control raises the risk, and that control plus yearly dilated exams can slow retinopathy"]}, "r3": {"stem": "As the LVN reinforcing diabetic teaching, which statement do you use to motivate Mr. Castillo?", "options": ["'You'll notice blurry vision right away, so there's time to fix it.'", "'Blindness in 10 years is pretty much guaranteed with type 2.'", "'Don't worry, the laser can always give you your vision back.'", "'How well you control your sugar really changes the risk, and dilated eye exams can catch problems early when treatment works best.'"]}, "rationale": "Diabetic retinopathy risk rises with LONGER duration and POOR glucose control, so control truly matters. The early stage can last YEARS with no symptoms (microaneurysms are seen only by ophthalmoscopy), which is why regular DILATED eye exams are essential; early detection is the best treatment. After 15 years, about 80% of type 2 diabetics have SOME retinal disease, not total blindness. Photocoagulation destroys new vessels and seals leaks to PREVENT further loss but cannot increase acuity.", "hook": "Diabetic eyes: silent early, so dilate yearly.", "source": "Ch 13 p 624 to 625, p 634 to 635; EAQ13_41, EAQ13_31; tb AHN13_MC26 idea", "flag": null}, {"id": "W5_031", "topic": "Eye Injuries and Surgery", "difficulty": "Difficult", "type": "sata", "case": null, "adpie": "Implementation", "answer": [0, 1, 2], "r1": {"stem": "Which first aid actions for eye injuries are correct? Select all that apply.", "options": ["Chemical splash: flush immediately for at least 15 to 20 minutes, holding the lids apart", "Penetrating object: leave it in place and shield the eye with a cup that does not touch the object", "Penetrating injury: cover BOTH eyes for transport", "Corneal foreign body: remove it with a cotton swab", "Chemical splash: wait to flush until the exact chemical is identified", "Penetrating injury: press on the eyeball to stop bleeding"]}, "r2": {"stem": "Which emergency eye care measures are appropriate? Select all that apply.", "options": ["Irrigate a chemical burn right away for 15 to 20 minutes or longer with lids separated", "Do not remove an impaled object; protect it with a cup shield that does not touch it", "Patch both eyes when an object has penetrated one eye", "Wipe a corneal foreign body out with cotton", "Delay irrigation until poison control names the chemical", "Apply firm pressure to the injured globe"]}, "r3": {"stem": "As the LVN first on scene in the employee break room, which actions do you take? Select all that apply.", "options": ["A coworker splashed oven cleaner in her eye: start flushing immediately and keep going at least 15 to 20 minutes", "A coworker has a metal shard stuck in his eye: leave it alone and tape a paper cup over it without touching it", "Cover his uninjured eye too before he is transported", "Pick a speck off her cornea with a cotton ball", "Hold off flushing until someone reads the cleaner label", "Press firmly on the injured eye to control bleeding"]}, "rationale": "CHEMICAL BURNS are an emergency: flush IMMEDIATELY and copiously, at least 15 to 20 minutes, with the lids held apart; never delay to identify the chemical. With a PENETRATING wound, do not remove the object (only the ophthalmologist does), protect it with a shield such as a Styrofoam cup that does not touch it, and cover BOTH eyes because the eyes move together. Never use cotton on the cornea (it scratches) and never press on an injured globe. Watch for an irregular pupil on the injured side.", "hook": "Chemical = Flush Fast and Forever (15 to 20 min). Stuck object = Stays put, Cup it, cover both.", "source": "Ch 13 p 632 to 634 and Safety Alert; EAQ13_37; tb AHN13_MC03, AHN13_MC33 ideas", "flag": "S8: Burn flush time differs: textbook text says normal saline 20 minutes or longer; Safety Alert box says cool water 15 to 20 minutes or longer. Both mean flush IMMEDIATELY and LONG; pick immediate copious irrigation of at least 15 to 20 minutes."}, {"id": "W5_032", "topic": "Eye Injuries and Surgery", "difficulty": "Intermediate", "type": "mc", "case": null, "adpie": "Implementation", "answer": [0], "r1": {"stem": "Captain Morty, a pirate reenactor who already owns an eye patch, had an enucleation 6 hours ago. He now reports a headache. What is the priority action?", "options": ["Report it to the provider right away, because it may signal hemorrhage or infection", "Give PRN acetaminophen and recheck in an hour", "Turn him onto the affected side to put pressure on the socket", "Have him cough vigorously to clear his lungs"]}, "r2": {"stem": "A patient reports a new headache after enucleation. What should the nurse do first?", "options": ["Notify the provider immediately, since a headache may mean bleeding or infection", "Medicate with PRN acetaminophen and reassess later", "Position him on the operative side to tamponade bleeding", "Encourage strong coughing"]}, "r3": {"stem": "As the LVN caring for a patient 6 hours after enucleation who now has a headache, what is your priority?", "options": ["Report the headache to the RN and provider immediately as a possible sign of hemorrhage", "Give the PRN pain pill first and report at shift change", "Turn him onto his affected side", "Coach him through forceful coughing"]}, "rationale": "Enucleation is removal of the eyeball. Pain on the affected side of the head or ANY HEADACHE after surgery may mean hemorrhage or infection and must be REPORTED IMMEDIATELY, before simply medicating it. A pressure dressing controls bleeding and is checked at least EVERY HOUR for the first 24 hours. Avoid routine coughing and turning onto the affected side, which stress sutures and promote bleeding. The socket heals in about 6 weeks before a prosthesis is fitted, and grief is a normal response.", "hook": "Enucleation + headache = bleed until proven otherwise.", "source": "Ch 13 p 634; EAQ13_44; tb AHN13_MC24 idea", "flag": null}, {"id": "W5_033", "topic": "Eye Injuries and Surgery", "difficulty": "Difficult", "type": "mc", "case": null, "adpie": "Planning", "answer": [2], "r1": {"stem": "Mr. Abernathy, a crossword champion, had a keratoplasty (corneal transplant). Which post op instruction is correct?", "options": ["'Severe pain is expected for the first week, so just take your pills.'", "'Cough hard every hour to keep your lungs clear.'", "'Reading is limited for now, but watching TV is usually fine.'", "'Sleep on your operative side to protect the graft.'"]}, "r2": {"stem": "Which teaching is accurate after a corneal transplant?", "options": ["Severe pain is normal and does not need to be reported", "Cough forcefully every hour", "Reading should be limited, though TV watching is usually allowed", "Lie on the operated side at night"]}, "r3": {"stem": "As the LVN reinforcing post op teaching after keratoplasty, which instruction do you give?", "options": ["'Bad pain is normal, so there's no need to call.'", "'Do strong coughs every hour while awake.'", "'Go easy on the crosswords for now; TV is usually OK.'", "'Turn onto your surgical side to sleep.'"]}, "rationale": "After keratoplasty, READING is limited because side to side eye movement can loosen sutures, while TV is usually
